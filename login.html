<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESTRUCTURA - Iniciar sesión</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 360px; margin: 80px auto; padding: 0 20px; color: #333; }
    h1 { font-size: 20px; text-align: center; }
    label { display: block; font-weight: bold; font-size: 12px; margin-top: 14px; margin-bottom: 4px; }
    input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
    button { width: 100%; margin-top: 20px; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #0069d9; }
    button:disabled { background: #999; cursor: not-allowed; }
    .estado { font-size: 13px; margin-top: 12px; text-align: center; }
    .error { color: #dc3545; }
  </style>
</head>
<body>
  <h1><img src="IMAGES/IMAGEN-INICIAL-ESTRUCTURA01.jpg" alt="ESTRUCTURA" style="height:2.1em; vertical-align:middle; margin-right:8px;"> ESTRUCTURA</h1>

  <script>
    const SUPABASE_URL = 'https://wuarkraddnndmgvfnkmm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_qF-x44yXSydPBojMk_GOUg_TM34uXFI';
    const DOMINIO_SINTETICO = 'estructura.app.invalid';
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <form id="form-login">
    <label for="username">Usuario</label>
    <input type="text" id="username" autocomplete="username" required>

    <label for="password">Contraseña</label>
    <input type="password" id="password" autocomplete="current-password" required>

    <button type="submit" id="btn-login">Entrar</button>
    <div id="estado" class="estado"></div>
  </form>

  <script>
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // -------------------- Registro de comunicaciones (log_comunicaciones.html) --------------------
    // Envuelve fetch para dejar constancia de cada llamada de red que hace
    // esta página (casi siempre a Supabase): a dónde, cuánto tarda y qué
    // datos le pasa. Aparte del registro de actividad (audit_log), que es
    // de acciones del usuario, no de tráfico de red.
    function redactarCuerpoComunicacion(cuerpoTexto) {
      if (!cuerpoTexto) return null;
      try {
        const limpiar = (o) => {
          if (Array.isArray(o)) return o.map(limpiar);
          if (o && typeof o === 'object') {
            const copia = {};
            Object.keys(o).forEach(k => { copia[k] = /password|contrase/i.test(k) ? '***' : limpiar(o[k]); });
            return copia;
          }
          return o;
        };
        return JSON.stringify(limpiar(JSON.parse(cuerpoTexto))).slice(0, 4000);
      } catch (e) {
        return String(cuerpoTexto).slice(0, 4000);
      }
    }
    (function () {
      const _fetchOriginal = window.fetch.bind(window);
      window.fetch = async function (input, init) {
        const inicio = performance.now();
        const url = typeof input === 'string' ? input : (input && input.url) || '';
        const metodo = (init && init.method) || (typeof input === 'object' && input && input.method) || 'GET';
        if (url.indexOf('/comunicaciones_log') !== -1) return _fetchOriginal(input, init);
        let respuesta, errorMsg = null;
        try {
          respuesta = await _fetchOriginal(input, init);
          return respuesta;
        } catch (e) {
          errorMsg = e.message;
          throw e;
        } finally {
          const duracionMs = Math.round(performance.now() - inicio);
          const cuerpo = init && init.body && typeof init.body === 'string' ? redactarCuerpoComunicacion(init.body) : null;
          supabaseClient.from('comunicaciones_log').insert({
            metodo, url, cuerpo, duracion_ms: duracionMs,
            status_code: respuesta ? respuesta.status : null, error: errorMsg
          }).then(() => {}, () => {});
        }
      };
    })();

    // -------------------- Modo mantenimiento --------------------
    // Si está activo y quien entra no es ADMIN, lo manda a mantenimiento.html
    // en vez de dejarle seguir. Se llama justo después de conocer el rol.
    async function comprobarMantenimiento(rol) {
      if (rol === 'ADMIN') return false;
      try {
        const { data } = await supabaseClient.from('app_mantenimiento').select('activo').eq('id', 1).single();
        if (data && data.activo) { window.location.href = 'mantenimiento.html'; return true; }
      } catch (e) { /* si falla la comprobación, no se bloquea la app por eso */ }
      return false;
    }

    function obtenerParametroNext() {
      const params = new URLSearchParams(window.location.search);
      return params.get('next') || 'index.html';
    }

    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      const estadoEl = document.getElementById('estado');
      const btn = document.getElementById('btn-login');

      btn.disabled = true;
      btn.textContent = 'Entrando...';
      estadoEl.textContent = '';
      estadoEl.className = 'estado';

      const email = `${username}@${DOMINIO_SINTETICO}`;

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        btn.disabled = false;
        btn.textContent = 'Entrar';
        estadoEl.textContent = 'Usuario o contraseña incorrectos';
        estadoEl.className = 'estado error';
        try {
          await supabaseClient.functions.invoke('login-log', { body: { username } });
        } catch (e) {
          console.warn('No se pudo registrar el intento fallido:', e);
        }
        return;
      }

      try {
        await supabaseClient.from('audit_log').insert({
          accion: 'LOGIN', descripcion: `Inicio de sesión de "${username}"`, user_agent: navigator.userAgent
        });
      } catch (e) {
        console.warn('No se pudo registrar el login:', e);
      }

      const { data: perfil } = await supabaseClient
        .from('profiles')
        .select('debe_cambiar_password, rol')
        .eq('id', data.user.id)
        .single();

      if (perfil?.debe_cambiar_password) {
        window.location.href = 'cambiar-password.html';
        return;
      }

      if (await comprobarMantenimiento(perfil?.rol)) return;

      window.location.href = obtenerParametroNext();
    });
  </script>
</body>
</html>
