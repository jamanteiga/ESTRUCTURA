<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESTRUCTURA - Registro de actividad</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 1100px; margin: 30px auto; padding: 0 20px; color: #333; }
    h1 { font-size: 22px; }
    .card { background: #f8f9fa; border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    button { padding: 6px 12px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; }
    button.secundario { background: #6c757d; }
    button.secundario:hover { background: #5a6268; }
    .estado-msg { font-size: 13px; }

    .filtros { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .filtros select, .filtros input { padding: 7px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
    .filtros input[type="text"] { flex: 1; min-width: 200px; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; font-size: 12px; }
    th, td { padding: 7px; text-align: left; border-bottom: 1px solid #eee; vertical-align: top; }
    th { background: #1c6e8c; color: white; position: sticky; top: 0; }
    tr:hover { background: #f5f8ff; }
    .col-fecha { white-space: nowrap; color: #555; }
    .col-accion { white-space: nowrap; font-family: monospace; font-size: 11px; background: #eef3ff; padding: 2px 6px; border-radius: 4px; }
    .col-ip { white-space: nowrap; color: #888; font-size: 11px; }
    .contenedor-tabla { max-height: 65vh; overflow-y: auto; margin-top: 10px; }
    .paginacion { display: flex; justify-content: center; gap: 10px; margin-top: 12px; align-items: center; font-size: 13px; }

    .selector-vista { display: flex; gap: 6px; }
    .selector-vista button.activo { background: #14395c; }

    .timeline { list-style: none; padding: 0; margin: 10px 0 0; max-height: 65vh; overflow-y: auto; }
    .timeline li { display: flex; gap: 12px; padding: 10px 4px; border-bottom: 1px solid #eee; }
    .timeline .punto-tl {
      width: 12px; height: 12px; border-radius: 50%; background: #007bff; margin-top: 4px; flex-shrink: 0;
      box-shadow: 0 0 0 3px #eef3ff;
    }
    .timeline .punto-tl.fallo { background: #dc3545; box-shadow: 0 0 0 3px #fdecea; }
    .timeline .punto-tl.aprobar { background: #28a745; box-shadow: 0 0 0 3px #eafaf1; }
    .timeline .punto-tl.rechazar { background: #dc3545; box-shadow: 0 0 0 3px #fdecea; }
    .timeline .contenido-tl { flex: 1; font-size: 13px; }
    .timeline .fecha-tl { font-size: 11px; color: #888; }
    .timeline .accion-tl { font-family: monospace; font-size: 10px; background: #eef3ff; padding: 1px 5px; border-radius: 4px; margin-left: 6px; }

    .panel-ahora .grupo-persona { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
    .panel-ahora .nombre-persona { font-weight: bold; font-size: 14px; margin-bottom: 6px; }
    .panel-ahora .tarea-ahora { font-size: 12px; padding: 6px 0; border-top: 1px solid #f0f0f0; display: flex; justify-content: space-between; }
    .panel-ahora .tarea-ahora:first-of-type { border-top: none; }
    .panel-ahora .tiempo-transcurrido { color: #888; font-size: 11px; }
    .panel-ahora h3 { font-size: 14px; margin: 18px 0 8px; color: #14395c; }
    .panel-ahora h3:first-child { margin-top: 0; }
  </style>
</head>
<body>

  <div class="header-bar">
    <h1>🗒️ Registro de actividad</h1>
    <div>
      <span id="texto-usuario" class="estado-msg"></span>
      <button class="secundario" onclick="location.href='index.html'">🏠 Inicio</button>
      <button class="secundario" onclick="location.href='arbol.html'">🌳 Árbol</button>
      <button class="secundario" onclick="location.href='usuarios.html'">👤 Usuarios</button>
      <button style="background:#dc3545;" onclick="mostrarPanelAhora()">🔴 Ahora</button>
      <button class="secundario" onclick="cerrarSesion()">Cerrar sesión</button>
      <button style="background:#dc3545;" onclick="cerrarPagina()">❌ Cerrar</button>
    </div>
  </div>

  <div id="sin-permiso" style="display:none; color:#dc3545; font-weight:bold; text-align:center; margin-top:60px;">
    Solo ADMIN puede ver el registro de actividad.
  </div>

  <div id="panel" style="display:none;">
    <div class="card filtros">
      <select id="filtro-usuario"><option value="">Usuario: Todos</option></select>
      <select id="filtro-accion"><option value="">Acción: Todas</option></select>
      <input type="date" id="filtro-desde" title="Desde">
      <input type="date" id="filtro-hasta" title="Hasta">
      <input type="text" id="filtro-nodo" placeholder="Nodo (código)..." style="max-width:140px;">
      <input type="text" id="filtro-texto" placeholder="Buscar en la descripción...">
      <button class="secundario" onclick="limpiarFiltros()">✕ Limpiar</button>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; flex-wrap:wrap; gap:8px;">
        <div id="resumen-resultados" class="estado-msg" style="color:#666;"></div>
        <div style="display:flex; gap:8px; align-items:center;">
          <div class="selector-vista">
            <button class="secundario activo" id="btn-vista-tabla" onclick="cambiarVista('tabla')">📋 Tabla</button>
            <button class="secundario" id="btn-vista-timeline" onclick="cambiarVista('timeline')">🕐 Línea de tiempo</button>
          </div>
          <button class="secundario" onclick="exportar('csv')">⬇ Exportar CSV</button>
          <button class="secundario" onclick="exportar('xlsx')">⬇ Exportar Excel</button>
        </div>
      </div>
      <div class="contenedor-tabla" id="vista-tabla-contenedor">
        <table>
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Hora</th>
              <th>Usuario</th>
              <th>Rol</th>
              <th>Acción</th>
              <th>Nodo</th>
              <th>Descripción</th>
              <th>IP</th>
              <th>Navegador / SO</th>
            </tr>
          </thead>
          <tbody id="tabla-body">
            <tr><td colspan="9">Cargando...</td></tr>
          </tbody>
        </table>
      </div>
      <ul class="timeline" id="vista-timeline-contenedor" style="display:none;"></ul>
      <div class="paginacion" id="bloque-paginacion">
        <button class="secundario" id="btn-pag-anterior" onclick="paginaAnterior()">‹ Anterior</button>
        <span id="texto-pagina"></span>
        <button class="secundario" id="btn-pag-siguiente" onclick="paginaSiguiente()">Siguiente ›</button>
      </div>
    </div>

    <div class="card panel-ahora" id="panel-ahora" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <strong>🔴 Estado en directo — <span id="ahora-actualizado"></span></strong>
        <div>
          <button class="secundario" onclick="cargarPanelAhora()">🔄 Actualizar</button>
          <button class="secundario" onclick="ocultarPanelAhora()">✕ Volver al registro</button>
        </div>
      </div>
      <div id="ahora-contenido">Cargando...</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script>
    const SUPABASE_URL = 'https://wuarkraddnndmgvfnkmm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_qF-x44yXSydPBojMk_GOUg_TM34uXFI';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const POR_PAGINA = 50;
    let paginaActual = 0;
    let totalFilas = 0;
    let miPerfil = null;
    let vistaActual = 'tabla';

    const ICONOS_ACCION = {
      TOMAR_TAREA: '🖐', EMPEZAR: '▶', FINALIZAR: '✔', APROBAR: '✅', RECHAZAR: '❌',
      ASIGNAR: '👤', SIN_ASIGNAR: '↩️', REINICIAR_TAREA: '🔄',
      PENDIENTE_DUDAS: '❓', PENDIENTE_CAMBIOS_MODELO: '🔧',
      CREAR_NODO: '➕', EDITAR_NODO: '✎', DESACTIVAR_NODO: '🗑️', REACTIVAR_NODO: '♻️',
      LOGIN: '🔓', LOGIN_FALLIDO: '⛔', LOGOUT: '🔒'
    };
    function iconoParaAccion(accion) {
      if (accion === 'INTENTO_FALLIDO' || accion === 'LOGIN_FALLIDO') return '⛔';
      return ICONOS_ACCION[accion] || '•';
    }
    function claseParaAccion(accion) {
      if (accion === 'INTENTO_FALLIDO' || accion === 'LOGIN_FALLIDO') return 'fallo';
      if (accion === 'APROBAR') return 'aprobar';
      if (accion === 'RECHAZAR') return 'rechazar';
      return '';
    }

    function formatearFecha(iso) {
      const d = new Date(iso);
      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const aaaa = d.getFullYear();
      return `${dd}/${mm}/${aaaa}`;
    }
    function formatearHora(iso) {
      const d = new Date(iso);
      const h = d.getHours();
      const min = String(d.getMinutes()).padStart(2, '0');
      return `${h}:${min}`;
    }

    function etiquetaRol(rol) {
      if (rol === 'TRABAJADOR') return 'USUARIO';
      if (rol === 'REVISOR') return 'SUPERVISOR';
      return rol;
    }

    function resumirUserAgent(ua) {
      if (!ua) return '—';
      let so = 'SO desconocido';
      if (/Windows/i.test(ua)) so = 'Windows';
      else if (/Mac OS/i.test(ua)) so = 'macOS';
      else if (/Android/i.test(ua)) so = 'Android';
      else if (/iPhone|iPad/i.test(ua)) so = 'iOS';
      else if (/Linux/i.test(ua)) so = 'Linux';

      let nav = 'Navegador desconocido';
      if (/Edg\//i.test(ua)) nav = 'Edge';
      else if (/Chrome\//i.test(ua)) nav = 'Chrome';
      else if (/Firefox\//i.test(ua)) nav = 'Firefox';
      else if (/Safari\//i.test(ua)) nav = 'Safari';

      return `${nav} · ${so}`;
    }

    async function registrarLog(accion, descripcion) {
      try {
        await supabaseClient.functions.invoke('bright-processor', { body: { accion, descripcion } });
      } catch (e) {
        console.warn('No se pudo registrar el log:', e);
      }
    }

    async function cerrarSesion() {
      await registrarLog('LOGOUT', `Cerró sesión (${miPerfil?.username || ''})`);
      await supabaseClient.auth.signOut();
      window.location.href = 'login.html';
    }

    function cerrarPagina() {
      window.close();
      setTimeout(() => { history.back(); }, 150);
    }

    async function iniciar() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.href = 'login.html?next=log.html'; return; }

      const { data: perfil, error } = await supabaseClient
        .from('profiles').select('*').eq('id', session.user.id).single();

      if (error || !perfil || !perfil.activo || perfil.rol !== 'ADMIN') {
        document.getElementById('sin-permiso').style.display = 'block';
        return;
      }

      document.getElementById('texto-usuario').textContent = `${perfil.nombre_completo} (${perfil.username}) — ADMIN`;
      document.getElementById('panel').style.display = 'block';
      miPerfil = perfil;

      const { data: perfiles } = await supabaseClient.from('profiles').select('id, nombre_completo').order('nombre_completo');
      const selUsuario = document.getElementById('filtro-usuario');
      selUsuario.innerHTML = '<option value="">Usuario: Todos</option>' +
        (perfiles || []).map(p => `<option value="${p.id}">${p.nombre_completo}</option>`).join('');

      const params = new URLSearchParams(window.location.search);
      const nodoUrl = params.get('nodo');
      if (nodoUrl) document.getElementById('filtro-nodo').value = nodoUrl;

      ['filtro-usuario', 'filtro-accion', 'filtro-desde', 'filtro-hasta'].forEach(id => {
        document.getElementById(id).addEventListener('change', () => { paginaActual = 0; cargarLog(); });
      });
      let debounceTexto = null;
      document.getElementById('filtro-texto').addEventListener('input', () => {
        clearTimeout(debounceTexto);
        debounceTexto = setTimeout(() => { paginaActual = 0; cargarLog(); }, 300);
      });
      let debounceNodo = null;
      document.getElementById('filtro-nodo').addEventListener('input', () => {
        clearTimeout(debounceNodo);
        debounceNodo = setTimeout(() => { paginaActual = 0; cargarLog(); }, 300);
      });

      await cargarAccionesDisponibles();
      await cargarLog();
    }

    async function cargarAccionesDisponibles() {
      const { data } = await supabaseClient.from('audit_log').select('accion').limit(1000);
      const acciones = [...new Set((data || []).map(r => r.accion))].sort();
      const sel = document.getElementById('filtro-accion');
      sel.innerHTML = '<option value="">Acción: Todas</option>' +
        acciones.map(a => `<option value="${a}">${a}</option>`).join('');
    }

    function limpiarFiltros() {
      document.getElementById('filtro-usuario').value = '';
      document.getElementById('filtro-accion').value = '';
      document.getElementById('filtro-desde').value = '';
      document.getElementById('filtro-hasta').value = '';
      document.getElementById('filtro-texto').value = '';
      document.getElementById('filtro-nodo').value = '';
      paginaActual = 0;
      cargarLog();
    }

    function paginaAnterior() { if (paginaActual > 0) { paginaActual--; cargarLog(); } }
    function paginaSiguiente() { if ((paginaActual + 1) * POR_PAGINA < totalFilas) { paginaActual++; cargarLog(); } }

    function construirConsultaBase() {
      const usuarioId = document.getElementById('filtro-usuario').value;
      const accion = document.getElementById('filtro-accion').value;
      const desde = document.getElementById('filtro-desde').value;
      const hasta = document.getElementById('filtro-hasta').value;
      const texto = document.getElementById('filtro-texto').value.trim();
      const nodo = document.getElementById('filtro-nodo').value.trim();

      let query = supabaseClient.from('audit_log').select('*', { count: 'exact' }).order('creado_en', { ascending: false });
      if (usuarioId) query = query.eq('actor_id', usuarioId);
      if (accion) query = query.eq('accion', accion);
      if (desde) query = query.gte('creado_en', desde + 'T00:00:00');
      if (hasta) query = query.lte('creado_en', hasta + 'T23:59:59');
      if (texto) query = query.ilike('descripcion', `%${texto}%`);
      if (nodo) query = query.ilike('node_codigo', `%${nodo}%`);
      return query;
    }

    function cambiarVista(vista) {
      vistaActual = vista;
      document.getElementById('btn-vista-tabla').classList.toggle('activo', vista === 'tabla');
      document.getElementById('btn-vista-timeline').classList.toggle('activo', vista === 'timeline');
      document.getElementById('vista-tabla-contenedor').style.display = vista === 'tabla' ? 'block' : 'none';
      document.getElementById('vista-timeline-contenedor').style.display = vista === 'timeline' ? 'block' : 'none';
      document.getElementById('bloque-paginacion').style.display = vista === 'tabla' ? 'flex' : 'none';
      if (vista === 'timeline') cargarTimeline(); else cargarLog();
    }

    async function cargarTimeline() {
      const cont = document.getElementById('vista-timeline-contenedor');
      cont.innerHTML = '<li>Cargando...</li>';

      const LIMITE_TIMELINE = 500;
      const { data, error, count } = await construirConsultaBase()
        .order('creado_en', { ascending: true })
        .range(0, LIMITE_TIMELINE - 1);

      if (error) { cont.innerHTML = `<li style="color:red;">Error: ${error.message}</li>`; return; }

      if (!data || data.length === 0) {
        cont.innerHTML = '<li>No hay resultados con estos filtros.</li>';
        document.getElementById('resumen-resultados').textContent = 'Sin resultados.';
        return;
      }

      cont.innerHTML = data.map(fila => `
        <li>
          <span class="punto-tl ${claseParaAccion(fila.accion)}"></span>
          <div class="contenido-tl">
            <div>
              <strong>${iconoParaAccion(fila.accion)} ${fila.actor_nombre || '—'}</strong>
              (${etiquetaRol(fila.actor_rol) || '—'})
              ${fila.node_codigo ? ` — <strong>${fila.node_codigo}</strong>` : ''}
              <span class="accion-tl">${fila.accion}</span>
            </div>
            <div>${fila.descripcion}</div>
            <div class="fecha-tl">${formatearFecha(fila.creado_en)} · ${formatearHora(fila.creado_en)}</div>
          </div>
        </li>
      `).join('');

      document.getElementById('resumen-resultados').textContent = data.length >= LIMITE_TIMELINE
        ? `Mostrando los primeros ${LIMITE_TIMELINE} — reduce el rango de fechas para ver el resto en orden.`
        : `${data.length} hito(s) en orden cronológico.`;
    }

    async function cargarLog() {
      if (vistaActual === 'timeline') { await cargarTimeline(); return; }

      const tbody = document.getElementById('tabla-body');
      tbody.innerHTML = '<tr><td colspan="9">Cargando...</td></tr>';

      const query = construirConsultaBase().range(paginaActual * POR_PAGINA, paginaActual * POR_PAGINA + POR_PAGINA - 1);
      const { data, error, count } = await query;

      if (error) { tbody.innerHTML = `<tr><td colspan="9" style="color:red;">Error: ${error.message}</td></tr>`; return; }

      totalFilas = count || 0;

      tbody.innerHTML = (data || []).length === 0
        ? '<tr><td colspan="9">No hay resultados con estos filtros.</td></tr>'
        : data.map(fila => `
            <tr>
              <td class="col-fecha">${formatearFecha(fila.creado_en)}</td>
              <td class="col-fecha">${formatearHora(fila.creado_en)}</td>
              <td>${fila.actor_nombre || '—'}</td>
              <td>${etiquetaRol(fila.actor_rol) || '—'}</td>
              <td><span class="col-accion">${fila.accion}</span></td>
              <td>${fila.node_codigo || '—'}</td>
              <td>${fila.descripcion}</td>
              <td class="col-ip">${fila.ip || '—'}</td>
              <td class="col-ip">${resumirUserAgent(fila.user_agent)}</td>
            </tr>
          `).join('');

      const desdeN = paginaActual * POR_PAGINA + 1;
      const hastaN = Math.min((paginaActual + 1) * POR_PAGINA, totalFilas);
      document.getElementById('resumen-resultados').textContent = totalFilas === 0
        ? 'Sin resultados.'
        : `Mostrando ${desdeN}–${hastaN} de ${totalFilas}`;
      document.getElementById('texto-pagina').textContent = `Página ${paginaActual + 1}`;
      document.getElementById('btn-pag-anterior').disabled = paginaActual === 0;
      document.getElementById('btn-pag-siguiente').disabled = (paginaActual + 1) * POR_PAGINA >= totalFilas;
    }

    // -------------------- Exportar --------------------

    async function obtenerTodasLasFilasFiltradas() {
      const LOTE = 1000;
      let desde = 0;
      let todas = [];
      while (true) {
        const { data, error } = await construirConsultaBase().range(desde, desde + LOTE - 1);
        if (error) { alert('Error al exportar: ' + error.message); return null; }
        todas = todas.concat(data || []);
        if (!data || data.length < LOTE) break;
        desde += LOTE;
      }
      return todas;
    }

    function filaParaExportar(fila) {
      return {
        Fecha: formatearFecha(fila.creado_en),
        Hora: formatearHora(fila.creado_en),
        Usuario: fila.actor_nombre || '',
        Rol: etiquetaRol(fila.actor_rol) || '',
        Accion: fila.accion,
        Nodo: fila.node_codigo || '',
        Descripcion: fila.descripcion,
        IP: fila.ip || '',
        Navegador_SO: resumirUserAgent(fila.user_agent)
      };
    }

    async function exportar(formato) {
      const filas = await obtenerTodasLasFilasFiltradas();
      if (!filas) return;
      if (filas.length === 0) { alert('No hay resultados con estos filtros para exportar.'); return; }

      const datos = filas.map(filaParaExportar);
      const fechaArchivo = new Date().toISOString().slice(0, 10);

      if (formato === 'csv') {
        const cabeceras = Object.keys(datos[0]);
        const escapar = (v) => `"${String(v).replace(/"/g, '""')}"`;
        const lineas = [cabeceras.join(';')].concat(
          datos.map(fila => cabeceras.map(c => escapar(fila[c])).join(';'))
        );
        const csv = '\uFEFF' + lineas.join('\r\n'); // BOM para que Excel abra bien los acentos
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `registro-actividad-${fechaArchivo}.csv`;
        a.click();
        URL.revokeObjectURL(url);
      } else {
        const hoja = XLSX.utils.json_to_sheet(datos);
        const libro = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(libro, hoja, 'Registro');
        XLSX.writeFile(libro, `registro-actividad-${fechaArchivo}.xlsx`);
      }

      registrarLog('EXPORT_LOG', `Exportó el registro de actividad a ${formato.toUpperCase()} (${datos.length} filas, con los filtros aplicados en pantalla)`);
    }

    // -------------------- Panel "Ahora" (estado en directo) --------------------

    function mostrarPanelAhora() {
      document.getElementById('panel').querySelectorAll(':scope > .card:not(.panel-ahora)').forEach(el => el.style.display = 'none');
      document.getElementById('panel-ahora').style.display = 'block';
      cargarPanelAhora();
    }

    function ocultarPanelAhora() {
      document.getElementById('panel-ahora').style.display = 'none';
      document.getElementById('panel').querySelectorAll(':scope > .card:not(.panel-ahora)').forEach(el => el.style.display = 'block');
    }

    function formatearTranscurrido(iso) {
      const minutos = Math.floor((new Date() - new Date(iso)) / 60000);
      const horas = Math.floor(minutos / 60);
      const mins = minutos % 60;
      return `hace ${horas}h ${String(mins).padStart(2, '0')}min`;
    }

    async function cargarPanelAhora() {
      const cont = document.getElementById('ahora-contenido');
      cont.innerHTML = 'Cargando...';
      document.getElementById('ahora-actualizado').textContent = `actualizado a las ${formatearHora(new Date().toISOString())}`;

      const { data: filas, error } = await supabaseClient
        .from('nodes')
        .select(`
          codigo, nombre, tipo, activo,
          node_workflow ( trabajador_id, revisor_id, trabajo_estado, revision_estado, trabajo_iniciado_en, trabajo_terminado_en )
        `)
        .eq('activo', true);

      if (error) { cont.innerHTML = `<p style="color:red;">Error: ${error.message}</p>`; return; }

      const nodos = filas.map(n => {
        const wf = Array.isArray(n.node_workflow) ? n.node_workflow[0] : n.node_workflow;
        return { codigo: n.codigo, nombre: n.nombre, ...wf };
      }).filter(n => n.trabajador_id || n.revisor_id);

      const idsPersonas = [...new Set(nodos.flatMap(n => [n.trabajador_id, n.revisor_id]).filter(Boolean))];
      let nombres = {};
      if (idsPersonas.length > 0) {
        const { data: perfiles } = await supabaseClient.from('profiles').select('id, nombre_completo').in('id', idsPersonas);
        (perfiles || []).forEach(p => { nombres[p.id] = p.nombre_completo; });
      }

      function agruparPorPersona(lista, campoPersona) {
        const grupos = {};
        lista.forEach(n => {
          const id = n[campoPersona];
          if (!id) return;
          if (!grupos[id]) grupos[id] = [];
          grupos[id].push(n);
        });
        return grupos;
      }

      function pintarGrupo(grupos, campoFecha, etiquetaVacio) {
        const ids = Object.keys(grupos);
        if (ids.length === 0) return `<p style="color:#888; font-size:13px;">${etiquetaVacio}</p>`;
        return ids.map(id => `
          <div class="grupo-persona">
            <div class="nombre-persona">${nombres[id] || '?'}</div>
            ${grupos[id].map(n => `
              <div class="tarea-ahora">
                <span><strong>${n.codigo}</strong> ${n.nombre}</span>
                <span class="tiempo-transcurrido">${n[campoFecha] ? formatearTranscurrido(n[campoFecha]) : ''}</span>
              </div>
            `).join('')}
          </div>
        `).join('');
      }

      const trabajando = nodos.filter(n => n.trabajo_estado === 'EN_TRABAJO');
      const pendienteRevision = nodos.filter(n => n.revision_estado === 'PENDIENTE' || n.revision_estado === 'EN_REVISION');
      const dudas = nodos.filter(n => n.trabajo_estado === 'PENDIENTE_DUDAS');
      const cambiosModelo = nodos.filter(n => n.trabajo_estado === 'PENDIENTE_CAMBIOS_MODELO');

      cont.innerHTML = `
        <h3>🔨 Trabajando ahora mismo (${trabajando.length})</h3>
        ${pintarGrupo(agruparPorPersona(trabajando, 'trabajador_id'), 'trabajo_iniciado_en', 'Nadie está trabajando en nada ahora mismo.')}

        <h3>⏳ Pendientes de revisión, por supervisor (${pendienteRevision.length})</h3>
        ${pintarGrupo(agruparPorPersona(pendienteRevision, 'revisor_id'), 'trabajo_terminado_en', 'No hay nada pendiente de revisión ahora mismo.')}

        <h3>❓ Pendientes de dudas (${dudas.length})</h3>
        ${pintarGrupo(agruparPorPersona(dudas, 'trabajador_id'), 'trabajo_iniciado_en', 'Ninguna ahora mismo.')}

        <h3>🔧 Pendientes de cambios de modelo (${cambiosModelo.length})</h3>
        ${pintarGrupo(agruparPorPersona(cambiosModelo, 'trabajador_id'), 'trabajo_iniciado_en', 'Ninguna ahora mismo.')}
      `;
    }

    iniciar();
  </script>
</body>
</html>
