    // Supabase/PostgREST corta cada consulta a 1000 filas por defecto salvo

    async function paginarSelect(factoriaQuery, tamPagina = 1000) {

        todos = todos.concat(data || []);
        if (!data || data.length < tamPagina) break;
        desde += tamPagina;

      return { data: todos, error: null };

// ---------------------------------------------------------------------
// Núcleo de cálculo compartido por rutacritica.html, pert.html, Scrum.html,
// scrumban.html, GantWF.html y lean.html. Este fichero se prueba aquí con
// datos simulados (node) y luego su código se copia literalmente dentro de
// cada página (misma convención que el resto de la app: cada .html es
// autocontenido, sin imports compartidos).
// ---------------------------------------------------------------------

const UN_DIA_MS = 86400000;
const UNA_HORA_MS = 3600000;

// -------------------- CPM extendido (ES/EF/LS/LF/holgura + cadena crítica) --------------------
// idsNodos: ids de las tareas (hojas) de un buque (o del conjunto que se
// quiera analizar). mapaNodoPorId: id -> nodo (con fecha_inicio_prevista/
// fecha_fin_prevista). dependencias: filas de node_dependencias
// (predecesor_id/sucesor_id), de TODO el dataset (se filtran aquí).
function calcularCPM(idsNodos, mapaNodoPorId, dependencias) {
  const rango = {};
  idsNodos.forEach(id => {
    const n = mapaNodoPorId[id];
    if (n && n.fecha_inicio_prevista && n.fecha_fin_prevista) {
      rango[id] = { inicio: new Date(n.fecha_inicio_prevista), fin: new Date(n.fecha_fin_prevista) };
    }
  });
  const ids = Object.keys(rango);
  const excluidos = idsNodos.filter(id => !rango[id]);
  if (ids.length === 0) {
    return { ES: {}, EF: {}, LS: {}, LF: {}, holguras: new Map(), criticos: new Set(), cadenaCritica: [], excluidos, sinDependencias: true };
  }

  const sucesoresDe = {}, predecesoresDe = {};
  ids.forEach(id => { sucesoresDe[id] = []; predecesoresDe[id] = []; });
  let numDependenciasRelevantes = 0;
  dependencias.forEach(d => {
    if (rango[d.predecesor_id] && rango[d.sucesor_id]) {
      sucesoresDe[d.predecesor_id].push(d.sucesor_id);
      predecesoresDe[d.sucesor_id].push(d.predecesor_id);
      numDependenciasRelevantes++;
    }
  });

  const duracionMs = id => Math.max(rango[id].fin - rango[id].inicio, 0);
  const EF = {};
  function calcularEF(id, pila) {
    if (EF[id] !== undefined) return EF[id];
    if (pila.has(id)) return EF[id] = rango[id].fin; // ciclo: se corta aquí, no se cuelga
    pila.add(id);
    let inicioReal = rango[id].inicio;
    predecesoresDe[id].forEach(pid => {
      const ef = calcularEF(pid, pila);
      if (ef > inicioReal) inicioReal = ef;
    });
    return EF[id] = new Date(inicioReal.getTime() + duracionMs(id));
  }
  ids.forEach(id => calcularEF(id, new Set()));

  const finProyecto = new Date(Math.max(...ids.map(id => EF[id].getTime())));
  const LS = {};
  function calcularLS(id, pila) {
    if (LS[id] !== undefined) return LS[id];
    if (pila.has(id)) return LS[id] = finProyecto;
    pila.add(id);
    const sucs = sucesoresDe[id];
    const finTardio = sucs.length === 0 ? finProyecto : new Date(Math.min(...sucs.map(sid => calcularLS(sid, pila).getTime())));
    return LS[id] = new Date(finTardio.getTime() - duracionMs(id));
  }
  ids.forEach(id => calcularLS(id, new Set()));

  const ES = {}, LF = {};
  ids.forEach(id => {
    ES[id] = new Date(EF[id].getTime() - duracionMs(id));
    LF[id] = new Date(LS[id].getTime() + duracionMs(id));
  });

  const criticos = new Set();
  const holguras = new Map();
  ids.forEach(id => {
    const holguraMs = LS[id].getTime() - ES[id].getTime();
    holguras.set(id, Math.round(holguraMs / UN_DIA_MS));
    if (Math.abs(holguraMs) < UNA_HORA_MS) criticos.add(id);
  });

  // Cadena crítica ordenada: partiendo de los nodos críticos sin predecesor
  // crítico, se sigue por sucesores críticos hasta el final. Si hay varias
  // ramas críticas (caso normal en un grafo real), se listan todas.
  const cadenaCritica = [];
  const inicios = ids.filter(id => criticos.has(id) && !predecesoresDe[id].some(p => criticos.has(p)));
  const visitados = new Set();
  function seguirCadena(id, cadenaActual) {
    cadenaActual.push(id);
    visitados.add(id);
    const siguientesCriticos = sucesoresDe[id].filter(s => criticos.has(s));
    if (siguientesCriticos.length === 0) {
      cadenaCritica.push(cadenaActual.slice());
    } else {
      siguientesCriticos.forEach(s => {
        if (!cadenaActual.includes(s)) seguirCadena(s, cadenaActual);
        else cadenaCritica.push(cadenaActual.slice());
      });
    }
    cadenaActual.pop();
  }
  inicios.forEach(id => seguirCadena(id, []));
  // Nodos críticos aislados (sin dependencias) que no arrancan ninguna
  // cadena porque ya están en otra rama: los que queden sueltos van solos.
  ids.forEach(id => { if (criticos.has(id) && !visitados.has(id)) cadenaCritica.push([id]); });

  return {
    ES, EF, LS, LF, holguras, criticos, cadenaCritica, excluidos,
    sinDependencias: numDependenciasRelevantes === 0
  };
}

// -------------------- Sprints quincenales automáticos --------------------
// nodos: tareas con fecha_inicio_prevista/fecha_fin_prevista (ya filtradas a
// las que tengan ambas fechas). Devuelve la lista de sprints [{numero,
// inicio, fin}] y una función para saber a qué sprint pertenece un nodo.
function calcularSprints(nodos, duracionDias = 14) {
  const conFecha = nodos.filter(n => n.fecha_inicio_prevista && n.fecha_fin_prevista);
  if (conFecha.length === 0) return { sprints: [], indiceDeNodo: () => -1 };

  const minInicio = new Date(Math.min(...conFecha.map(n => new Date(n.fecha_inicio_prevista).getTime())));
  const maxFin = new Date(Math.max(...conFecha.map(n => new Date(n.fecha_fin_prevista).getTime())));
  const anclaje = new Date(minInicio); anclaje.setHours(0, 0, 0, 0);
  const duracionMs = duracionDias * UN_DIA_MS;
  const numSprints = Math.max(1, Math.ceil(((maxFin.getTime() - anclaje.getTime()) || 1) / duracionMs));

  const sprints = [];
  for (let i = 0; i < numSprints; i++) {
    const inicio = new Date(anclaje.getTime() + i * duracionMs);
    const fin = new Date(anclaje.getTime() + (i + 1) * duracionMs - UN_DIA_MS);
    sprints.push({ numero: i + 1, inicio, fin });
  }

  function indiceDeNodo(n) {
    if (!n.fecha_inicio_prevista) return -1;
    const f = new Date(n.fecha_inicio_prevista).getTime();
    let idx = Math.floor((f - anclaje.getTime()) / duracionMs);
    if (idx < 0) idx = 0;
    if (idx > numSprints - 1) idx = numSprints - 1;
    return idx;
  }

  return { sprints, indiceDeNodo };
}

// -------------------- Agregación de rango de fechas por Bloque (GantWF) --------------------
// nodos: todos los nodos activos (con parent_id/tipo). Devuelve, para cada
// nodo de tipo BLOQUE (o el "contenedor de segundo nivel" bajo un BUQUE si
// no hay tipo BLOQUE), el rango [minInicio, maxFin] agregado de sus
// descendientes con fechas, más el nº de tareas y cuántas aprobadas.
function calcularRangoBloques(nodos, calcularEstadoPropioFn) {
  const mapa = {};
  nodos.forEach(n => { mapa[n.id] = n; });

  function buqueDe(n) {
    let a = n;
    while (a) { if (a.tipo === 'BUQUE') return a; a = a.parent_id ? mapa[a.parent_id] : null; }
    return null;
  }
  function bloqueDe(n) {
    let a = n;
    while (a) {
      if (a.tipo === 'BLOQUE') return a;
      a = a.parent_id ? mapa[a.parent_id] : null;
    }
    return null;
  }

  const porBloque = {};
  nodos.forEach(n => {
    if (n.tipo === 'BUQUE' || n.tipo === 'BLOQUE') return; // solo hojas/contenedores intermedios cuentan como "tarea"
    const bloque = bloqueDe(n);
    if (!bloque) return;
    if (!porBloque[bloque.id]) {
      porBloque[bloque.id] = { bloque, buque: buqueDe(bloque), inicio: null, fin: null, total: 0, aprobadas: 0 };
    }
    const acc = porBloque[bloque.id];
    acc.total++;
    if (calcularEstadoPropioFn(n) === 'aprobado') acc.aprobadas++;
    if (n.fecha_inicio_prevista) {
      const f = new Date(n.fecha_inicio_prevista);
      if (!acc.inicio || f < acc.inicio) acc.inicio = f;
    }
    if (n.fecha_fin_prevista) {
      const f = new Date(n.fecha_fin_prevista);
      if (!acc.fin || f > acc.fin) acc.fin = f;
    }
  });

  return Object.values(porBloque);
}

// -------------------- Métricas Lean: cycle time / lead time / throughput --------------------
// nodos: tareas de un buque (u ficheros). Cycle time = fecha_fin_real -
// fecha_inicio_real (solo tareas ya trabajadas de principio a fin). Lead
// time = fecha_fin_real - fecha_inicio_prevista (desde que se planificó
// hasta que se terminó). Throughput = nº de tareas con fecha_fin_real por
// semana (agrupadas por semana ISO de esa fecha).
function calcularMetricasLean(nodos) {
  const completadas = nodos.filter(n => n.fecha_inicio_real && n.fecha_fin_real);
  const cycleTimes = completadas.map(n => (new Date(n.fecha_fin_real) - new Date(n.fecha_inicio_real)) / UN_DIA_MS);
  const leadTimes = nodos
    .filter(n => n.fecha_inicio_prevista && n.fecha_fin_real)
    .map(n => (new Date(n.fecha_fin_real) - new Date(n.fecha_inicio_prevista)) / UN_DIA_MS);

  const media = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null;

  const porSemana = {};
  completadas.forEach(n => {
    const d = new Date(n.fecha_fin_real);
    // Semana ISO simplificada: año + nº de semana desde el lunes más cercano.
    const jueves = new Date(d); jueves.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));
    const primerEnero = new Date(jueves.getFullYear(), 0, 1);
    const numSemana = Math.ceil((((jueves - primerEnero) / UN_DIA_MS) + 1) / 7);
    const clave = `${jueves.getFullYear()}-S${String(numSemana).padStart(2, '0')}`;
    porSemana[clave] = (porSemana[clave] || 0) + 1;
  });

  return {
    cycleTimeMedioDias: media(cycleTimes),
    leadTimeMedioDias: media(leadTimes),
    throughputPorSemana: porSemana,
    numCompletadas: completadas.length
  };
}

    function nodosDeBuque(buqueId) {
      return todosLosNodos.filter(n => !TIPOS_SIN_ASIGNACION.has(n.tipo) && n.tipo !== 'BLOQUE').filter(n => { const b = buqueDeNodo(n); return b && b.id === buqueId; });
    }

    // Nivel (columna) de cada nodo = 1 + nivel máximo de sus predecesores (0
    // si no tiene). Protegido contra ciclos igual que el CPM.
    function calcularNiveles(ids, predecesoresDe) {
      const nivel = {};
      function calc(id, pila) {
        if (nivel[id] !== undefined) return nivel[id];
        if (pila.has(id)) return nivel[id] = 0;
        pila.add(id);
        const preds = predecesoresDe[id] || [];
        const n = preds.length === 0 ? 0 : 1 + Math.max(...preds.map(p => calc(p, pila)));
        return nivel[id] = n;
      }
      ids.forEach(id => calc(id, new Set()));
      return nivel;
    }

    function dibujarSvg(ids, r, predecesoresDe, sucesoresDe) {
      const ANCHO_NODO = 140, ALTO_NODO = 48, GAP_X = 70, GAP_Y = 16, PAD = 30;
      const niveles = calcularNiveles(ids, predecesoresDe);
      const numNiveles = Math.max(...Object.values(niveles)) + 1;
      const columnas = [];
      for (let i = 0; i < numNiveles; i++) columnas.push([]);
      ids.forEach(id => columnas[niveles[id]].push(id));
      columnas.forEach(col => col.sort((a, b) => (r.ES[a] || 0) - (r.ES[b] || 0) || mapaNodoPorId[a].codigo.localeCompare(mapaNodoPorId[b].codigo, 'es')));

      const pos = {};
      columnas.forEach((col, ci) => {
        col.forEach((id, fi) => {
          pos[id] = { x: PAD + ci * (ANCHO_NODO + GAP_X), y: PAD + fi * (ALTO_NODO + GAP_Y) };
        });
      });
      const maxFilas = Math.max(...columnas.map(c => c.length));
      const anchoTotal = PAD * 2 + numNiveles * ANCHO_NODO + (numNiveles - 1) * GAP_X;
      const altoTotal = PAD * 2 + maxFilas * ALTO_NODO + (maxFilas - 1) * GAP_Y;

      let svg = `<svg id="svg-pert" width="${anchoTotal}" height="${altoTotal}" viewBox="0 0 ${anchoTotal} ${altoTotal}">
        <defs>
          <marker id="flecha-normal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#999"/></marker>
          <marker id="flecha-critica" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#dc3545"/></marker>
        </defs>`;

      // Aristas primero, para que queden debajo de los rectángulos.
      ids.forEach(id => {
        (sucesoresDe[id] || []).forEach(sid => {
          if (!pos[sid]) return;
          const critica = r.criticos.has(id) && r.criticos.has(sid);
          const x1 = pos[id].x + ANCHO_NODO, y1 = pos[id].y + ALTO_NODO / 2;
          const x2 = pos[sid].x, y2 = pos[sid].y + ALTO_NODO / 2;
          const mx = (x1 + x2) / 2;
          svg += `<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none" stroke="${critica ? '#dc3545' : '#999'}" stroke-width="${critica ? 2.5 : 1.5}" marker-end="url(#${critica ? 'flecha-critica' : 'flecha-normal'})"/>`;
        });
      });

      ids.forEach(id => {
        const n = mapaNodoPorId[id];
        const { x, y } = pos[id];
        const critica = r.criticos.has(id);
        const estado = calcularEstadoPropio(n);
        const relleno = critica ? '#ffe1e1' : '#f8f9fa';
        const borde = critica ? '#dc3545' : '#888';
        const holgura = r.holguras.has(id) ? r.holguras.get(id) : '—';
        svg += `<g class="nodo-pert">
          <rect x="${x}" y="${y}" width="${ANCHO_NODO}" height="${ALTO_NODO}" rx="6" fill="${relleno}" stroke="${borde}"/>
          <text class="cod" x="${x + 8}" y="${y + 18}">${ICONO_ESTADO[estado] || ''} ${n.codigo}</text>
          <text class="info" x="${x + 8}" y="${y + 32}">${new Date(n.fecha_inicio_prevista).toISOString().slice(0,10)} → ${new Date(n.fecha_fin_prevista).toISOString().slice(0,10)}</text>
          <text class="info" x="${x + 8}" y="${y + 44}">holgura: ${holgura} día(s)${critica ? ' · CRÍTICA' : ''}</text>
        </g>`;
      });

      svg += '</svg>';
      return svg;
    }

    function pintar() {
      const cont = document.getElementById('contenido');
      const aviso = document.getElementById('aviso-datos');
      aviso.style.display = 'none';
      if (!filtroBuqueId) { cont.innerHTML = '<p>Elige un buque arriba para ver su diagrama PERT.</p>'; return; }

      const nodos = nodosDeBuque(filtroBuqueId);
      const ids = nodos.map(n => n.id);
      const r = calcularCPM(ids, mapaNodoPorId, dependenciasCache);

      const avisos = [];
      if (r.sinDependencias) avisos.push('No hay dependencias registradas entre las tareas de este buque: el diagrama muestra las tareas sueltas, sin flechas de precedencia entre ellas.');
      if (r.excluidos.length > 0) avisos.push(`${r.excluidos.length} tarea(s) sin fecha prevista no aparecen en el diagrama.`);
      if (avisos.length > 0) { aviso.style.display = 'block'; aviso.innerHTML = '⚠️ ' + avisos.join('<br>⚠️ '); }

      const idsConFecha = Object.keys(r.EF);
      if (idsConFecha.length === 0) { cont.innerHTML = '<p>No hay tareas con fechas previstas en este buque para dibujar el diagrama.</p>'; return; }

      // Predecesores/sucesores limitados a los nodos con fecha (igual filtro que usa calcularCPM por dentro).
      const idsSet = new Set(idsConFecha);
      const predecesoresDe = {}, sucesoresDe = {};
      idsConFecha.forEach(id => { predecesoresDe[id] = []; sucesoresDe[id] = []; });
      dependenciasCache.forEach(d => {
        if (idsSet.has(d.predecesor_id) && idsSet.has(d.sucesor_id)) {
          sucesoresDe[d.predecesor_id].push(d.sucesor_id);
          predecesoresDe[d.sucesor_id].push(d.predecesor_id);
        }
      });

      cont.innerHTML = '<div id="lienzo-pert">' + dibujarSvg(idsConFecha, r, predecesoresDe, sucesoresDe) + '</div>';
    }

    async function iniciar() {
      const perfil = await iniciarBase('pert.html');
      if (!perfil) return;
      const { error } = await cargarNodosYDependencias();
      if (error) { document.getElementById('contenido').innerHTML = `<p style="color:red;">Error: ${error.message}</p>`; return; }
      opcionesBuqueEnSelect(document.getElementById('filtro-buque'));
      const primerBuque = Object.values(mapaNodoPorId).filter(n => n.tipo === 'BUQUE').sort((a, b) => a.codigo.localeCompare(b.codigo, 'es'))[0];
      if (primerBuque) { filtroBuqueId = primerBuque.id; document.getElementById('filtro-buque').value = primerBuque.id; }
      pintar();
    }
    iniciar();
  </script>
