<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESTRUCTURA - Cola de revisión</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#007bff">
  <style>
    body { font-family: Arial, sans-serif; max-width: 1050px; margin: 30px auto; padding: 0 20px; color: #333; }
    h1 { font-size: 22px; }
    h2 { font-size: 15px; margin-top: 0; }
    .card { background: #f8f9fa; border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    body.vista-movil .solo-escritorio { display: none !important; }
    body.tema-oscuro { background: #1a1d21; color: #e0e0e0; }
    body.tema-oscuro .card { background: #24282e; border-color: #3a3f47; }
    body.tema-oscuro h1, body.tema-oscuro h2 { color: #f0f0f0; }
    body.tema-oscuro .ruta-nodo { color: #a0a0a0; }
    body.tema-oscuro .overlay-caja { background: #24282e; color: #e0e0e0; }
    body.tema-oscuro select, body.tema-oscuro input { background: #1a1d21; color: #e0e0e0; border-color: #4a4f57; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    button { padding: 6px 12px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; }
    button.secundario { background: #6c757d; }
    button.secundario:hover { background: #5a6268; }
    .estado-msg { font-size: 13px; }

    ul.lista-nodos { list-style: none; padding: 0; margin: 10px 0 0; }
    ul.lista-nodos li { padding: 8px; border-bottom: 1px solid #eee; font-size: 13px; display: flex; align-items: center; gap: 8px; }
    .flecha { font-size: 18px; flex-shrink: 0; width: 19px; text-align: center; }
    .f-pendiente_revision { color: rgb(209,239,251); filter: drop-shadow(0 0 1px #7bb6c9) drop-shadow(0 0 1px #7bb6c9); }
    .ruta-nodo { color: #666; font-size: 11px; }

    #menu-asignar-resumen {
      display: none; position: fixed; z-index: 4000; background: #fff; border: 1px solid #ccc;
      border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,0.25); min-width: 160px; padding: 4px 0; font-size: 13px;
    }
    #menu-asignar-resumen .mc-item { padding: 8px 14px; cursor: pointer; }
    #menu-asignar-resumen .mc-item:hover { background: #eef3ff; }
    #menu-asignar-resumen .mc-item.mc-padre::after { content: '▸'; float: right; color: #999; margin-left: 10px; }

    #submenu-estado-resumen {
      display: none; position: fixed; z-index: 4050; background: #fff; border: 1px solid #ccc;
      border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,0.25); min-width: 260px; padding: 4px 0; font-size: 13px;
    }
    #submenu-estado-resumen .mc-item { padding: 8px 14px; cursor: pointer; }
    #submenu-estado-resumen .mc-item:hover { background: #eef3ff; }

    .overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.55); align-items: center; justify-content: center; z-index: 5000;
    }
    .overlay-caja { background: white; border-radius: 8px; padding: 22px; max-width: 400px; width: 90%; }
    .overlay-caja h3 { margin-top: 0; font-size: 16px; }
    .overlay-caja label { display: block; font-weight: bold; font-size: 12px; margin: 10px 0 4px; }
    .overlay-caja select { width: 100%; padding: 7px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
    .overlay-botones { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
      @media (max-width: 480px) {
      body { margin: 10px auto; padding: 0 8px; box-sizing: border-box; }
      h1 { font-size: 18px; }
    }
</style>
</head>
<body>

  <div class="header-bar">
    <h1>⏳ Cola de revisión</h1>
    <div>
      <span id="texto-usuario" class="estado-msg"></span>
      <button class="secundario" onclick="alternarTema()">🌙/☀️</button>
      <button class="secundario" onclick="location.href='index.html'">🏠 Inicio</button>
      <button class="secundario" onclick="location.href='arbol.html'">🌳 Árbol</button>
      <button class="secundario" onclick="location.href='kanban.html'">🗂️ Kanban</button>
      <button class="secundario" id="btn-informe" onclick="location.href='informe.html'" style="display:none;">🖨️ Informe</button>
      <button class="secundario" id="btn-avisos" onclick="alternarAvisosColaRevision()" style="display:none;">🔔 Avisarme de nuevas</button>
      <button class="secundario" onclick="cerrarSesion()">Cerrar sesión</button>
      <button style="background:#dc3545; color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-weight:bold; font-size:13px;" onclick="cerrarPagina()">❌ Cerrar</button>
    </div>

  <div id="barra-paneles-gestion" class="card" style="display:none; text-align:center; padding:10px 14px; margin-bottom:16px;"></div>

  <div id="contenido">
    <p>Cargando...</p>

  <div id="menu-asignar-resumen"></div>

  <div class="overlay" id="modal-aviso-resumen" style="z-index:5000;">
    <div class="overlay-caja" style="max-width:400px; text-align:center;">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://wuarkraddnndmgvfnkmm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_qF-x44yXSydPBojMk_GOUg_TM34uXFI';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // -------------------- Registro de comunicaciones (log_comunicaciones.html) --------------------
    // Envuelve fetch para dejar constancia de cada llamada de red que hace
    // esta página (casi siempre a Supabase): a dónde, cuánto tarda y qué
    // datos le pasa. Aparte del registro de actividad (audit_log), que es
    // de acciones del usuario, no de tráfico de red.
    function redactarCuerpoComunicacion(cuerpoTexto) {
      if (!cuerpoTexto) return null;
      try {
        const limpiar = (o) => {
          if (Array.isArray(o)) return o.map(limpiar);
          if (o && typeof o === 'object') {
            const copia = {};
            Object.keys(o).forEach(k => { copia[k] = /password|contrase/i.test(k) ? '***' : limpiar(o[k]); });
            return copia;
          }
          return o;
        };
        return JSON.stringify(limpiar(JSON.parse(cuerpoTexto))).slice(0, 4000);
      } catch (e) {
        return String(cuerpoTexto).slice(0, 4000);
      }
    }
    (function () {
      const _fetchOriginal = window.fetch.bind(window);
      window.fetch = async function (input, init) {
        const inicio = performance.now();
        const url = typeof input === 'string' ? input : (input && input.url) || '';
        const metodo = (init && init.method) || (typeof input === 'object' && input && input.method) || 'GET';
        if (url.indexOf('/comunicaciones_log') !== -1) return _fetchOriginal(input, init);
        let respuesta, errorMsg = null;
        try {
          respuesta = await _fetchOriginal(input, init);
          return respuesta;
        } catch (e) {
          errorMsg = e.message;
          throw e;
        } finally {
          const duracionMs = Math.round(performance.now() - inicio);
          const cuerpo = init && init.body && typeof init.body === 'string' ? redactarCuerpoComunicacion(init.body) : null;
          supabaseClient.from('comunicaciones_log').insert({
            metodo, url, cuerpo, duracion_ms: duracionMs,
            status_code: respuesta ? respuesta.status : null, error: errorMsg
          }).then(() => {}, () => {});
        }
      };
    })();

    // -------------------- Modo mantenimiento --------------------
    // Si está activo y quien entra no es ADMIN, lo manda a mantenimiento.html
    // en vez de dejarle seguir. Se llama justo después de conocer el rol.
    async function comprobarMantenimiento(rol) {
      if (rol === 'ADMIN') return false;
      try {
        const { data } = await supabaseClient.from('app_mantenimiento').select('activo').eq('id', 1).single();
        if (data && data.activo) { window.location.href = 'mantenimiento.html'; return true; }
      } catch (e) { /* si falla la comprobación, no se bloquea la app por eso */ }
      return false;
    }


    // Detección de móvil/tablet: iPadOS manda user-agent de escritorio
    // ("Macintosh") desde iOS 13, así que se completa con pantalla táctil
    // real (navigator.maxTouchPoints, 0 en un Mac/PC sin pantalla táctil).
    const esTactil = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
    const esMovil = esTactil || window.innerWidth < 768;
    document.body.classList.toggle('vista-movil', esMovil);

    const TIPOS_SIN_ASIGNACION = new Set(['BUQUE']);
    const ETIQUETAS_ESTADO = {
      sin_asignar: 'Sin asignar', asignada_sin_empezar: 'Pendiente de hacer', en_proceso: 'En proceso',
      pendiente_revision: 'Pendiente de revisión', pendiente_dudas: 'Pendiente de dudas',
      pendiente_cambios_modelo: 'Pendiente de cambios de modelo', aprobado: 'Aprobado', rechazado: 'Rechazado'
    };

    let miPerfil = null;
    let mapaNodoPorId = {};
    let mapaHijosPorPadre = {};
    let nodosGestorActual = [];
    let filtroUsuarioId = null;
    let filtroRevisorId = null;
    let dependenciasCache = [];
    let nodosEnRutaCritica = new Set();
    let holguraPorNodo = new Map();

    // -------------------- Aviso al entrar algo nuevo a la cola --------------------
    const CLAVE_AVISOS_COLA = 'estructura_avisos_cola_revision';
    let idsColaPropiaAnterior = null; // null = primera carga: no avisa de "nuevas" retroactivamente
    let avisosNuevos = [];

    function avisosColaActivados() { return localStorage.getItem(CLAVE_AVISOS_COLA) === '1'; }

    async function alternarAvisosColaRevision() {
      if (avisosColaActivados()) {
        localStorage.setItem(CLAVE_AVISOS_COLA, '0');
        actualizarBotonAvisos();
        return;
      }
      if (!('Notification' in window)) { mostrarAvisoModal('Este navegador no admite avisos de escritorio.'); return; }
      const permiso = await Notification.requestPermission();
      if (permiso !== 'granted') { mostrarAvisoModal('No se concedió permiso para mostrar avisos.'); return; }
      localStorage.setItem(CLAVE_AVISOS_COLA, '1');
      actualizarBotonAvisos();
    }

    function actualizarBotonAvisos() {
      const btn = document.getElementById('btn-avisos');
      if (!btn) return;
      const activo = avisosColaActivados();
      btn.textContent = activo ? '🔕 Avisos activados' : '🔔 Avisarme de nuevas';
      btn.title = activo ? 'Pulsa para desactivar los avisos de escritorio cuando entre algo nuevo a tu cola' : 'Recibir un aviso de escritorio (mientras esta pestaña esté abierta) cuando te entre una tarea nueva a revisar';
    }

    // Compara la cola propia (revisor_id === yo, pendiente/en revisión) con la
    // de la carga anterior -- si hay ids nuevos, los guarda para resaltarlos
    // en pintar() y, si están activados, lanza un aviso de escritorio.
    function detectarNuevasEnCola() {
      if (!esGestor()) return;
      const propiaAhora = Object.values(mapaNodoPorId).filter(n =>
        n.revisor_id === miPerfil.id && (n.revision_estado === 'PENDIENTE' || n.revision_estado === 'EN_REVISION')
      );
      const idsAhora = new Set(propiaAhora.map(n => n.id));

      if (idsColaPropiaAnterior !== null) {
        const nuevas = propiaAhora.filter(n => !idsColaPropiaAnterior.has(n.id));
        if (nuevas.length > 0) {
          avisosNuevos = [...new Set([...avisosNuevos, ...nuevas.map(n => n.id)])];
          if (avisosColaActivados() && Notification.permission === 'granted') {
            const texto = nuevas.length === 1
              ? `${nuevas[0].codigo} — ${nuevas[0].nombre}`
              : `${nuevas.length} tareas nuevas`;
            new Notification('⏳ Nueva entrada en tu cola de revisión', { body: texto });
          }
        }
      }
      idsColaPropiaAnterior = idsAhora;
    }

    // Motivos de rechazo más frecuentes -- una lista corta para no escribir el
    // texto entero cada vez, con "Otro" para lo que no encaje aquí. Se guarda
    // igual que antes en node_workflow.comentario_revision (RPC revisar_nodo),
    // así que no hace falta ningún cambio de base de datos para esto.
    const MOTIVOS_RECHAZO_PREDEFINIDOS = [
      'No cumple el plano o modelo 3D',
      'Medidas o cotas incorrectas',
      'Falta documentación o fichero',
      'Material o especificación incorrecta',
      'Acabado o soldadura defectuosos',
      'Falta marcaje / identificación',
      'Otro (especificar abajo)'
    ];

    function esGestor() { return miPerfil.rol === 'ADMIN' || miPerfil.rol === 'REVISOR'; }
    function esInvitado() { return miPerfil.rol === 'INVITADO'; }
    function pareceGestor() { return esGestor() || esInvitado(); }

    function calcularEstadoPropio(nodo) {
      if (nodo.revision_estado === 'APROBADO') return 'aprobado';
      if (nodo.revision_estado === 'RECHAZADO') return 'rechazado';
      if (nodo.revision_estado === 'PENDIENTE' || nodo.revision_estado === 'EN_REVISION') return 'pendiente_revision';
      if (nodo.trabajo_estado === 'EN_TRABAJO') return 'en_proceso';
      if (nodo.trabajo_estado === 'PENDIENTE_DUDAS') return 'pendiente_dudas';
      if (nodo.trabajo_estado === 'PENDIENTE_CAMBIOS_MODELO') return 'pendiente_cambios_modelo';
      if (nodo.trabajador_id) return 'asignada_sin_empezar';
      return 'sin_asignar';
    }

    function rutaCompleta(nodo) {
      const partes = [];
      let actual = nodo;
      while (actual) {
        partes.unshift(actual.codigo);
        actual = actual.parent_id ? mapaNodoPorId[actual.parent_id] : null;
      }
      return partes.join('>');
    }

    function formatearFechaHora(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      const mes = String(d.getMonth() + 1).padStart(2, '0');
      const aaaa = d.getFullYear();
      return `${hh}:${mm} ${dd}/${mes}/${aaaa}`;
    }

    function buqueDeNodo(nodo) {
      let actual = nodo;
      while (actual) {
        if (actual.tipo === 'BUQUE') return actual;
        actual = actual.parent_id ? mapaNodoPorId[actual.parent_id] : null;
      }
      return null;
    }

    function bloqueDeNodo(nodo) {
      let actual = nodo;
      while (actual) {
        if (actual.tipo === 'BLOQUE') return actual;
        actual = actual.parent_id ? mapaNodoPorId[actual.parent_id] : null;
      }
      return null;
    }

    function obtenerDescendientesIds(nodeId) {
      const resultado = [];
      const hijos = mapaHijosPorPadre[nodeId] || [];
      hijos.forEach(h => { resultado.push(h.id); resultado.push(...obtenerDescendientesIds(h.id)); });
      return resultado;
    }

    // Ruta crítica (CPM), igual que en gantt.html: solo entra en el cálculo lo
    // que tiene fecha_inicio_prevista y fecha_fin_prevista fijadas y
    // dependencias entre sí. Se usa aquí para priorizar la cola de revisión
    // (mejora "Cola de revisión priorizada") y para pedir comentario al
    // aprobar piezas críticas.
    function calcularRutaCritica() {
      const rango = {};
      Object.values(mapaNodoPorId).forEach(n => {
        if (n.fecha_inicio_prevista && n.fecha_fin_prevista) {
          rango[n.id] = { inicio: new Date(n.fecha_inicio_prevista), fin: new Date(n.fecha_fin_prevista) };
        }
      });
      const ids = Object.keys(rango);
      if (ids.length === 0) return { criticos: new Set(), holguras: new Map() };

      const sucesoresDe = {}, predecesoresDe = {};
      ids.forEach(id => { sucesoresDe[id] = []; predecesoresDe[id] = []; });
      dependenciasCache.forEach(d => {
        if (rango[d.predecesor_id] && rango[d.sucesor_id]) {
          sucesoresDe[d.predecesor_id].push(d.sucesor_id);
          predecesoresDe[d.sucesor_id].push(d.predecesor_id);
        }
      });

      const duracionMs = id => rango[id].fin - rango[id].inicio;
      const EF = {};
      function calcularEF(id, pila) {
        if (EF[id] !== undefined) return EF[id];
        if (pila.has(id)) return EF[id] = rango[id].fin;
        pila.add(id);
        let inicioReal = rango[id].inicio;
        predecesoresDe[id].forEach(pid => {
          const ef = calcularEF(pid, pila);
          if (ef > inicioReal) inicioReal = ef;
        });
        return EF[id] = new Date(inicioReal.getTime() + duracionMs(id));
      }
      ids.forEach(id => calcularEF(id, new Set()));

      const finProyecto = new Date(Math.max(...ids.map(id => EF[id].getTime())));
      const LS = {};
      function calcularLS(id, pila) {
        if (LS[id] !== undefined) return LS[id];
        if (pila.has(id)) return LS[id] = finProyecto;
        pila.add(id);
        const sucs = sucesoresDe[id];
        const finTardio = sucs.length === 0 ? finProyecto : new Date(Math.min(...sucs.map(sid => calcularLS(sid, pila).getTime())));
        return LS[id] = new Date(finTardio.getTime() - duracionMs(id));
      }
      ids.forEach(id => calcularLS(id, new Set()));

      const ES = {};
      ids.forEach(id => { ES[id] = new Date(EF[id].getTime() - duracionMs(id)); });

      const criticos = new Set();
      const holguras = new Map();
      const UNA_HORA_MS = 3600000;
      const UN_DIA_MS = 86400000;
      ids.forEach(id => {
        const holguraMs = LS[id].getTime() - ES[id].getTime();
        holguras.set(id, Math.round(holguraMs / UN_DIA_MS));
        if (Math.abs(holguraMs) < UNA_HORA_MS) criticos.add(id);
      });
      return { criticos, holguras };
    }

    const AVANCE_POR_ESTADO = {
      sin_asignar: 0, asignada_sin_empezar: 0, en_proceso: 5, pendiente_revision: 90, rechazado: 95, aprobado: 100
      // pendiente_dudas y pendiente_cambios_modelo no llevan porcentaje: se excluyen del cálculo.
    };

    function calcularPorcentajeAvance(nodeId) {
      const idsSubarbol = [nodeId, ...obtenerDescendientesIds(nodeId)];
      const relevantes = idsSubarbol
        .map(id => mapaNodoPorId[id])
        .filter(n => n && !TIPOS_SIN_ASIGNACION.has(n.tipo))
        .map(n => calcularEstadoPropio(n))
        .filter(estado => estado !== 'pendiente_dudas' && estado !== 'pendiente_cambios_modelo');
      if (relevantes.length === 0) return null;
      const suma = relevantes.reduce((acc, estado) => acc + AVANCE_POR_ESTADO[estado], 0);
      return Math.round(suma / relevantes.length);
    }

    // -------------------- Aviso por email al completar un Bloque --------------------
    // Igual que en árbol.html: cuando una aprobación deja un Bloque al 100%,
    // se ofrece abrir un email ya redactado (a los supervisores del Bloque +
    // todos los ADMIN) para que la persona lo revise y lo envíe ella misma.
    // No se manda nada automáticamente.
    const CLAVE_BLOQUES_EMAIL_NOTIFICADOS = 'estructura_bloques_email_notificados';
    function obtenerBloquesEmailNotificados() {
      try { return new Set(JSON.parse(localStorage.getItem(CLAVE_BLOQUES_EMAIL_NOTIFICADOS) || '[]')); }
      catch (e) { return new Set(); }
    }
    function guardarBloquesEmailNotificados(set) {
      try { localStorage.setItem(CLAVE_BLOQUES_EMAIL_NOTIFICADOS, JSON.stringify([...set])); } catch (e) { /* no pasa nada si no se puede guardar */ }
    }

    async function comprobarBloqueListoTrasAprobar(nodeId) {
      const nodo = mapaNodoPorId[nodeId];
      if (!nodo) return;
      const bloque = bloqueDeNodo(nodo);
      if (!bloque) return;
      const pct = calcularPorcentajeAvance(bloque.id);
      const notificados = obtenerBloquesEmailNotificados();
      if (pct === 100) {
        if (notificados.has(bloque.id)) return;
        notificados.add(bloque.id);
        guardarBloquesEmailNotificados(notificados);
        await ofrecerEmailBloqueListo(bloque);
      } else if (notificados.has(bloque.id)) {
        notificados.delete(bloque.id);
        guardarBloquesEmailNotificados(notificados);
      }
    }

    async function ofrecerEmailBloqueListo(bloque) {
      const buque = buqueDeNodo(bloque);
      const quiere = await mostrarConfirmacion(`✅ El Bloque "${bloque.codigo} - ${bloque.nombre}"${buque ? ' (' + buque.codigo + ')' : ''} está 100% aprobado.\n\n¿Abrir un email para avisar a los supervisores y administradores? (lo revisas y lo envías tú antes de que salga).`);
      if (!quiere) return;
      abrirEmailBloqueListo(bloque, buque);
    }

    function abrirEmailBloqueListo(bloque, buque) {
      const idsSubarbol = [bloque.id, ...obtenerDescendientesIds(bloque.id)];
      const revisorIds = new Set();
      idsSubarbol.forEach(id => { const n = mapaNodoPorId[id]; if (n && n.revisor_id) revisorIds.add(n.revisor_id); });

      const destinatarios = new Map();
      perfilesCache.forEach(p => {
        const implicado = revisorIds.has(p.id) || p.rol === 'ADMIN';
        if (implicado && p.email_contacto && p.email_contacto.trim()) destinatarios.set(p.email_contacto.trim(), p.nombre_completo);
      });

      if (destinatarios.size === 0) {
        mostrarAvisoModal('No se pudo preparar el email: ninguno de los supervisores o administradores implicados tiene un email de contacto guardado (Usuarios → Editar → Email).');
        return;
      }

      const asunto = `Bloque listo: ${bloque.codigo} - ${bloque.nombre}${buque ? ' (' + buque.codigo + ')' : ''}`;
      const cuerpo = `El Bloque "${bloque.codigo} - ${bloque.nombre}"${buque ? ' del buque ' + buque.codigo + ' (' + buque.nombre + ')' : ''} está completo: toda su documentación y trabajo han sido aprobados.\n\nComprobado el ${formatearFechaHora(new Date().toISOString())}.\n\n— Aviso de ESTRUCTURA (revisa el contenido y envíalo tú mismo)`;

      registrarLog('AVISO_BLOQUE_LISTO', `Preparó un email de aviso de Bloque completo para "${bloque.codigo}" a: ${[...destinatarios.keys()].join(', ')}`);
      window.location.href = `mailto:${[...destinatarios.keys()].join(',')}?subject=${encodeURIComponent(asunto)}&body=${encodeURIComponent(cuerpo)}`;
    }

    function traducirError(mensaje) {
      if (!mensaje) return 'Ha ocurrido un error inesperado.';
      const m = mensaje.toLowerCase();
      if (m.includes('duplicate key')) return 'Ya existe un registro con ese mismo dato — no se puede repetir.';
      if (m.includes('violates foreign key constraint')) return 'No se puede completar: hace referencia a algo que ya no existe.';
      if (m.includes('new row violates row-level security') || m.includes('permission denied')) return 'No tienes permiso para hacer esto.';
      if (m.includes('failed to fetch') || m.includes('networkerror')) return 'No se pudo conectar — comprueba tu conexión a internet.';
      if (m.includes('jwt') || m.includes('token') || m.includes('session')) return 'Tu sesión ha caducado — vuelve a iniciar sesión.';
      return mensaje;
    }

    // Devuelve el texto final del motivo de rechazo (motivo elegido +, si lo
    // hay, el detalle) o null si se cancela. "Otro" obliga a escribir el
    // detalle; los demás motivos lo dejan opcional.
    function pedirMotivoRechazo(etiquetaTarea) {
      return new Promise((resolve) => {
        const sel = document.getElementById('mr-motivo');
        const detalle = document.getElementById('mr-detalle');
        const estadoEl = document.getElementById('mr-estado');
        sel.innerHTML = MOTIVOS_RECHAZO_PREDEFINIDOS.map(m => `<option value="${m}">${m}</option>`).join('');
        sel.value = MOTIVOS_RECHAZO_PREDEFINIDOS[0];
        detalle.value = '';
        estadoEl.textContent = '';
        document.querySelector('#modal-motivo-rechazo h3').textContent = etiquetaTarea ? `Motivo del rechazo de "${etiquetaTarea}"` : 'Motivo del rechazo';
        document.getElementById('modal-motivo-rechazo').style.display = 'flex';
        setTimeout(() => sel.focus(), 50);

        const btnOk = document.getElementById('mr-ok');
        const btnCancel = document.getElementById('mr-cancel');
        const limpiar = () => { btnOk.onclick = null; btnCancel.onclick = null; document.getElementById('modal-motivo-rechazo').style.display = 'none'; };
        btnOk.onclick = () => {
          const esOtro = sel.value === MOTIVOS_RECHAZO_PREDEFINIDOS[MOTIVOS_RECHAZO_PREDEFINIDOS.length - 1];
          const texto = detalle.value.trim();
          if (esOtro && !texto) { estadoEl.textContent = 'Escribe el motivo en el detalle.'; return; }
          const motivoFinal = esOtro ? texto : (texto ? `${sel.value} — ${texto}` : sel.value);
          limpiar();
          resolve(motivoFinal);
        };
        btnCancel.onclick = () => { limpiar(); resolve(null); };
      });
    }

      perfilesCache = (data || []).sort((a, b) =>

    // Para "Sustituto temporal": ausencias que cubren hoy, de cualquier
    // usuario -- se cruza con profiles.sustituto_id en sustitucionesActivasParaMi().
    // Si la tabla "ausencias" o la columna "sustituto_id" no existen todavía
    // (falta ejecutar el SQL), esto simplemente no devuelve nada, sin romper
    // el resto de la página.
    async function cargarAusenciasActivas() {
      try {
        const hoy = new Date().toISOString().slice(0, 10);
        const { data } = await supabaseClient.from('ausencias').select('*').lte('fecha_inicio', hoy).gte('fecha_fin', hoy);
        ausenciasActivasCache = data || [];
      } catch (e) {
        ausenciasActivasCache = [];
      }
    }

    // Tiempo medio de revisión propio: desde que la tarea llegó a la cola
    // (trabajo_terminado_en) hasta que se revisó (revisado_en), para las
    // últimas tareas que he revisado yo -- ya están cargadas en memoria
    // (nodosGestorActual/mapaNodoPorId), no hace falta otra consulta.
    function calcularTiempoMedioRevisionPropio() {
      if (!miPerfil || !esGestor()) return null;
      const revisadas = Object.values(mapaNodoPorId)
        .filter(n => n.revisor_id === miPerfil.id && n.revisado_en && n.trabajo_terminado_en)
        .sort((a, b) => new Date(b.revisado_en) - new Date(a.revisado_en))
        .slice(0, 50);
      if (revisadas.length === 0) return null;
      const totalHoras = revisadas.reduce((acc, n) => acc + (new Date(n.revisado_en) - new Date(n.trabajo_terminado_en)) / 3600000, 0);
      const media = totalHoras / revisadas.length;
      const texto = media >= 24 ? `${(media / 24).toFixed(1)} días` : `${media.toFixed(1)} horas`;
      return { horas: texto, n: revisadas.length };
    }

    // -------------------- Cola de revisión --------------------

    function usuariosConTareasAsignadas(nodos) {
      const ids = [...new Set(nodos.filter(n => n.trabajador_id).map(n => n.trabajador_id))];
      return ids
        .map(id => ({ id, nombre: nodos.find(n => n.trabajador_id === id)?.trabajador_nombre || '—' }))
        .sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
    }

    function revisoresConTareasAsignadas(nodos) {
      const ids = [...new Set(nodos.filter(n => n.revisor_id).map(n => n.revisor_id))];
      return ids
        .map(id => ({ id, nombre: nodos.find(n => n.revisor_id === id)?.revisor_nombre || '—' }))
        .sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
    }

    function formatearEspera(iso) {
      const minutos = Math.floor((new Date() - new Date(iso)) / 60000);
      const horas = Math.floor(minutos / 60);
      const dias = Math.floor(horas / 24);
      if (dias > 0) return `${dias}d ${horas % 24}h esperando`;
      return `${horas}h ${String(minutos % 60).padStart(2, '0')}min esperando`;
    }

    // Carga abierta por trabajador (cualquier tarea asignada que no esté ya
    // aprobada) -- para la mejora "alertas de sobrecarga": se avisa de quien
    // tiene bastantes más tareas abiertas que la media del equipo.
    function calcularSobrecargas() {
      const carga = calcularCargaAbiertaPorUsuario();
      const valores = Object.values(carga);
      if (valores.length === 0) return [];
      const media = valores.reduce((a, b) => a + b, 0) / valores.length;
      const umbral = Math.max(3, Math.ceil(media * 1.5));
      return Object.entries(carga)
        .filter(([, n]) => n >= umbral)
        .map(([id, n]) => ({ id, n, nombre: perfilesCache.find(p => p.id === id)?.nombre_completo || '?' }))
        .sort((a, b) => b.n - a.n);
    }

    // Sustituto temporal: si algún Supervisor de baja/vacaciones (tabla
    // ausencias) me tiene marcado como su sustituto (profiles.sustituto_id),
    // se muestra un aviso con acceso directo a su cola.
    function sustitucionesActivasParaMi() {
      if (!miPerfil || !esGestor()) return [];
      const hoy = new Date().toISOString().slice(0, 10);
      return perfilesCache.filter(p =>
        p.rol === 'REVISOR' && p.sustituto_id === miPerfil.id &&
        (ausenciasActivasCache || []).some(a => a.usuario_id === p.id && a.fecha_inicio <= hoy && hoy <= a.fecha_fin)
      );
    }

    function renderColaRevision() {
      const usuarios = usuariosConTareasAsignadas(nodosGestorActual);
      const revisores = revisoresConTareasAsignadas(nodosGestorActual);
      const base = nodosGestorActual
        .filter(n => !filtroUsuarioId || n.trabajador_id === filtroUsuarioId)
        .filter(n => !filtroRevisorId || n.revisor_id === filtroRevisorId);

      // Prioridad: primero lo que está en la ruta crítica, luego lo que tiene
      // menos holgura (más urgente), y a igualdad de eso, lo que más tiempo
      // lleva esperando revisión -- así no hace falta juzgarlo a ojo.
      const colaRevision = base
        .filter(n => n.revision_estado === 'PENDIENTE' || n.revision_estado === 'EN_REVISION')
        .filter(n => n.trabajo_terminado_en)
        .sort((a, b) => {
          const criticaA = nodosEnRutaCritica.has(a.id) ? 1 : 0;
          const criticaB = nodosEnRutaCritica.has(b.id) ? 1 : 0;
          if (criticaA !== criticaB) return criticaB - criticaA;
          const holguraA = holguraPorNodo.has(a.id) ? holguraPorNodo.get(a.id) : Infinity;
          const holguraB = holguraPorNodo.has(b.id) ? holguraPorNodo.get(b.id) : Infinity;
          if (holguraA !== holguraB) return holguraA - holguraB;
          return new Date(a.trabajo_terminado_en) - new Date(b.trabajo_terminado_en);
        });

      const filas = colaRevision.length === 0
        ? '<li>Nada pendiente de revisión ahora mismo.</li>'
        : colaRevision.map(n => {
            const enCritica = nodosEnRutaCritica.has(n.id);
            const holgura = holguraPorNodo.get(n.id);
            const esNueva = avisosNuevos.includes(n.id);
            return `
            <li oncontextmenu="mostrarMenuAsignarResumen(event, '${n.id}'); return false;" style="cursor:context-menu; ${esNueva ? 'background:#fff8e1;' : ''}">
              <span class="flecha f-pendiente_revision">▶</span>
              <div>
                <div>
                  ${esNueva ? '<span title="Ha entrado a tu cola desde la última vez que la miraste">🆕</span> ' : ''}
                  ${enCritica ? '<span title="En la ruta crítica" style="color:#6f42c1;">🔺</span> ' : ''}
                  <strong>${n.codigo}</strong> ${n.nombre} ${n.trabajador_nombre ? `— 👷 ${n.trabajador_nombre}` : ''}
                  ${holgura !== undefined ? `<span style="font-size:10px; color:${holgura <= 0 ? '#dc3545' : '#888'};" title="Holgura restante hasta que se convierta en la nueva ruta crítica">⏳${holgura}d</span>` : ''}
                </div>
                <div class="ruta-nodo">${rutaCompleta(n)} · <strong style="color:#b36b00;">${formatearEspera(n.trabajo_terminado_en)}</strong></div>
              </div>
            </li>
          `;
          }).join('');

      const sobrecargas = calcularSobrecargas();
      const sustituciones = sustitucionesActivasParaMi();
      const promedioRevision = calcularTiempoMedioRevisionPropio();

      return `
        ${sustituciones.length > 0 ? `
          <div class="card" style="background:#fff8e1; border-color:#ffe082;">
            <h2>🌴 Sustituto temporal</h2>
            ${sustituciones.map(p => `
              <p style="font-size:13px; margin:4px 0;">
                <strong>${p.nombre_completo}</strong> está de baja/vacaciones y te ha marcado como su sustituto.
                <button class="secundario" onclick="filtroRevisorId='${p.id}'; pintar();" style="margin-left:8px;">Ver su cola</button>
              </p>
            `).join('')}
          </div>
        ` : ''}
        <div class="card">
          <h2>⏳ Cola de revisión, priorizada (${colaRevision.length})</h2>
          <p style="font-size:11px; color:#888; margin:-4px 0 8px;">
            Orden automático: primero la ruta crítica 🔺, luego menos holgura ⏳, y a igualdad de eso la que más tiempo lleva esperando.
            Clic derecho sobre una tarea para asignarla o cambiar su estado.
            ${avisosNuevos.length > 0 ? ` · <a href="#" onclick="avisosNuevos=[]; pintar(); return false;">🆕 ${avisosNuevos.length} nueva(s) — marcar vistas</a>` : ''}
          </p>
          ${promedioRevision !== null ? `<p style="font-size:11px; color:#888; margin:-2px 0 8px;">🕐 Tu tiempo medio de revisión: <strong>${promedioRevision.horas}</strong> (últimas ${promedioRevision.n})</p>` : ''}
          ${sobrecargas.length > 0 ? `
            <p style="font-size:12px; color:#b36b00; margin:0 0 8px; background:#fff8e1; border:1px solid #ffe082; border-radius:4px; padding:6px 8px;">
              ⚠️ Carga alta: ${sobrecargas.map(s => `${s.nombre} (${s.n} abiertas)`).join(', ')}
            </p>
          ` : ''}
          <label style="display:inline-block; font-size:12px; font-weight:bold; margin-bottom:8px;">Usuario:
            <select onchange="filtroUsuarioId = this.value || null; pintar();" style="padding:4px; border-radius:4px; border:1px solid #ccc; margin-left:6px;">
              <option value="" ${!filtroUsuarioId ? 'selected' : ''}>Todos</option>
              ${usuarios.map(u => `<option value="${u.id}" ${u.id === filtroUsuarioId ? 'selected' : ''}>${u.nombre}</option>`).join('')}
            </select>
          </label>
          <label style="display:inline-block; font-size:12px; font-weight:bold; margin-bottom:8px; margin-left:14px;">Supervisor:
            <select onchange="filtroRevisorId = this.value || null; pintar();" style="padding:4px; border-radius:4px; border:1px solid #ccc; margin-left:6px;">
              <option value="" ${!filtroRevisorId ? 'selected' : ''}>Todos</option>
              ${revisores.map(r => `<option value="${r.id}" ${r.id === filtroRevisorId ? 'selected' : ''}>${r.nombre}</option>`).join('')}
            </select>
          </label>
          <ul class="lista-nodos" style="max-height:600px; overflow-y:auto;">
            ${filas}
          </ul>
        </div>
      `;
    }

    function pintar() {
      document.getElementById('contenido').innerHTML = renderColaRevision();
    }

    // Supabase/PostgREST corta cada consulta a 1000 filas por defecto salvo
    // que se pida por páginas -- con más de 1000 nodos activos en total,
    // esta consulta sin paginar podía dejarse fuera, al azar, buena parte
    // del árbol (mismo fallo ya corregido en arbol.html y gantt.html).
    async function paginarSelect(factoriaQuery, tamPagina = 1000) {
      let desde = 0;
      let todos = [];
      while (true) {
        const { data, error } = await factoriaQuery().range(desde, desde + tamPagina - 1);
        if (error) return { data: null, error };
        todos = todos.concat(data || []);
        if (!data || data.length < tamPagina) break;
        desde += tamPagina;
      }
      return { data: todos, error: null };
    }

    async function cargarYPintar() {
      const [{ data: nodos, error }, { data: deps }] = await Promise.all([
        paginarSelect(() => supabaseClient.from('v_nodes_with_workflow').select('*').eq('activo', true).order('id', { ascending: true })),
        supabaseClient.from('node_dependencias').select('*')
      ]);
      if (error) { document.getElementById('contenido').innerHTML = `<p style="color:red;">Error: ${error.message}</p>`; return; }
      dependenciasCache = deps || [];
      mapaNodoPorId = {};
      mapaHijosPorPadre = {};
      nodos.forEach(n => {
        mapaNodoPorId[n.id] = n;
        const clave = n.parent_id || '__raiz__';
        if (!mapaHijosPorPadre[clave]) mapaHijosPorPadre[clave] = [];
        mapaHijosPorPadre[clave].push(n);
      });
      const resultadoRuta = calcularRutaCritica();
      nodosEnRutaCritica = resultadoRuta.criticos;
      holguraPorNodo = resultadoRuta.holguras;
      nodosGestorActual = nodos.filter(n => !TIPOS_SIN_ASIGNACION.has(n.tipo));
      if (miPerfil.rol === 'TRABAJADOR') nodosGestorActual = nodosGestorActual.filter(n => n.trabajador_id === miPerfil.id);
      detectarNuevasEnCola();
      pintar();
    }

    let debounceRecarga = null;
    function recargarConDebounce() { clearTimeout(debounceRecarga); debounceRecarga = setTimeout(() => cargarYPintar(), 400); }
    function suscribirseARealtime() {
      supabaseClient.channel('revision_node_workflow').on('postgres_changes', { event: '*', schema: 'public', table: 'node_workflow' }, () => recargarConDebounce()).subscribe();
      supabaseClient.channel('revision_nodes').on('postgres_changes', { event: '*', schema: 'public', table: 'nodes' }, () => recargarConDebounce()).subscribe();
    }

    async function iniciar() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.href = 'login.html?next=revision.html'; return; }

      const { data: perfil, error } = await supabaseClient
        .from('profiles').select('*').eq('id', session.user.id).single();

      if (error || !perfil || !perfil.activo) {
        document.body.innerHTML = '<p style="color:red; font-weight:bold; margin-top:60px; text-align:center;">No tienes acceso.</p>';
        return;
      }

      miPerfil = perfil;
      if (await comprobarMantenimiento(perfil.rol)) return;
      document.getElementById('texto-usuario').textContent =
        `${perfil.nombre_completo} (${perfil.username}) — ${{TRABAJADOR:'Usuario',REVISOR:'Supervisor',ADMIN:'Admin',INVITADO:'Invitado',WINDCHILL:'Windchill'}[perfil.rol] || perfil.rol}`;
      if (perfil.rol === 'ADMIN' || perfil.rol === 'REVISOR') document.getElementById('btn-informe').style.display = 'inline-block';
      if (perfil.rol === 'ADMIN' || perfil.rol === 'REVISOR') {
        document.getElementById('btn-avisos').style.display = 'inline-block';
        actualizarBotonAvisos();
      }

      if (!pareceGestor() && miPerfil.rol !== 'TRABAJADOR') {
        document.getElementById('contenido').innerHTML = '<div class="card"><p>Esta página es para gestores. Ve a <a href="resumen.html">Resumen</a> para ver tus tareas.</p></div>';
        return;
      }

      if (pareceGestor()) {
        const barra = document.getElementById('barra-paneles-gestion');
        barra.innerHTML = renderBarraPaneles('revision.html');
        barra.style.display = 'block';
      }

      await Promise.all([cargarPerfilesResumen(), cargarAusenciasActivas()]);
      await cargarYPintar();
      suscribirseARealtime();
    }

    iniciar();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
