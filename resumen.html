<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESTRUCTURA - Resumen</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#007bff">
  <style>
    body { font-family: Arial, sans-serif; max-width: 1050px; margin: 30px auto; padding: 0 20px; color: #333; }
    h1 { font-size: 22px; }
    h2 { font-size: 15px; margin-top: 0; }
    .card { background: #f8f9fa; border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    body.vista-movil .solo-escritorio { display: none !important; }
    body.tema-oscuro { background: #1a1d21; color: #e0e0e0; }
    body.tema-oscuro .card { background: #24282e; border-color: #3a3f47; }
    body.tema-oscuro h1, body.tema-oscuro h2 { color: #f0f0f0; }
    body.tema-oscuro table { color: #e0e0e0; }
    body.tema-oscuro th { background: #14395c; }
    body.tema-oscuro td { border-color: #3a3f47; }
    body.tema-oscuro .ruta-nodo { color: #a0a0a0; }
    body.tema-oscuro .overlay-caja { background: #24282e; color: #e0e0e0; }
    body.tema-oscuro select, body.tema-oscuro input { background: #1a1d21; color: #e0e0e0; border-color: #4a4f57; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    button { padding: 6px 12px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; }
    button.secundario { background: #6c757d; }
    button.secundario:hover { background: #5a6268; }
    .estado-msg { font-size: 13px; }

    .contadores { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    @media (max-width: 700px) { .contadores { grid-template-columns: repeat(2, 1fr); } }
    .contador.clicable { cursor: pointer; transition: transform 0.1s; }
    .contador.clicable:hover { transform: translateY(-2px); }
    .contador.activo { outline: 3px solid #333; }
    .c-total { background: #343a40; color: #fff; }
    .contador {
      flex: 1; min-width: 118px; text-align: center; padding: 12px 6px; border-radius: 8px; font-weight: bold;
      border: 1px solid rgba(0,0,0,0.1);
    }
    .contador .numero { font-size: 24px; display: block; }
    .contador .etiqueta { font-size: 11px; }
    .c-sin_asignar { background: rgb(191,191,191); color: #222; }
    .c-asignada_sin_empezar { background: #fff; color: #333; border: 1px solid #999; }
    .c-en_proceso { background: rgb(255,255,0); color: #222; }
    .c-pendiente_revision { background: rgb(209,239,251); color: #222; }
    .c-pendiente_dudas { background: rgb(0,176,240); color: #fff; }
    .c-pendiente_cambios_modelo { background: rgb(255,192,0); color: #222; }
    .c-aprobado { background: rgb(146,208,80); color: #fff; }
    .c-rechazado { background: rgb(255,0,0); color: #fff; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; font-size: 12px; }
    th, td { padding: 6px; text-align: left; border-bottom: 1px solid #ddd; }
    th { background: #1c6e8c; color: white; font-size: 11px; }
    td.num { text-align: center; }

    ul.lista-nodos { list-style: none; padding: 0; margin: 10px 0 0; }
    ul.lista-nodos li { padding: 8px; border-bottom: 1px solid #eee; font-size: 13px; display: flex; align-items: center; gap: 8px; }
    .flecha { font-size: 18px; flex-shrink: 0; width: 19px; text-align: center; }
    .f-sin_asignar { color: rgb(191,191,191); }
    .f-asignada_sin_empezar { color: #fff; -webkit-text-stroke: 1.5px #000; filter: drop-shadow(0 0 1px #000) drop-shadow(0 0 1px #000); }
    .f-en_proceso { color: rgb(255,255,0); filter: drop-shadow(0 0 1px #b3b300) drop-shadow(0 0 1px #b3b300); }
    .f-pendiente_revision { color: rgb(209,239,251); filter: drop-shadow(0 0 1px #7bb6c9) drop-shadow(0 0 1px #7bb6c9); }
    .f-pendiente_dudas { color: rgb(0,176,240); }
    .f-pendiente_cambios_modelo { color: rgb(255,192,0); }
    .f-aprobado { color: rgb(146,208,80); font-size: 22px; width: 22px; }
    .f-rechazado { color: rgb(255,0,0); font-size: 22px; width: 22px; }
    .ruta-nodo { color: #666; font-size: 11px; }

    #menu-asignar-resumen {
      display: none; position: fixed; z-index: 4000; background: #fff; border: 1px solid #ccc;
      border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,0.25); min-width: 160px; padding: 4px 0; font-size: 13px;
    }
    #menu-asignar-resumen .mc-item { padding: 8px 14px; cursor: pointer; }
    #menu-asignar-resumen .mc-item:hover { background: #eef3ff; }
    #menu-asignar-resumen .mc-item.mc-padre::after { content: '▸'; float: right; color: #999; margin-left: 10px; }

    #submenu-estado-resumen {
      display: none; position: fixed; z-index: 4050; background: #fff; border: 1px solid #ccc;
      border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,0.25); min-width: 260px; padding: 4px 0; font-size: 13px;
    }
    #submenu-estado-resumen .mc-item { padding: 8px 14px; cursor: pointer; }
    #submenu-estado-resumen .mc-item:hover { background: #eef3ff; }

    .overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.55); align-items: center; justify-content: center; z-index: 5000;
    }
    .overlay-caja { background: white; border-radius: 8px; padding: 22px; max-width: 400px; width: 90%; }
    .overlay-caja h3 { margin-top: 0; font-size: 16px; }
    .overlay-caja label { display: block; font-weight: bold; font-size: 12px; margin: 10px 0 4px; }
    .overlay-caja select { width: 100%; padding: 7px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 13px; }
    .overlay-botones { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  </style>
</head>
<body>

  <div class="header-bar">
    <h1>📊 Resumen</h1>
    <div>
      <span id="texto-usuario" class="estado-msg"></span>
      <span id="pref-inicio-wrap-resumen" style="display:none; font-size:12px; color:#666;">
        Al entrar, ir directo a:
        <select id="sel-pref-inicio-resumen" onchange="guardarPrefInicioResumen()" style="padding:3px; border-radius:4px; border:1px solid #ccc;">
          <option value="">Inicio</option>
          <option value="resumen">Mis tareas (Resumen)</option>
        </select>
      </span>
      <button class="secundario" onclick="alternarTema()">🌙/☀️</button>
      <button class="secundario" onclick="location.href='index.html'">🏠 Inicio</button>
      <button class="secundario" onclick="location.href='arbol.html'">🌳 Árbol</button>
      <button class="secundario" id="btn-usuarios" onclick="location.href='usuarios.html'" style="display:none;">👤 Usuarios</button>
      <button class="secundario" onclick="cerrarSesion()">Cerrar sesión</button>
      <button style="background:#dc3545; color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-weight:bold; font-size:13px;" onclick="cerrarPagina()">❌ Cerrar</button>
    </div>
  </div>

  <div id="contenido">
    <p>Cargando...</p>
  </div>

  <div id="menu-asignar-resumen"></div>
  <div id="submenu-estado-resumen"></div>

  <div class="overlay" id="modal-aviso-resumen" style="z-index:5000;">
    <div class="overlay-caja" style="max-width:400px; text-align:center;">
      <p id="modal-aviso-resumen-texto" style="font-size:14px; margin:10px 0 18px; white-space:pre-line;"></p>
      <button onclick="document.getElementById('modal-aviso-resumen').style.display='none';">Aceptar</button>
    </div>
  </div>

  <div class="overlay" id="modal-confirmacion-resumen" style="z-index:5000;">
    <div class="overlay-caja" style="max-width:400px; text-align:center;">
      <p id="modal-confirmacion-resumen-texto" style="font-size:14px; margin:10px 0 18px; white-space:pre-line;"></p>
      <div class="overlay-botones" style="justify-content:center;">
        <button class="secundario" id="confirmacion-resumen-no">Cancelar</button>
        <button id="confirmacion-resumen-si">Confirmar</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="modal-pedirtexto-resumen" style="z-index:5000;">
    <div class="overlay-caja" style="max-width:420px;">
      <p id="modal-pedirtexto-resumen-texto" style="font-size:14px; margin:10px 0 10px; white-space:pre-line;"></p>
      <textarea id="pedirtexto-resumen-input" rows="3" style="width:100%; box-sizing:border-box; padding:8px; border:1px solid #ccc; border-radius:4px; font-family:inherit; font-size:13px;"></textarea>
      <div class="overlay-botones">
        <button class="secundario" id="pedirtexto-resumen-cancel">Cancelar</button>
        <button id="pedirtexto-resumen-ok">Aceptar</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="modal-asignar-resumen">
    <div class="overlay-caja">
      <h3>Asignar usuario / supervisor</h3>
      <label>Usuario</label>
      <select id="ar-trabajador"><option value="">— Sin asignar —</option></select>
      <label>Supervisor</label>
      <select id="ar-revisor"><option value="">— Sin asignar —</option></select>
      <div class="estado-msg" id="ar-estado"></div>
      <div class="overlay-botones">
        <button class="secundario" onclick="cerrarModalAsignarResumen()">Cancelar</button>
        <button onclick="guardarAsignacionResumen()">Guardar</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script>
    const SUPABASE_URL = 'https://wuarkraddnndmgvfnkmm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_qF-x44yXSydPBojMk_GOUg_TM34uXFI';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const esMovil = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || window.innerWidth < 768;
    document.body.classList.toggle('vista-movil', esMovil);

    const TIPOS_SIN_ASIGNACION = new Set(['BUQUE']);

    const ESTADOS_ORDEN = ['sin_asignar', 'asignada_sin_empezar', 'en_proceso', 'pendiente_revision', 'pendiente_dudas', 'pendiente_cambios_modelo', 'aprobado', 'rechazado'];
    const ETIQUETAS_ESTADO = {
      sin_asignar: 'Sin asignar',
      asignada_sin_empezar: 'Pendiente de hacer',
      en_proceso: 'En proceso',
      pendiente_revision: 'Pendiente de revisión',
      pendiente_dudas: 'Pendiente de dudas',
      pendiente_cambios_modelo: 'Pendiente de cambios de modelo',
      aprobado: 'Aprobado',
      rechazado: 'Rechazado'
    };

    let miPerfil = null;
    let filtroDetalleEstado = null;
    let mapaNodoPorId = {};

    function rutaCompleta(nodo) {
      const partes = [];
      let actual = nodo;
      while (actual) {
        partes.unshift(actual.codigo);
        actual = actual.parent_id ? mapaNodoPorId[actual.parent_id] : null;
      }
      return partes.join('>');
    }

    function calcularEstadoPropio(nodo) {
      if (nodo.revision_estado === 'APROBADO') return 'aprobado';
      if (nodo.revision_estado === 'RECHAZADO') return 'rechazado';
      if (nodo.revision_estado === 'PENDIENTE' || nodo.revision_estado === 'EN_REVISION') return 'pendiente_revision';
      if (nodo.trabajo_estado === 'EN_TRABAJO') return 'en_proceso';
      if (nodo.trabajo_estado === 'PENDIENTE_DUDAS') return 'pendiente_dudas';
      if (nodo.trabajo_estado === 'PENDIENTE_CAMBIOS_MODELO') return 'pendiente_cambios_modelo';
      if (nodo.trabajador_id) return 'asignada_sin_empezar';
      return 'sin_asignar';
    }

    async function registrarLog(accion, descripcion) {
      try {
        await supabaseClient.from('audit_log').insert({ accion, descripcion, user_agent: navigator.userAgent });
      } catch (e) {
        console.warn('No se pudo registrar el log:', e);
      }
    }

    async function cerrarSesion() {
      await registrarLog('LOGOUT', `Cerró sesión (${miPerfil?.username || ''})`);
      await supabaseClient.auth.signOut();
      window.location.href = 'login.html';
    }

    function cerrarPagina() {
      window.close();
      setTimeout(() => { history.back(); }, 150);
    }

    function esGestor() { return miPerfil.rol === 'ADMIN' || miPerfil.rol === 'REVISOR'; }
    function esInvitado() { return miPerfil.rol === 'INVITADO'; }
    function pareceGestor() { return esGestor() || esInvitado(); }

    function renderContadores(conteo, clicable, total) {
      const cajaTotal = (total === undefined) ? '' : `
        <div class="contador c-total ${clicable ? 'clicable' : ''} ${clicable && !filtroDetalleEstado ? 'activo' : ''}"
             ${clicable ? `onclick="limpiarFiltroDetalle()"` : ''}>
          <span class="numero">${total}</span>
          <span class="etiqueta">Todas</span>
        </div>
      `;
      return `
        <div class="contadores">
          ${cajaTotal}
          ${ESTADOS_ORDEN.map(e => `
            <div class="contador c-${e} ${clicable ? 'clicable' : ''} ${clicable && filtroDetalleEstado === e ? 'activo' : ''}"
                 ${clicable ? `onclick="filtrarDetallePorEstado('${e}')"` : ''}>
              <span class="numero">${conteo[e] || 0}</span>
              <span class="etiqueta">${ETIQUETAS_ESTADO[e]}</span>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderListaNodos(nodos, vacio, permitirAsignar) {
      if (nodos.length === 0) return `<li>${vacio}</li>`;
      return nodos.map(n => {
        const estado = calcularEstadoPropio(n);
        return `
          <li ${permitirAsignar ? `oncontextmenu="mostrarMenuAsignarResumen(event, '${n.id}'); return false;" style="cursor:context-menu;"` : ''}>
            <span class="flecha f-${estado}">${estado === 'aprobado' ? '✔' : (estado === 'rechazado' ? '✘' : '▶')}</span>
            <div>
              <div><strong>${n.codigo}</strong> ${n.nombre} ${n.trabajador_nombre ? `— 👷 ${n.trabajador_nombre}` : ''}</div>
              <div class="ruta-nodo">${rutaCompleta(n)}${n.comentario_revision ? ' · ' + n.comentario_revision : ''}</div>
            </div>
          </li>
        `;
      }).join('');
    }

    function envolverListaConScroll(nodos, vacio, permitirAsignar) {
      const necesitaScroll = nodos.length > 3;
      const estilo = necesitaScroll ? 'max-height:170px; overflow-y:auto;' : '';
      return `<ul class="lista-nodos" style="${estilo}">${renderListaNodos(nodos, vacio, permitirAsignar)}</ul>`;
    }

    // -------------------- Asignar desde resumen (clic derecho) --------------------

    let perfilesCache = [];
    let nodoAsignarResumenActual = null;

    async function cargarPerfilesResumen() {
      const { data } = await supabaseClient.from('profiles').select('*').eq('activo', true);
      perfilesCache = (data || []).sort((a, b) =>
        (a.nombre_completo || '').localeCompare(b.nombre_completo || '', 'es', { sensitivity: 'base' })
      );
    }

    function mostrarMenuAsignarResumen(evento, nodeId) {
      nodoAsignarResumenActual = nodeId;
      const menu = document.getElementById('menu-asignar-resumen');
      menu.innerHTML = `
        <div class="mc-item" id="mc-asignar-item">👤 Asignar usuario / supervisor</div>
        <div class="mc-item mc-padre" id="mc-estado-item">Estado tarea</div>
      `;
      const avisoInvitado = () => mostrarAvisoModal('Eres un usuario Invitado: solo puedes consultar, no puedes realizar cambios.');
      document.getElementById('mc-asignar-item').addEventListener('click', (e) => {
        e.stopPropagation();
        cerrarMenuAsignarResumen();
        if (esInvitado()) { avisoInvitado(); return; }
        abrirModalAsignarResumen(nodeId);
      });
      document.getElementById('mc-estado-item').addEventListener('click', (e) => {
        e.stopPropagation();
        if (esInvitado()) { cerrarMenuAsignarResumen(); avisoInvitado(); return; }
        mostrarSubmenuEstadoResumen(document.getElementById('mc-estado-item'), nodeId);
      });
      menu.style.left = evento.clientX + 'px';
      menu.style.top = evento.clientY + 'px';
      menu.style.display = 'block';
    }
    function cerrarMenuAsignarResumen() {
      document.getElementById('menu-asignar-resumen').style.display = 'none';
      document.getElementById('submenu-estado-resumen').style.display = 'none';
    }
    document.addEventListener('click', cerrarMenuAsignarResumen);

    function mostrarAvisoModal(mensaje) {
      document.getElementById('modal-aviso-resumen-texto').textContent = mensaje;
      document.getElementById('modal-aviso-resumen').style.display = 'flex';
    }

    function mostrarConfirmacion(mensaje) {
      return new Promise((resolve) => {
        document.getElementById('modal-confirmacion-resumen-texto').textContent = mensaje;
        document.getElementById('modal-confirmacion-resumen').style.display = 'flex';
        const btnSi = document.getElementById('confirmacion-resumen-si');
        const btnNo = document.getElementById('confirmacion-resumen-no');
        const limpiar = () => { btnSi.onclick = null; btnNo.onclick = null; document.getElementById('modal-confirmacion-resumen').style.display = 'none'; };
        btnSi.onclick = () => { limpiar(); resolve(true); };
        btnNo.onclick = () => { limpiar(); resolve(false); };
      });
    }

    function pedirTexto(mensaje) {
      return new Promise((resolve) => {
        document.getElementById('modal-pedirtexto-resumen-texto').textContent = mensaje;
        const input = document.getElementById('pedirtexto-resumen-input');
        input.value = '';
        document.getElementById('modal-pedirtexto-resumen').style.display = 'flex';
        setTimeout(() => input.focus(), 50);
        const btnOk = document.getElementById('pedirtexto-resumen-ok');
        const btnCancel = document.getElementById('pedirtexto-resumen-cancel');
        const limpiar = () => { btnOk.onclick = null; btnCancel.onclick = null; document.getElementById('modal-pedirtexto-resumen').style.display = 'none'; };
        btnOk.onclick = () => { const v = input.value; limpiar(); resolve(v); };
        btnCancel.onclick = () => { limpiar(); resolve(null); };
      });
    }

    function traducirError(mensaje) {
      if (!mensaje) return 'Ha ocurrido un error inesperado.';
      const m = mensaje.toLowerCase();
      if (m.includes('duplicate key')) return 'Ya existe un registro con ese mismo dato — no se puede repetir.';
      if (m.includes('violates foreign key constraint')) return 'No se puede completar: hace referencia a algo que ya no existe.';
      if (m.includes('new row violates row-level security') || m.includes('permission denied')) return 'No tienes permiso para hacer esto.';
      if (m.includes('failed to fetch') || m.includes('networkerror')) return 'No se pudo conectar — comprueba tu conexión a internet.';
      if (m.includes('jwt') || m.includes('token') || m.includes('session')) return 'Tu sesión ha caducado — vuelve a iniciar sesión.';
      return mensaje;
    }

    async function accionEstadoResumen(rpc, nodeId, params) {
      const { error } = await supabaseClient.rpc(rpc, { p_node_id: nodeId, ...(params || {}) });
      if (error) { mostrarAvisoModal('Error: ' + traducirError(error.message)); return; }
      await recargarDatos();
    }

    function mostrarSubmenuEstadoResumen(elementoPadre, nodeId) {
      const opciones = [
        { label: '✔ Aprobado', fn: () => accionEstadoResumen('revisar_nodo', nodeId, { p_aprobado: true }) },
        { label: '✘ Rechazado', fn: async () => {
            const comentario = await pedirTexto('Motivo del rechazo (obligatorio):');
            if (!comentario || !comentario.trim()) return;
            accionEstadoResumen('revisar_nodo', nodeId, { p_aprobado: false, p_comentario: comentario });
          } },
        { label: 'Sin asignar', fn: async () => { if (await mostrarConfirmacion('¿Quitar el usuario asignado?')) accionEstadoResumen('desasignar_trabajador', nodeId); } },
        { label: 'Pendiente de hacer', fn: async () => { if (await mostrarConfirmacion('¿Reiniciar esta tarea?')) accionEstadoResumen('reiniciar_tarea', nodeId); } },
        { label: 'En proceso', fn: () => accionEstadoResumen('marcar_en_trabajo', nodeId) },
        { label: 'Pendiente de revisión', fn: () => accionEstadoResumen('marcar_terminado', nodeId) },
        { label: 'Pendiente de dudas', fn: () => accionEstadoResumen('marcar_pendiente_dudas', nodeId) },
        { label: 'Pendiente cambios en modelo', fn: () => accionEstadoResumen('marcar_pendiente_cambios_modelo', nodeId) }
      ];

      const sub = document.getElementById('submenu-estado-resumen');
      sub.innerHTML = opciones.map((o, i) => `<div class="mc-item" data-idx="${i}">${o.label}</div>`).join('');
      sub.querySelectorAll('.mc-item').forEach(el => {
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          cerrarMenuAsignarResumen();
          opciones[parseInt(el.dataset.idx, 10)].fn();
        });
      });

      const rect = elementoPadre.getBoundingClientRect();
      let x = rect.right + 2;
      if (x + 260 > window.innerWidth) x = rect.left - 262;
      let y = rect.top;
      if (y + 300 > window.innerHeight) y = window.innerHeight - 300;
      sub.style.left = x + 'px';
      sub.style.top = Math.max(y, 10) + 'px';
      sub.style.display = 'block';
    }

    function abrirModalAsignarResumen(nodeId) {
      const nodo = mapaNodoPorId[nodeId];
      const selTrab = document.getElementById('ar-trabajador');
      const selRev = document.getElementById('ar-revisor');

      const usuarios = perfilesCache.filter(p => p.rol === 'TRABAJADOR');
      const revisores = perfilesCache.filter(p => p.rol === 'REVISOR');

      selTrab.innerHTML = '<option value="">— Sin asignar —</option>' +
        usuarios.map(p => `<option value="${p.id}" ${p.id === nodo.trabajador_id ? 'selected' : ''}>${p.nombre_completo}</option>`).join('');
      selRev.innerHTML = '<option value="">— Sin asignar —</option>' +
        revisores.map(p => `<option value="${p.id}" ${p.id === nodo.revisor_id ? 'selected' : ''}>${p.nombre_completo}</option>`).join('');

      document.getElementById('ar-estado').textContent = '';
      document.getElementById('modal-asignar-resumen').style.display = 'flex';
    }
    function cerrarModalAsignarResumen() {
      document.getElementById('modal-asignar-resumen').style.display = 'none';
    }

    async function guardarAsignacionResumen() {
      const estadoEl = document.getElementById('ar-estado');
      const trabajadorId = document.getElementById('ar-trabajador').value || null;
      const revisorId = document.getElementById('ar-revisor').value || null;

      const { error } = await supabaseClient.rpc('asignar_trabajo', {
        p_node_id: nodoAsignarResumenActual, p_trabajador_id: trabajadorId, p_revisor_id: revisorId
      });

      if (error) { estadoEl.textContent = 'Error: ' + traducirError(error.message); estadoEl.className = 'estado-msg error'; return; }

      cerrarModalAsignarResumen();
      await recargarDatos();
    }

    function aplicarTema(tema) {
      document.body.classList.toggle('tema-oscuro', tema === 'oscuro');
      localStorage.setItem('estructura_tema', tema);
    }
    function alternarTema() {
      aplicarTema(document.body.classList.contains('tema-oscuro') ? 'claro' : 'oscuro');
    }
    aplicarTema(localStorage.getItem('estructura_tema') || 'claro');

    async function iniciar() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.href = 'login.html?next=resumen.html'; return; }

      const { data: perfil, error } = await supabaseClient
        .from('profiles').select('*').eq('id', session.user.id).single();

      if (error || !perfil || !perfil.activo) {
        document.body.innerHTML = '<p style="color:red; font-weight:bold; margin-top:60px; text-align:center;">No tienes acceso.</p>';
        return;
      }

      miPerfil = perfil;
      document.getElementById('texto-usuario').textContent =
        `${perfil.nombre_completo} (${perfil.username}) — ${perfil.rol === 'TRABAJADOR' ? 'USUARIO' : (perfil.rol === 'REVISOR' ? 'SUPERVISOR' : perfil.rol)}`;
      if (perfil.rol === 'ADMIN') document.getElementById('btn-usuarios').style.display = 'inline-block';

      if (perfil.rol === 'TRABAJADOR') {
        document.getElementById('pref-inicio-wrap-resumen').style.display = 'inline';
        document.getElementById('sel-pref-inicio-resumen').value = localStorage.getItem('estructura_inicio_' + perfil.id) || '';
      }

      if (pareceGestor()) await cargarPerfilesResumen();

      await recargarDatos();

    function guardarPrefInicioResumen() {
      const valor = document.getElementById('sel-pref-inicio-resumen').value;
      if (valor) localStorage.setItem('estructura_inicio_' + miPerfil.id, valor);
      else localStorage.removeItem('estructura_inicio_' + miPerfil.id);
    }

    async function recargarDatos() {
      const { data: nodos, error: errorNodos } = await supabaseClient
        .from('v_nodes_with_workflow').select('*').eq('activo', true);

      if (errorNodos) {
        document.getElementById('contenido').innerHTML = `<p style="color:red;">Error: ${errorNodos.message}</p>`;
        return;
      }

      mapaNodoPorId = {};
      nodos.forEach(n => { mapaNodoPorId[n.id] = n; });

      const nodosRelevantes = nodos.filter(n => !TIPOS_SIN_ASIGNACION.has(n.tipo));

      if (pareceGestor()) {
        await renderVistaGestor(nodosRelevantes);
      } else {
        renderVistaUsuario(nodosRelevantes);
      }
    }

    let debounceRecargaResumen = null;
    function recargarConDebounce() {
      clearTimeout(debounceRecargaResumen);
      debounceRecargaResumen = setTimeout(() => recargarDatos(), 400);
    }

    function suscribirseARealtime() {
      supabaseClient
        .channel('resumen_node_workflow')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'node_workflow' }, () => recargarConDebounce())
        .subscribe();

      supabaseClient
        .channel('resumen_nodes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'nodes' }, () => recargarConDebounce())
        .subscribe();
    }

    let misNodosActual = [];
    let nodosGestorActual = [];
    let idsUsuariosGestor = new Set();

    function renderVistaUsuario(nodos) {
      misNodosActual = nodos.filter(n => n.trabajador_id === miPerfil.id);
      pintarVistaUsuario();
    }

    function calcularJornadaHoy(nodos) {
      const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
      let minutosHoy = 0;
      const tareasHoy = new Set();

      nodos.forEach(n => {
        if (n.trabajo_iniciado_en) {
          const inicio = new Date(n.trabajo_iniciado_en);
          const fin = n.trabajo_terminado_en ? new Date(n.trabajo_terminado_en) : new Date();
          const inicioEfectivo = inicio > hoy ? inicio : hoy;
          if (fin > inicioEfectivo) {
            minutosHoy += Math.floor((fin - inicioEfectivo) / 60000);
            tareasHoy.add(n.id);
          }
        }
        if (n.trabajo_terminado_en && new Date(n.trabajo_terminado_en) >= hoy) tareasHoy.add(n.id);
        if (n.revisado_en && new Date(n.revisado_en) >= hoy) tareasHoy.add(n.id);
      });

      const horas = Math.floor(minutosHoy / 60);
      const mins = minutosHoy % 60;
      return { texto: `${horas}h ${String(mins).padStart(2, '0')}min`, tareas: tareasHoy.size };
    }

    // "De hoy" = ya en marcha (En proceso, dudas, cambios de modelo), o
    // planificada para caer hoy según su fecha prevista, o ya debería
    // estar terminada (fecha fin prevista ya pasada) y sigue sin aprobar.
    function calcularPendientesHoy(nodos) {
      const hoyIso = new Date().toISOString().slice(0, 10);
      return nodos.filter(n => {
        const estado = calcularEstadoPropio(n);
        if (estado === 'aprobado' || estado === 'sin_asignar') return false;
        if (estado === 'en_proceso' || estado === 'pendiente_dudas' || estado === 'pendiente_cambios_modelo') return true;
        if (n.fecha_inicio_prevista && n.fecha_fin_prevista) return n.fecha_inicio_prevista <= hoyIso && hoyIso <= n.fecha_fin_prevista;
        if (n.fecha_fin_prevista) return n.fecha_fin_prevista <= hoyIso;
        return false;
      });
    }

    function pintarVistaUsuario() {
      const conteo = {};
      misNodosActual.forEach(n => {
        const e = calcularEstadoPropio(n);
        conteo[e] = (conteo[e] || 0) + 1;
      });

      const jornada = calcularJornadaHoy(misNodosActual);
      const pendientesHoy = calcularPendientesHoy(misNodosActual);

      const nodosDetalle = filtroDetalleEstado
        ? misNodosActual.filter(n => calcularEstadoPropio(n) === filtroDetalleEstado)
        : misNodosActual;

      const tituloDetalle = filtroDetalleEstado
        ? `Detalle — ${ETIQUETAS_ESTADO[filtroDetalleEstado]} <button class="secundario" style="margin-left:8px; padding:2px 10px; font-size:11px;" onclick="limpiarFiltroDetalle()">✕ Ver todas</button>`
        : 'Detalle';

      document.getElementById('contenido').innerHTML = `
        <div class="card">
          <h2>☀️ Tu jornada de hoy</h2>
          <p style="font-size:13px;">Tiempo trabajado hoy: <strong>${jornada.texto}</strong> · Tareas con movimiento hoy: <strong>${jornada.tareas}</strong></p>
        </div>
        <div class="card">
          <h2>📆 Mis pendientes de hoy (${pendientesHoy.length})</h2>
          <p style="font-size:11px; color:#888; margin:-4px 0 8px;">Lo que ya tienes en marcha, lo planificado para hoy, o lo que ya debería estar terminado.</p>
          <ul class="lista-nodos" style="max-height:260px; overflow-y:auto;">
            ${renderListaNodos(pendientesHoy, 'Nada urgente para hoy.')}
          </ul>
        </div>
        <div class="card">
          <h2>Tus tareas asignadas (${misNodosActual.length})</h2>
          <p style="font-size:11px; color:#888; margin:-4px 0 8px;">Pulsa un estado para ver solo esas tareas abajo.</p>
          ${renderContadores(conteo, true, misNodosActual.length)}
        </div>
        <div class="card">
          <h2>${tituloDetalle}</h2>
          <ul class="lista-nodos" style="max-height:340px; overflow-y:auto;">
            ${renderListaNodos(nodosDetalle, filtroDetalleEstado ? 'No hay tareas en este estado.' : 'No tienes tareas asignadas todavía.')}
          </ul>
        </div>
      `;
    }

    function filtrarDetallePorEstado(estado) {
      filtroDetalleEstado = (filtroDetalleEstado === estado) ? null : estado;
      if (pareceGestor()) pintarVistaGestor(); else pintarVistaUsuario();
    }

    function limpiarFiltroDetalle() {
      filtroDetalleEstado = null;
      if (pareceGestor()) pintarVistaGestor(); else pintarVistaUsuario();
    }

    let comentariosModeloCache = { GHE: [], NAV: [] };

    async function cargarComentariosModeloParaKPIs() {
      if (!esGestor()) { comentariosModeloCache = { GHE: [], NAV: [] }; return; }
      const [rGhe, rNav] = await Promise.all([
        supabaseClient.rpc('listar_todos_comentarios_modelo', { p_origen: 'GHE' }),
        supabaseClient.rpc('listar_todos_comentarios_modelo', { p_origen: 'NAV' })
      ]);
      comentariosModeloCache = {
        GHE: rGhe.error ? [] : (rGhe.data || []),
        NAV: rNav.error ? [] : (rNav.data || [])
      };
    }

    function buqueDeNodo(nodo) {
      let actual = nodo;
      while (actual) {
        if (actual.tipo === 'BUQUE') return actual;
        actual = actual.parent_id ? mapaNodoPorId[actual.parent_id] : null;
      }
      return null;
    }

    const UMBRAL_CUELLO_BOTELLA_DIAS = 3;

    function formatearMinutos(mins) {
      if (mins === null || mins === undefined) return '—';
      const totalMin = Math.round(mins);
      if (totalMin <= 0) return '—';
      const dias = Math.floor(totalMin / 1440);
      const horas = Math.floor((totalMin % 1440) / 60);
      const m = totalMin % 60;
      if (dias > 0) return `${dias}d ${horas}h`;
      if (horas > 0) return `${horas}h ${m}min`;
      return `${m}min`;
    }

    function calcularKPIsPorBuque(nodos) {
      const buques = Object.values(mapaNodoPorId).filter(n => n.tipo === 'BUQUE');
      const ahora = new Date();

      return buques.map(buque => {
        const propios = nodos.filter(n => { const b = buqueDeNodo(n); return b && b.id === buque.id; });
        const total = propios.length;
        const aprobados = propios.filter(n => calcularEstadoPropio(n) === 'aprobado').length;
        const rechazados = propios.filter(n => calcularEstadoPropio(n) === 'rechazado').length;
        const avance = total > 0 ? Math.round((aprobados / total) * 100) : 0;
        const revisados = aprobados + rechazados;
        const pctRechazo = revisados > 0 ? Math.round((rechazados / revisados) * 100) : 0;

        const enColaRevision = propios.filter(n =>
          (n.revision_estado === 'PENDIENTE' || n.revision_estado === 'EN_REVISION') && n.trabajo_terminado_en
        );
        const cuellosBotella = enColaRevision.filter(n => {
          const dias = (ahora - new Date(n.trabajo_terminado_en)) / 86400000;
          return dias > UMBRAL_CUELLO_BOTELLA_DIAS;
        }).length;

        const revisionesConTiempo = propios.filter(n =>
          n.trabajo_terminado_en && n.revisado_en && (n.revision_estado === 'APROBADO' || n.revision_estado === 'RECHAZADO')
        );
        let tiempoMedioRevisionMin = null;
        if (revisionesConTiempo.length > 0) {
          const totalMin = revisionesConTiempo.reduce((acc, n) =>
            acc + (new Date(n.revisado_en) - new Date(n.trabajo_terminado_en)) / 60000, 0);
          tiempoMedioRevisionMin = totalMin / revisionesConTiempo.length;
        }

        const comentariosBuque = (origen) => (comentariosModeloCache[origen] || []).filter(c => c.buque_id === buque.id);
        const abiertosGhe = comentariosBuque('GHE').filter(c => !c.implementado);
        const abiertosNav = comentariosBuque('NAV').filter(c => !c.implementado);
        const masAntiguo = (lista) => lista.length === 0 ? null :
          lista.reduce((min, c) => new Date(c.creado_en) < new Date(min.creado_en) ? c : min);
        const diasAntiguedad = (c) => c ? Math.floor((ahora - new Date(c.creado_en)) / 86400000) : null;

        return {
          buque, total, avance, cuellosBotella, tiempoMedioRevisionMin, pctRechazo,
          abiertosGhe: abiertosGhe.length, abiertosNav: abiertosNav.length,
          antiguedadGheMax: diasAntiguedad(masAntiguo(abiertosGhe)),
          antiguedadNavMax: diasAntiguedad(masAntiguo(abiertosNav))
        };
      }).sort((a, b) => b.cuellosBotella - a.cuellosBotella);
    }

    function renderKPIsPorBuque() {
      const filas = calcularKPIsPorBuque(nodosGestorActual);
      if (filas.length === 0) return '';
      return `
        <div class="card solo-escritorio">
          <h2>📈 KPIs por buque</h2>
          <p style="font-size:11px; color:#888; margin:-4px 0 8px;">
            Ordenado por cuellos de botella (más críticos arriba). Cuello de botella = tarea esperando revisión desde hace más de ${UMBRAL_CUELLO_BOTELLA_DIAS} días.
          </p>
          <table>
            <thead>
              <tr>
                <th>Buque</th><th>Nodos</th><th>% Avance</th><th>⚠️ Cuellos de botella</th>
                <th>Tiempo medio de revisión</th><th>% Rechazo</th>
                <th>Ghenova abiertos</th><th>Navantia abiertos</th>
              </tr>
            </thead>
            <tbody>
              ${filas.map(f => `
                <tr>
                  <td><strong>${f.buque.codigo}</strong></td>
                  <td class="num">${f.total}</td>
                  <td class="num">${f.avance}%</td>
                  <td class="num" style="${f.cuellosBotella > 0 ? 'color:#dc3545; font-weight:bold;' : ''}">${f.cuellosBotella}</td>
                  <td class="num">${formatearMinutos(f.tiempoMedioRevisionMin)}</td>
                  <td class="num">${f.pctRechazo}%</td>
                  <td class="num">${f.abiertosGhe}${f.antiguedadGheMax !== null ? ` (máx ${f.antiguedadGheMax}d)` : ''}</td>
                  <td class="num">${f.abiertosNav}${f.antiguedadNavMax !== null ? ` (máx ${f.antiguedadNavMax}d)` : ''}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    const NUM_SEMANAS_PREVISION = 6;

    function calcularPrevisionCargaFutura(nodos) {
      const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
      const diaSemanaISO = hoy.getDay() || 7; // lunes=1 ... domingo=7
      const lunes = new Date(hoy); lunes.setDate(hoy.getDate() - (diaSemanaISO - 1));
      const semanas = [];
      for (let i = 0; i < NUM_SEMANAS_PREVISION; i++) {
        const inicio = new Date(lunes); inicio.setDate(inicio.getDate() + i * 7);
        const fin = new Date(inicio); fin.setDate(fin.getDate() + 6);
        semanas.push({ inicio, fin });
      }

      const porUsuario = {};
      nodos.forEach(n => {
        if (!n.trabajador_id || !idsUsuariosGestor.has(n.trabajador_id)) return;
        if (calcularEstadoPropio(n) === 'aprobado') return;
        if (!n.fecha_inicio_prevista && !n.fecha_fin_prevista) return;
        const ini = n.fecha_inicio_prevista ? new Date(n.fecha_inicio_prevista + 'T00:00:00') : new Date(n.fecha_fin_prevista + 'T00:00:00');
        const fin = n.fecha_fin_prevista ? new Date(n.fecha_fin_prevista + 'T00:00:00') : ini;
        if (!porUsuario[n.trabajador_id]) porUsuario[n.trabajador_id] = { nombre: n.trabajador_nombre, semanas: new Array(NUM_SEMANAS_PREVISION).fill(0) };
        semanas.forEach((s, i) => { if (ini <= s.fin && fin >= s.inicio) porUsuario[n.trabajador_id].semanas[i]++; });
      });

      return { semanas, filas: Object.values(porUsuario).sort((a, b) => a.nombre.localeCompare(b.nombre, 'es')) };
    }

    function colorCeldaCarga(n) {
      if (n === 0) return '';
      if (n <= 1) return 'background:#fff3cd;';
      if (n <= 3) return 'background:#ffc107;';
      return 'background:#dc3545; color:#fff;';
    }

    function renderPrevisionCargaFutura() {
      const { semanas, filas } = calcularPrevisionCargaFutura(nodosGestorActual);
      return `
        <div class="card solo-escritorio">
          <h2>📅 Previsión de carga futura</h2>
          <p style="font-size:11px; color:#888; margin:-4px 0 8px;">
            Tareas pendientes (sin aprobar) por usuario que caen en cada semana según su fecha prevista. Sirve para ver quién se va a saturar antes de que pase, no solo quién está ocupado hoy.
            ${filas.length === 0 ? ' Todavía no hay tareas con fechas previstas para calcularla.' : ''}
          </p>
          ${filas.length === 0 ? '' : `
            <table>
              <thead>
                <tr>
                  <th>Usuario</th>
                  ${semanas.map(s => `<th>${String(s.inicio.getDate()).padStart(2, '0')}/${String(s.inicio.getMonth() + 1).padStart(2, '0')}</th>`).join('')}
                </tr>
              </thead>
              <tbody>
                ${filas.map(f => `
                  <tr>
                    <td>${f.nombre}</td>
                    ${f.semanas.map(n => `<td class="num" style="${colorCeldaCarga(n)}">${n || ''}</td>`).join('')}
                  </tr>
                `).join('')}
              </tbody>
            </table>
          `}
        </div>
      `;
    }

    async function renderVistaGestor(nodos) {
      nodosGestorActual = nodos;

      const idsConTarea = [...new Set(nodos.filter(n => n.trabajador_id).map(n => n.trabajador_id))];
      idsUsuariosGestor = new Set();
      if (idsConTarea.length > 0) {
        const { data: perfiles } = await supabaseClient
          .from('profiles').select('id, rol').in('id', idsConTarea);
        idsUsuariosGestor = new Set((perfiles || []).filter(p => p.rol === 'TRABAJADOR').map(p => p.id));
      }

      await cargarComentariosModeloParaKPIs();
      pintarVistaGestor();
    }

    function pintarVistaGestor() {
      const nodos = nodosGestorActual;

      const conteoGeneral = {};
      nodos.forEach(n => {
        const e = calcularEstadoPropio(n);
        conteoGeneral[e] = (conteoGeneral[e] || 0) + 1;
      });

      const conteoPorUsuario = {};
      nodos.forEach(n => {
        if (n.trabajador_id && idsUsuariosGestor.has(n.trabajador_id)) {
          if (!conteoPorUsuario[n.trabajador_id]) {
            conteoPorUsuario[n.trabajador_id] = { nombre: n.trabajador_nombre, tiempoEnProcesoMs: 0 };
            ESTADOS_ORDEN.forEach(e => conteoPorUsuario[n.trabajador_id][e] = 0);
          }
          conteoPorUsuario[n.trabajador_id][calcularEstadoPropio(n)]++;
          if (n.trabajo_estado === 'EN_TRABAJO' && n.trabajo_iniciado_en) {
            conteoPorUsuario[n.trabajador_id].tiempoEnProcesoMs += (new Date() - new Date(n.trabajo_iniciado_en));
          }
        }
      });

      const columnasUsuario = ESTADOS_ORDEN.filter(e => e !== 'sin_asignar');

      const filasUsuario = Object.values(conteoPorUsuario)
        .sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'))
        .map(u => {
          const abiertas = columnasUsuario.reduce((acc, e) => acc + (e === 'aprobado' ? 0 : u[e]), 0);
          return `
          <tr>
            <td>${u.nombre}</td>
            <td class="num" style="font-weight:bold;">${abiertas}</td>
            <td class="num">${formatearMinutos(u.tiempoEnProcesoMs / 60000)}</td>
            ${columnasUsuario.map(e => `<td class="num">${u[e]}</td>`).join('')}
          </tr>
        `;
        }).join('');

      const rechazados = nodos.filter(n => n.revision_estado === 'RECHAZADO');
      const dudas = nodos.filter(n => n.trabajo_estado === 'PENDIENTE_DUDAS');
      const cambiosModelo = nodos.filter(n => n.trabajo_estado === 'PENDIENTE_CAMBIOS_MODELO');
      const sinAsignar = nodos.filter(n => calcularEstadoPropio(n) === 'sin_asignar');

      const colaRevision = nodos
        .filter(n => n.revision_estado === 'PENDIENTE' || n.revision_estado === 'EN_REVISION')
        .filter(n => n.trabajo_terminado_en)
        .sort((a, b) => new Date(a.trabajo_terminado_en) - new Date(b.trabajo_terminado_en));

      function formatearEspera(iso) {
        const minutos = Math.floor((new Date() - new Date(iso)) / 60000);
        const horas = Math.floor(minutos / 60);
        const dias = Math.floor(horas / 24);
        if (dias > 0) return `${dias}d ${horas % 24}h esperando`;
        return `${horas}h ${String(minutos % 60).padStart(2, '0')}min esperando`;
      }

      const filasColaRevision = colaRevision.length === 0
        ? '<li>Nada pendiente de revisión ahora mismo.</li>'
        : colaRevision.map(n => `
            <li ${'oncontextmenu="mostrarMenuAsignarResumen(event, \'' + n.id + '\'); return false;" style="cursor:context-menu;"'}>
              <span class="flecha f-pendiente_revision">▶</span>
              <div>
                <div><strong>${n.codigo}</strong> ${n.nombre} ${n.trabajador_nombre ? `— 👷 ${n.trabajador_nombre}` : ''}</div>
                <div class="ruta-nodo">${rutaCompleta(n)} · <strong style="color:#b36b00;">${formatearEspera(n.trabajo_terminado_en)}</strong></div>
              </div>
            </li>
          `).join('');

      const nodosDetalle = filtroDetalleEstado ? nodos.filter(n => calcularEstadoPropio(n) === filtroDetalleEstado) : [];
      const tituloDetalle = filtroDetalleEstado
        ? `Detalle — ${ETIQUETAS_ESTADO[filtroDetalleEstado]} <button class="secundario" style="margin-left:8px; padding:2px 10px; font-size:11px;" onclick="limpiarFiltroDetalle()">✕ Cerrar</button>`
        : '';

      document.getElementById('contenido').innerHTML = `
        <div class="card">
          <h2>Estado general (${nodos.length} nodos)</h2>
          <p style="font-size:11px; color:#888; margin:-4px 0 8px;">Pulsa un estado para ver el detalle de esas tareas.</p>
          ${renderContadores(conteoGeneral, true, nodos.length)}
        </div>

        ${renderKPIsPorBuque()}

        ${renderCurvaAvanceCard()}

        ${filtroDetalleEstado ? `
          <div class="card">
            <h2>${tituloDetalle}</h2>
            <ul class="lista-nodos" style="max-height:340px; overflow-y:auto;">
              ${renderListaNodos(nodosDetalle, 'No hay tareas en este estado.', true)}
            </ul>
          </div>
        ` : ''}

        <div class="card">
          <h2>⏳ Cola de revisión, por antigüedad (${colaRevision.length})</h2>
          <p style="font-size:11px; color:#888; margin:-4px 0 8px;">La que más tiempo lleva esperando, arriba del todo.</p>
          <ul class="lista-nodos" style="max-height:300px; overflow-y:auto;">
            ${filasColaRevision}
          </ul>
        </div>

        ${renderPrevisionCargaFutura()}

        <div class="card solo-escritorio">
          <h2>👷 Carga de trabajo por usuario</h2>
          <p style="font-size:11px; color:#888; margin:-4px 0 8px;">"Abiertas" = tareas sin aprobar todavía. "En proceso" = tiempo acumulado de las tareas que tiene empezadas ahora mismo (para repartir carga).</p>
          <table>
            <thead>
              <tr>
                <th>Usuario</th>
                <th>Abiertas</th>
                <th>⏱️ En proceso</th>
                ${columnasUsuario.map(e => `<th>${ETIQUETAS_ESTADO[e]}</th>`).join('')}
              </tr>
            </thead>
            <tbody>${filasUsuario || `<tr><td colspan="${columnasUsuario.length + 3}">Nadie tiene tareas asignadas todavía.</td></tr>`}</tbody>
          </table>
        </div>

        <div class="card">
          <h2>❓ Pendientes de dudas (${dudas.length})</h2>
          ${envolverListaConScroll(dudas, 'Ninguna ahora mismo.', true)}
        </div>

        <div class="card">
          <h2>🔧 Pendientes de cambios de modelo (${cambiosModelo.length})</h2>
          ${envolverListaConScroll(cambiosModelo, 'Ninguna ahora mismo.', true)}
        </div>

        <div class="card">
          <h2>✘ Rechazados pendientes de corrección (${rechazados.length})</h2>
          ${envolverListaConScroll(rechazados, 'Ninguno ahora mismo.', true)}
        </div>

        <div class="card">
          <h2>Sin asignar (${sinAsignar.length})</h2>
          ${envolverListaConScroll(sinAsignar, 'Todo tiene usuario asignado.', true)}
        </div>
      `;

      pintarCurvaAvance();
    }

    // -------------------- Curva de avance (plan vs. real) --------------------

    let chartCurvaAvance = null;
    let buqueCurvaSeleccionado = null;

    function renderCurvaAvanceCard() {
      const buques = Object.values(mapaNodoPorId).filter(n => n.tipo === 'BUQUE');
      if (buques.length === 0) return '';
      if (!buqueCurvaSeleccionado || !buques.some(b => b.id === buqueCurvaSeleccionado)) {
        buqueCurvaSeleccionado = buques[0].id;
      }
      return `
        <div class="card">
          <h2>📈 Curva de avance — plan vs. real</h2>
          <p style="font-size:11px; color:#888; margin:-4px 0 8px;">
            La línea de plan solo cuenta las tareas que ya tienen fecha fin prevista fijada (menú del árbol → Fechas previstas).
          </p>
          <label style="display:inline-block; font-size:12px; font-weight:bold; margin-bottom:6px;">Buque:
            <select id="sel-curva-buque" onchange="buqueCurvaSeleccionado = this.value; pintarCurvaAvance();" style="padding:4px; border-radius:4px; border:1px solid #ccc; margin-left:6px;">
              ${buques.map(b => `<option value="${b.id}" ${b.id === buqueCurvaSeleccionado ? 'selected' : ''}>${b.codigo}</option>`).join('')}
            </select>
          </label>
          <div id="curva-avance-vacio" style="display:none; font-size:12px; color:#888;">Todavía no hay fechas previstas ni tareas aprobadas en este buque para dibujar la curva.</div>
          <div style="height:280px;"><canvas id="chart-curva-avance"></canvas></div>
        </div>
      `;
    }

    function construirCurvaAvance(buqueId) {
      const propios = nodosGestorActual.filter(n => { const b = buqueDeNodo(n); return b && b.id === buqueId; });
      const total = propios.length;
      if (total === 0) return null;

      const eventosPlan = propios.filter(n => n.fecha_fin_prevista).map(n => n.fecha_fin_prevista);
      const eventosReal = propios.filter(n => n.revision_estado === 'APROBADO' && n.revisado_en).map(n => n.revisado_en.slice(0, 10));
      if (eventosPlan.length === 0 && eventosReal.length === 0) return null;

      const hoyIso = new Date().toISOString().slice(0, 10);
      const fechas = [...new Set([...eventosPlan, ...eventosReal, hoyIso])].sort();

      const contarPlan = {}, contarReal = {};
      eventosPlan.forEach(f => contarPlan[f] = (contarPlan[f] || 0) + 1);
      eventosReal.forEach(f => contarReal[f] = (contarReal[f] || 0) + 1);

      let acumPlan = 0, acumReal = 0;
      const puntosPlan = [], puntosReal = [];
      fechas.forEach(f => {
        acumPlan += (contarPlan[f] || 0);
        acumReal += (contarReal[f] || 0);
        puntosPlan.push(Math.round((acumPlan / total) * 100));
        puntosReal.push(f <= hoyIso ? Math.round((acumReal / total) * 100) : null);
      });

      return { labels: fechas.map(f => formatearFechaEjeCurva(f)), plan: puntosPlan, real: puntosReal };
    }

    function formatearFechaEjeCurva(iso) {
      const [a, m, d] = iso.split('-');
      return `${d}/${m}`;
    }

    function pintarCurvaAvance() {
      const canvas = document.getElementById('chart-curva-avance');
      if (!canvas || typeof Chart === 'undefined') return;
      const datos = construirCurvaAvance(buqueCurvaSeleccionado);
      const vacioEl = document.getElementById('curva-avance-vacio');

      if (chartCurvaAvance) { chartCurvaAvance.destroy(); chartCurvaAvance = null; }

      if (!datos) {
        canvas.style.display = 'none';
        if (vacioEl) vacioEl.style.display = 'block';
        return;
      }
      canvas.style.display = 'block';
      if (vacioEl) vacioEl.style.display = 'none';

      chartCurvaAvance = new Chart(canvas.getContext('2d'), {
        type: 'line',
        data: {
          labels: datos.labels,
          datasets: [
            { label: 'Plan (% previsto acumulado)', data: datos.plan, borderColor: '#6c757d', borderDash: [5, 4], pointRadius: 0, tension: 0.1 },
            { label: 'Real (% aprobado acumulado)', data: datos.real, borderColor: '#007bff', pointRadius: 0, tension: 0.1, spanGaps: false }
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          scales: { y: { min: 0, max: 100, ticks: { callback: v => v + '%' } } },
          plugins: { legend: { position: 'bottom', labels: { boxWidth: 14, font: { size: 11 } } } }
        }
      });
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        document.querySelectorAll('.overlay').forEach(ov => { if (ov.style.display === 'flex') ov.style.display = 'none'; });
      }
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    iniciar();
  </script>
</body>
</html>
