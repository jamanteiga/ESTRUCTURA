<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESTRUCTURA - Resumen</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 1050px; margin: 30px auto; padding: 0 20px; color: #333; }
    h1 { font-size: 22px; }
    h2 { font-size: 15px; margin-top: 0; }
    .card { background: #f8f9fa; border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    button { padding: 6px 12px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; }
    button.secundario { background: #6c757d; }
    button.secundario:hover { background: #5a6268; }
    .estado-msg { font-size: 13px; }

    .contadores { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    @media (max-width: 700px) { .contadores { grid-template-columns: repeat(2, 1fr); } }
    .contador.clicable { cursor: pointer; transition: transform 0.1s; }
    .contador.clicable:hover { transform: translateY(-2px); }
    .contador.activo { outline: 3px solid #333; }
    .c-total { background: #343a40; color: #fff; }
    .contador {
      flex: 1; min-width: 118px; text-align: center; padding: 12px 6px; border-radius: 8px; font-weight: bold;
      border: 1px solid rgba(0,0,0,0.1);
    }
    .contador .numero { font-size: 24px; display: block; }
    .contador .etiqueta { font-size: 11px; }
    .c-sin_asignar { background: rgb(191,191,191); color: #222; }
    .c-asignada_sin_empezar { background: #fff; color: #333; border: 1px solid #999; }
    .c-en_proceso { background: rgb(209,239,251); color: #222; }
    .c-pendiente_revision { background: rgb(255,255,0); color: #222; }
    .c-pendiente_dudas { background: rgb(0,176,240); color: #fff; }
    .c-pendiente_cambios_modelo { background: rgb(255,192,0); color: #222; }
    .c-aprobado { background: rgb(146,208,80); color: #fff; }
    .c-rechazado { background: rgb(255,0,0); color: #fff; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; font-size: 12px; }
    th, td { padding: 6px; text-align: left; border-bottom: 1px solid #ddd; }
    th { background: #1c6e8c; color: white; font-size: 11px; }
    td.num { text-align: center; }

    ul.lista-nodos { list-style: none; padding: 0; margin: 10px 0 0; }
    ul.lista-nodos li { padding: 8px; border-bottom: 1px solid #eee; font-size: 13px; display: flex; align-items: center; gap: 8px; }
    .flecha { font-size: 18px; flex-shrink: 0; width: 19px; text-align: center; }
    .f-sin_asignar { color: rgb(191,191,191); }
    .f-asignada_sin_empezar { color: #555; }
    .f-en_proceso { color: rgb(209,239,251); filter: drop-shadow(0 0 1px #7bb6c9) drop-shadow(0 0 1px #7bb6c9); }
    .f-pendiente_revision { color: rgb(255,255,0); filter: drop-shadow(0 0 1px #b3b300) drop-shadow(0 0 1px #b3b300); }
    .f-pendiente_dudas { color: rgb(0,176,240); }
    .f-pendiente_cambios_modelo { color: rgb(255,192,0); }
    .f-aprobado { color: rgb(146,208,80); }
    .f-rechazado { color: rgb(255,0,0); }
    .ruta-nodo { color: #666; font-size: 11px; }

    #menu-asignar-resumen {
      display: none; position: fixed; z-index: 4000; background: #fff; border: 1px solid #ccc;
      border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,0.25); min-width: 160px; padding: 4px 0; font-size: 13px;
    }
    #menu-asignar-resumen .mc-item { padding: 8px 14px; cursor: pointer; }
    #menu-asignar-resumen .mc-item:hover { background: #eef3ff; }
    #menu-asignar-resumen .mc-item.mc-padre::after { content: '▸'; float: right; color: #999; margin-left: 10px; }

    #submenu-estado-resumen {
      display: none; position: fixed; z-index: 4050; background: #fff; border: 1px solid #ccc;
      border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,0.25); min-width: 260px; padding: 4px 0; font-size: 13px;
    }
    #submenu-estado-resumen .mc-item { padding: 8px 14px; cursor: pointer; }
    #submenu-estado-resumen .mc-item:hover { background: #eef3ff; }

    .overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.55); align-items: center; justify-content: center; z-index: 5000;
    }
    .overlay-caja { background: white; border-radius: 8px; padding: 22px; max-width: 400px; width: 90%; }
    .overlay-caja h3 { margin-top: 0; font-size: 16px; }
    .overlay-caja label { display: block; font-weight: bold; font-size: 12px; margin: 10px 0 4px; }
    .overlay-caja select { width: 100%; padding: 7px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 13px; }
    .overlay-botones { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  </style>
</head>
<body>

  <div class="header-bar">
    <h1>📊 Resumen</h1>
    <div>
      <span id="texto-usuario" class="estado-msg"></span>
      <button class="secundario" onclick="location.href='index.html'">🏠 Inicio</button>
      <button class="secundario" onclick="location.href='arbol.html'">🌳 Árbol</button>
      <button class="secundario" id="btn-usuarios" onclick="location.href='usuarios.html'" style="display:none;">👤 Usuarios</button>
      <button class="secundario" onclick="cerrarSesion()">Cerrar sesión</button>
      <button style="background:#dc3545; color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-weight:bold; font-size:13px;" onclick="cerrarPagina()">❌ Cerrar</button>
    </div>
  </div>

  <div id="contenido">
    <p>Cargando...</p>
  </div>

  <div id="menu-asignar-resumen"></div>
  <div id="submenu-estado-resumen"></div>

  <div class="overlay" id="modal-asignar-resumen">
    <div class="overlay-caja">
      <h3>Asignar usuario / revisor</h3>
      <label>Usuario</label>
      <select id="ar-trabajador"><option value="">— Sin asignar —</option></select>
      <label>Revisor</label>
      <select id="ar-revisor"><option value="">— Sin asignar —</option></select>
      <div class="estado-msg" id="ar-estado"></div>
      <div class="overlay-botones">
        <button class="secundario" onclick="cerrarModalAsignarResumen()">Cancelar</button>
        <button onclick="guardarAsignacionResumen()">Guardar</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://wuarkraddnndmgvfnkmm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_qF-x44yXSydPBojMk_GOUg_TM34uXFI';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const TIPOS_SIN_ASIGNACION = new Set(['BUQUE']);

    const ESTADOS_ORDEN = ['sin_asignar', 'asignada_sin_empezar', 'en_proceso', 'pendiente_revision', 'pendiente_dudas', 'pendiente_cambios_modelo', 'aprobado', 'rechazado'];
    const ETIQUETAS_ESTADO = {
      sin_asignar: 'Sin asignar',
      asignada_sin_empezar: 'Pendiente de hacer',
      en_proceso: 'En proceso',
      pendiente_revision: 'Pendiente de revisión',
      pendiente_dudas: 'Pendiente de dudas',
      pendiente_cambios_modelo: 'Pendiente de cambios de modelo',
      aprobado: 'Aprobado',
      rechazado: 'Rechazado'
    };

    let miPerfil = null;
    let filtroDetalleEstado = null;
    let mapaNodoPorId = {};

    function rutaCompleta(nodo) {
      const partes = [];
      let actual = nodo;
      while (actual) {
        partes.unshift(`${actual.tipo} ${actual.codigo}`);
        actual = actual.parent_id ? mapaNodoPorId[actual.parent_id] : null;
      }
      return partes.join(' › ');
    }

    function calcularEstadoPropio(nodo) {
      if (nodo.revision_estado === 'APROBADO') return 'aprobado';
      if (nodo.revision_estado === 'RECHAZADO') return 'rechazado';
      if (nodo.revision_estado === 'PENDIENTE' || nodo.revision_estado === 'EN_REVISION') return 'pendiente_revision';
      if (nodo.trabajo_estado === 'EN_TRABAJO') return 'en_proceso';
      if (nodo.trabajo_estado === 'PENDIENTE_DUDAS') return 'pendiente_dudas';
      if (nodo.trabajo_estado === 'PENDIENTE_CAMBIOS_MODELO') return 'pendiente_cambios_modelo';
      if (nodo.trabajador_id) return 'asignada_sin_empezar';
      return 'sin_asignar';
    }

    async function cerrarSesion() {
      await supabaseClient.auth.signOut();
      window.location.href = 'login.html';
    }

    function cerrarPagina() {
      window.close();
      setTimeout(() => { history.back(); }, 150);
    }

    function esGestor() { return miPerfil.rol === 'ADMIN' || miPerfil.rol === 'REVISOR'; }

    function renderContadores(conteo, clicable, total) {
      const cajaTotal = (total === undefined) ? '' : `
        <div class="contador c-total ${clicable ? 'clicable' : ''} ${clicable && !filtroDetalleEstado ? 'activo' : ''}"
             ${clicable ? `onclick="limpiarFiltroDetalle()"` : ''}>
          <span class="numero">${total}</span>
          <span class="etiqueta">Todas</span>
        </div>
      `;
      return `
        <div class="contadores">
          ${cajaTotal}
          ${ESTADOS_ORDEN.map(e => `
            <div class="contador c-${e} ${clicable ? 'clicable' : ''} ${clicable && filtroDetalleEstado === e ? 'activo' : ''}"
                 ${clicable ? `onclick="filtrarDetallePorEstado('${e}')"` : ''}>
              <span class="numero">${conteo[e] || 0}</span>
              <span class="etiqueta">${ETIQUETAS_ESTADO[e]}</span>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderListaNodos(nodos, vacio, permitirAsignar) {
      if (nodos.length === 0) return `<li>${vacio}</li>`;
      return nodos.map(n => {
        const estado = calcularEstadoPropio(n);
        return `
          <li ${permitirAsignar ? `oncontextmenu="mostrarMenuAsignarResumen(event, '${n.id}'); return false;" style="cursor:context-menu;"` : ''}>
            <span class="flecha f-${estado}">▶</span>
            <div>
              <div><strong>${n.codigo}</strong> ${n.nombre} ${n.trabajador_nombre ? `— 👷 ${n.trabajador_nombre}` : ''}</div>
              <div class="ruta-nodo">${rutaCompleta(n)}${n.comentario_revision ? ' · ' + n.comentario_revision : ''}</div>
            </div>
          </li>
        `;
      }).join('');
    }

    function envolverListaConScroll(nodos, vacio, permitirAsignar) {
      const necesitaScroll = nodos.length > 3;
      const estilo = necesitaScroll ? 'max-height:170px; overflow-y:auto;' : '';
      return `<ul class="lista-nodos" style="${estilo}">${renderListaNodos(nodos, vacio, permitirAsignar)}</ul>`;
    }

    // -------------------- Asignar desde resumen (clic derecho) --------------------

    let perfilesCache = [];
    let nodoAsignarResumenActual = null;

    async function cargarPerfilesResumen() {
      const { data } = await supabaseClient.from('profiles').select('*').eq('activo', true);
      perfilesCache = (data || []).sort((a, b) =>
        (a.nombre_completo || '').localeCompare(b.nombre_completo || '', 'es', { sensitivity: 'base' })
      );
    }

    function mostrarMenuAsignarResumen(evento, nodeId) {
      nodoAsignarResumenActual = nodeId;
      const menu = document.getElementById('menu-asignar-resumen');
      menu.innerHTML = `
        <div class="mc-item" id="mc-asignar-item">👤 Asignar usuario / revisor</div>
        <div class="mc-item mc-padre" id="mc-estado-item">Estado tarea</div>
      `;
      document.getElementById('mc-asignar-item').addEventListener('click', (e) => {
        e.stopPropagation();
        cerrarMenuAsignarResumen();
        abrirModalAsignarResumen(nodeId);
      });
      document.getElementById('mc-estado-item').addEventListener('click', (e) => {
        e.stopPropagation();
        mostrarSubmenuEstadoResumen(document.getElementById('mc-estado-item'), nodeId);
      });
      menu.style.left = evento.clientX + 'px';
      menu.style.top = evento.clientY + 'px';
      menu.style.display = 'block';
    }
    function cerrarMenuAsignarResumen() {
      document.getElementById('menu-asignar-resumen').style.display = 'none';
      document.getElementById('submenu-estado-resumen').style.display = 'none';
    }
    document.addEventListener('click', cerrarMenuAsignarResumen);

    async function accionEstadoResumen(rpc, nodeId, params) {
      const { error } = await supabaseClient.rpc(rpc, { p_node_id: nodeId, ...(params || {}) });
      if (error) { alert('Error: ' + error.message); return; }
      await recargarDatos();
    }

    function mostrarSubmenuEstadoResumen(elementoPadre, nodeId) {
      const opciones = [
        { label: '✔ Aprobado', fn: () => accionEstadoResumen('revisar_nodo', nodeId, { p_aprobado: true }) },
        { label: '✘ Rechazado', fn: () => {
            const comentario = prompt('Motivo del rechazo (obligatorio):');
            if (!comentario || !comentario.trim()) return;
            accionEstadoResumen('revisar_nodo', nodeId, { p_aprobado: false, p_comentario: comentario });
          } },
        { label: 'Sin asignar', fn: () => { if (confirm('¿Quitar el usuario asignado?')) accionEstadoResumen('desasignar_trabajador', nodeId); } },
        { label: 'Pendiente de hacer', fn: () => { if (confirm('¿Reiniciar esta tarea?')) accionEstadoResumen('reiniciar_tarea', nodeId); } },
        { label: 'En proceso', fn: () => accionEstadoResumen('marcar_en_trabajo', nodeId) },
        { label: 'Pendiente de revisión', fn: () => accionEstadoResumen('marcar_terminado', nodeId) },
        { label: 'Pendiente de dudas', fn: () => accionEstadoResumen('marcar_pendiente_dudas', nodeId) },
        { label: 'Pendiente cambios en modelo', fn: () => accionEstadoResumen('marcar_pendiente_cambios_modelo', nodeId) }
      ];

      const sub = document.getElementById('submenu-estado-resumen');
      sub.innerHTML = opciones.map((o, i) => `<div class="mc-item" data-idx="${i}">${o.label}</div>`).join('');
      sub.querySelectorAll('.mc-item').forEach(el => {
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          cerrarMenuAsignarResumen();
          opciones[parseInt(el.dataset.idx, 10)].fn();
        });
      });

      const rect = elementoPadre.getBoundingClientRect();
      let x = rect.right + 2;
      if (x + 260 > window.innerWidth) x = rect.left - 262;
      let y = rect.top;
      if (y + 300 > window.innerHeight) y = window.innerHeight - 300;
      sub.style.left = x + 'px';
      sub.style.top = Math.max(y, 10) + 'px';
      sub.style.display = 'block';
    }

    function abrirModalAsignarResumen(nodeId) {
      const nodo = mapaNodoPorId[nodeId];
      const selTrab = document.getElementById('ar-trabajador');
      const selRev = document.getElementById('ar-revisor');

      const usuarios = perfilesCache.filter(p => p.rol === 'TRABAJADOR');
      const revisores = perfilesCache.filter(p => p.rol === 'REVISOR');

      selTrab.innerHTML = '<option value="">— Sin asignar —</option>' +
        usuarios.map(p => `<option value="${p.id}" ${p.id === nodo.trabajador_id ? 'selected' : ''}>${p.nombre_completo}</option>`).join('');
      selRev.innerHTML = '<option value="">— Sin asignar —</option>' +
        revisores.map(p => `<option value="${p.id}" ${p.id === nodo.revisor_id ? 'selected' : ''}>${p.nombre_completo}</option>`).join('');

      document.getElementById('ar-estado').textContent = '';
      document.getElementById('modal-asignar-resumen').style.display = 'flex';
    }
    function cerrarModalAsignarResumen() {
      document.getElementById('modal-asignar-resumen').style.display = 'none';
    }

    async function guardarAsignacionResumen() {
      const estadoEl = document.getElementById('ar-estado');
      const trabajadorId = document.getElementById('ar-trabajador').value || null;
      const revisorId = document.getElementById('ar-revisor').value || null;

      const { error } = await supabaseClient.rpc('asignar_trabajo', {
        p_node_id: nodoAsignarResumenActual, p_trabajador_id: trabajadorId, p_revisor_id: revisorId
      });

      if (error) { estadoEl.textContent = 'Error: ' + error.message; estadoEl.className = 'estado-msg error'; return; }

      cerrarModalAsignarResumen();
      await recargarDatos();
    }

    async function iniciar() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.href = 'login.html?next=resumen.html'; return; }

      const { data: perfil, error } = await supabaseClient
        .from('profiles').select('*').eq('id', session.user.id).single();

      if (error || !perfil || !perfil.activo) {
        document.body.innerHTML = '<p style="color:red; font-weight:bold; margin-top:60px; text-align:center;">No tienes acceso.</p>';
        return;
      }

      miPerfil = perfil;
      document.getElementById('texto-usuario').textContent =
        `${perfil.nombre_completo} (${perfil.username}) — ${perfil.rol === 'TRABAJADOR' ? 'USUARIO' : perfil.rol}`;
      if (perfil.rol === 'ADMIN') document.getElementById('btn-usuarios').style.display = 'inline-block';

      if (esGestor()) await cargarPerfilesResumen();

      await recargarDatos();
      suscribirseARealtime();
    }

    async function recargarDatos() {
      const { data: nodos, error: errorNodos } = await supabaseClient
        .from('v_nodes_with_workflow').select('*').eq('activo', true);

      if (errorNodos) {
        document.getElementById('contenido').innerHTML = `<p style="color:red;">Error: ${errorNodos.message}</p>`;
        return;
      }

      mapaNodoPorId = {};
      nodos.forEach(n => { mapaNodoPorId[n.id] = n; });

      const nodosRelevantes = nodos.filter(n => !TIPOS_SIN_ASIGNACION.has(n.tipo));

      if (esGestor()) {
        await renderVistaGestor(nodosRelevantes);
      } else {
        renderVistaUsuario(nodosRelevantes);
      }
    }

    let debounceRecargaResumen = null;
    function recargarConDebounce() {
      clearTimeout(debounceRecargaResumen);
      debounceRecargaResumen = setTimeout(() => recargarDatos(), 400);
    }

    function suscribirseARealtime() {
      supabaseClient
        .channel('resumen_node_workflow')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'node_workflow' }, () => recargarConDebounce())
        .subscribe();

      supabaseClient
        .channel('resumen_nodes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'nodes' }, () => recargarConDebounce())
        .subscribe();
    }

    let misNodosActual = [];

    function renderVistaUsuario(nodos) {
      misNodosActual = nodos.filter(n => n.trabajador_id === miPerfil.id);
      pintarVistaUsuario();
    }

    function pintarVistaUsuario() {
      const conteo = {};
      misNodosActual.forEach(n => {
        const e = calcularEstadoPropio(n);
        conteo[e] = (conteo[e] || 0) + 1;
      });

      const nodosDetalle = filtroDetalleEstado
        ? misNodosActual.filter(n => calcularEstadoPropio(n) === filtroDetalleEstado)
        : misNodosActual;

      const tituloDetalle = filtroDetalleEstado
        ? `Detalle — ${ETIQUETAS_ESTADO[filtroDetalleEstado]} <button class="secundario" style="margin-left:8px; padding:2px 10px; font-size:11px;" onclick="limpiarFiltroDetalle()">✕ Ver todas</button>`
        : 'Detalle';

      document.getElementById('contenido').innerHTML = `
        <div class="card">
          <h2>Tus tareas asignadas (${misNodosActual.length})</h2>
          <p style="font-size:11px; color:#888; margin:-4px 0 8px;">Pulsa un estado para ver solo esas tareas abajo.</p>
          ${renderContadores(conteo, true, misNodosActual.length)}
        </div>
        <div class="card">
          <h2>${tituloDetalle}</h2>
          <ul class="lista-nodos" style="max-height:340px; overflow-y:auto;">
            ${renderListaNodos(nodosDetalle, filtroDetalleEstado ? 'No hay tareas en este estado.' : 'No tienes tareas asignadas todavía.')}
          </ul>
        </div>
      `;
    }

    function filtrarDetallePorEstado(estado) {
      filtroDetalleEstado = (filtroDetalleEstado === estado) ? null : estado;
      pintarVistaUsuario();
    }

    function limpiarFiltroDetalle() {
      filtroDetalleEstado = null;
      pintarVistaUsuario();
    }

    async function renderVistaGestor(nodos) {
      const conteoGeneral = {};
      nodos.forEach(n => {
        const e = calcularEstadoPropio(n);
        conteoGeneral[e] = (conteoGeneral[e] || 0) + 1;
      });

      // Averiguar qué trabajador_id corresponden a rol TRABAJADOR (para
      // excluir a ADMIN/REVISOR del desglose por persona, aunque tengan
      // alguna tarea de prueba asignada).
      const idsConTarea = [...new Set(nodos.filter(n => n.trabajador_id).map(n => n.trabajador_id))];
      let idsUsuarios = new Set();
      if (idsConTarea.length > 0) {
        const { data: perfiles } = await supabaseClient
          .from('profiles').select('id, rol').in('id', idsConTarea);
        idsUsuarios = new Set((perfiles || []).filter(p => p.rol === 'TRABAJADOR').map(p => p.id));
      }

      const conteoPorUsuario = {};
      nodos.forEach(n => {
        if (n.trabajador_id && idsUsuarios.has(n.trabajador_id)) {
          if (!conteoPorUsuario[n.trabajador_id]) {
            conteoPorUsuario[n.trabajador_id] = { nombre: n.trabajador_nombre };
            ESTADOS_ORDEN.forEach(e => conteoPorUsuario[n.trabajador_id][e] = 0);
          }
          conteoPorUsuario[n.trabajador_id][calcularEstadoPropio(n)]++;
        }
      });

      const columnasUsuario = ESTADOS_ORDEN.filter(e => e !== 'sin_asignar');

      const filasUsuario = Object.values(conteoPorUsuario)
        .sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'))
        .map(u => `
          <tr>
            <td>${u.nombre}</td>
            ${columnasUsuario.map(e => `<td class="num">${u[e]}</td>`).join('')}
          </tr>
        `).join('');

      const rechazados = nodos.filter(n => n.revision_estado === 'RECHAZADO');
      const dudas = nodos.filter(n => n.trabajo_estado === 'PENDIENTE_DUDAS');
      const cambiosModelo = nodos.filter(n => n.trabajo_estado === 'PENDIENTE_CAMBIOS_MODELO');
      const sinAsignar = nodos.filter(n => calcularEstadoPropio(n) === 'sin_asignar');

      document.getElementById('contenido').innerHTML = `
        <div class="card">
          <h2>Estado general (${nodos.length} nodos)</h2>
          ${renderContadores(conteoGeneral)}
        </div>

        <div class="card">
          <h2>Por usuario</h2>
          <table>
            <thead>
              <tr>
                <th>Usuario</th>
                ${columnasUsuario.map(e => `<th>${ETIQUETAS_ESTADO[e]}</th>`).join('')}
              </tr>
            </thead>
            <tbody>${filasUsuario || `<tr><td colspan="${columnasUsuario.length + 1}">Nadie tiene tareas asignadas todavía.</td></tr>`}</tbody>
          </table>
        </div>

        <div class="card">
          <h2>❓ Pendientes de dudas (${dudas.length})</h2>
          ${envolverListaConScroll(dudas, 'Ninguna ahora mismo.', true)}
        </div>

        <div class="card">
          <h2>🔧 Pendientes de cambios de modelo (${cambiosModelo.length})</h2>
          ${envolverListaConScroll(cambiosModelo, 'Ninguna ahora mismo.', true)}
        </div>

        <div class="card">
          <h2>✘ Rechazados pendientes de corrección (${rechazados.length})</h2>
          ${envolverListaConScroll(rechazados, 'Ninguno ahora mismo.', true)}
        </div>

        <div class="card">
          <h2>Sin asignar (${sinAsignar.length})</h2>
          ${envolverListaConScroll(sinAsignar, 'Todo tiene usuario asignado.', true)}
        </div>
      `;
    }

    iniciar();
  </script>
</body>
</html>
