<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESTRUCTURA - Resumen</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 1000px; margin: 30px auto; padding: 0 20px; color: #333; }
    h1 { font-size: 22px; }
    h2 { font-size: 15px; margin-top: 0; }
    .card { background: #f8f9fa; border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    button { padding: 6px 12px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; }
    button.secundario { background: #6c757d; }
    button.secundario:hover { background: #5a6268; }
    .estado-msg { font-size: 13px; }

    .contadores { display: flex; gap: 12px; flex-wrap: wrap; }
    .contador {
      flex: 1; min-width: 110px; text-align: center; padding: 14px 8px; border-radius: 8px; color: white; font-weight: bold;
    }
    .contador .numero { font-size: 26px; display: block; }
    .contador .etiqueta { font-size: 12px; }
    .c-gris { background: #adb5bd; }
    .c-azul { background: #007bff; }
    .c-amarillo { background: #e0a800; }
    .c-verde { background: #28a745; }
    .c-rojo { background: #dc3545; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; }
    th, td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; font-size: 13px; }
    th { background: #1c6e8c; color: white; }
    td.num { text-align: center; }

    ul.lista-nodos { list-style: none; padding: 0; margin: 10px 0 0; }
    ul.lista-nodos li { padding: 8px; border-bottom: 1px solid #eee; font-size: 13px; display: flex; align-items: center; gap: 8px; }
    .punto { display: inline-block; width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
    .p-gris { background: #adb5bd; } .p-azul { background: #007bff; } .p-amarillo { background: #ffc107; }
    .p-verde { background: #28a745; } .p-rojo { background: #dc3545; }
    .ruta-nodo { color: #666; font-size: 11px; }
  </style>
</head>
<body>

  <div class="header-bar">
    <h1>📊 Resumen</h1>
    <div>
      <span id="texto-usuario" class="estado-msg"></span>
      <button class="secundario" onclick="location.href='index.html'">🏠 Inicio</button>
      <button class="secundario" onclick="location.href='arbol.html'">🌳 Árbol</button>
      <button class="secundario" id="btn-usuarios" onclick="location.href='usuarios.html'" style="display:none;">👤 Usuarios</button>
      <button class="secundario" onclick="cerrarSesion()">Cerrar sesión</button>
    </div>
  </div>

  <div id="contenido">
    <p>Cargando...</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://wuarkraddnndmgvfnkmm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_qF-x44yXSydPBojMk_GOUg_TM34uXFI';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const TIPOS_SIN_ASIGNACION = new Set(['BUQUE']);
    const ETIQUETAS_ESTADO = { gris: 'Sin iniciar', azul: 'En trabajo', amarillo: 'Pendiente revisión', verde: 'Aprobado', rojo: 'Rechazado' };

    let miPerfil = null;
    let mapaNodoPorId = {};

    function rutaCompleta(nodo) {
      const partes = [];
      let actual = nodo;
      while (actual) {
        partes.unshift(`${actual.tipo} ${actual.codigo}`);
        actual = actual.parent_id ? mapaNodoPorId[actual.parent_id] : null;
      }
      return partes.join(' › ');
    }

    function calcularEstadoPropio(nodo) {
      if (nodo.revision_estado === 'APROBADO') return 'verde';
      if (nodo.revision_estado === 'RECHAZADO') return 'rojo';
      if (nodo.revision_estado === 'PENDIENTE' || nodo.revision_estado === 'EN_REVISION') return 'amarillo';
      if (nodo.trabajo_estado === 'EN_TRABAJO') return 'azul';
      if (nodo.trabajo_estado === 'REQUIERE_CORRECCION') return 'amarillo';
      return 'gris';
    }

    async function cerrarSesion() {
      await supabaseClient.auth.signOut();
      window.location.href = 'login.html';
    }

    function esGestor() { return miPerfil.rol === 'ADMIN' || miPerfil.rol === 'REVISOR'; }

    function renderContadores(conteo) {
      return `
        <div class="contadores">
          <div class="contador c-gris"><span class="numero">${conteo.gris || 0}</span><span class="etiqueta">Sin iniciar</span></div>
          <div class="contador c-azul"><span class="numero">${conteo.azul || 0}</span><span class="etiqueta">En trabajo</span></div>
          <div class="contador c-amarillo"><span class="numero">${conteo.amarillo || 0}</span><span class="etiqueta">Pendiente revisión</span></div>
          <div class="contador c-verde"><span class="numero">${conteo.verde || 0}</span><span class="etiqueta">Aprobado</span></div>
          <div class="contador c-rojo"><span class="numero">${conteo.rojo || 0}</span><span class="etiqueta">Rechazado</span></div>
        </div>
      `;
    }

    async function iniciar() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.href = 'login.html?next=resumen.html'; return; }

      const { data: perfil, error } = await supabaseClient
        .from('profiles').select('*').eq('id', session.user.id).single();

      if (error || !perfil || !perfil.activo) {
        document.body.innerHTML = '<p style="color:red; font-weight:bold; margin-top:60px; text-align:center;">No tienes acceso.</p>';
        return;
      }

      miPerfil = perfil;
      document.getElementById('texto-usuario').textContent =
        `${perfil.nombre_completo} (${perfil.username}) — ${perfil.rol === 'TRABAJADOR' ? 'USUARIO' : perfil.rol}`;
      if (perfil.rol === 'ADMIN') document.getElementById('btn-usuarios').style.display = 'inline-block';

      const { data: nodos, error: errorNodos } = await supabaseClient
        .from('v_nodes_with_workflow').select('*').eq('activo', true);

      if (errorNodos) {
        document.getElementById('contenido').innerHTML = `<p style="color:red;">Error: ${errorNodos.message}</p>`;
        return;
      }

      nodos.forEach(n => { mapaNodoPorId[n.id] = n; });

      const nodosRelevantes = nodos.filter(n => !TIPOS_SIN_ASIGNACION.has(n.tipo));

      if (esGestor()) {
        renderVistaGestor(nodosRelevantes);
      } else {
        renderVistaUsuario(nodosRelevantes);
      }
    }

    function renderVistaUsuario(nodos) {
      const misNodos = nodos.filter(n => n.trabajador_id === miPerfil.id);

      const conteo = {};
      misNodos.forEach(n => {
        const e = calcularEstadoPropio(n);
        conteo[e] = (conteo[e] || 0) + 1;
      });

      const filas = misNodos.map(n => {
        const estado = calcularEstadoPropio(n);
        return `
          <li>
            <span class="punto p-${estado}" title="${ETIQUETAS_ESTADO[estado]}"></span>
            <div>
              <div><strong>${n.codigo}</strong> ${n.nombre}</div>
              <div class="ruta-nodo">${rutaCompleta(n)}</div>
            </div>
          </li>
        `;
      }).join('');

      document.getElementById('contenido').innerHTML = `
        <div class="card">
          <h2>Tus tareas asignadas (${misNodos.length})</h2>
          ${renderContadores(conteo)}
        </div>
        <div class="card">
          <h2>Detalle</h2>
          <ul class="lista-nodos">
            ${misNodos.length === 0 ? '<li>No tienes tareas asignadas todavía.</li>' : filas}
          </ul>
        </div>
      `;
    }

    function renderVistaGestor(nodos) {
      const conteoGeneral = {};
      nodos.forEach(n => {
        const e = calcularEstadoPropio(n);
        conteoGeneral[e] = (conteoGeneral[e] || 0) + 1;
      });

      const conteoPorUsuario = {};
      nodos.forEach(n => {
        if (n.trabajador_id) {
          if (!conteoPorUsuario[n.trabajador_id]) conteoPorUsuario[n.trabajador_id] = { nombre: n.trabajador_nombre, gris: 0, azul: 0, amarillo: 0, verde: 0, rojo: 0 };
          conteoPorUsuario[n.trabajador_id][calcularEstadoPropio(n)]++;
        }
      });

      const filasUsuario = Object.values(conteoPorUsuario).sort((a, b) => a.nombre.localeCompare(b.nombre, 'es')).map(u => `
        <tr>
          <td>${u.nombre}</td>
          <td class="num">${u.gris}</td>
          <td class="num">${u.azul}</td>
          <td class="num">${u.amarillo}</td>
          <td class="num">${u.verde}</td>
          <td class="num">${u.rojo}</td>
        </tr>
      `).join('');

      const rechazados = nodos.filter(n => n.revision_estado === 'RECHAZADO');
      const filasRechazados = rechazados.map(n => `
        <li>
          <span class="punto p-rojo"></span>
          <div>
            <div><strong>${n.codigo}</strong> ${n.nombre} — 👷 ${n.trabajador_nombre || '(sin asignar)'}</div>
            <div class="ruta-nodo">${rutaCompleta(n)}${n.comentario_revision ? ' · ' + n.comentario_revision : ''}</div>
          </div>
        </li>
      `).join('');

      document.getElementById('contenido').innerHTML = `
        <div class="card">
          <h2>Estado general (${nodos.length} nodos con asignación posible)</h2>
          ${renderContadores(conteoGeneral)}
        </div>
        <div class="card">
          <h2>Por usuario</h2>
          <table>
            <thead>
              <tr><th>Usuario</th><th class="num">Sin iniciar</th><th class="num">En trabajo</th><th class="num">Pend. revisión</th><th class="num">Aprobado</th><th class="num">Rechazado</th></tr>
            </thead>
            <tbody>${filasUsuario || '<tr><td colspan="6">Nadie tiene tareas asignadas todavía.</td></tr>'}</tbody>
          </table>
        </div>
        <div class="card">
          <h2>Rechazados pendientes de corrección (${rechazados.length})</h2>
          <ul class="lista-nodos">${rechazados.length === 0 ? '<li>Ninguno ahora mismo.</li>' : filasRechazados}</ul>
        </div>
      `;
    }

    iniciar();
  </script>
</body>
</html>
