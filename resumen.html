<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESTRUCTURA - Resumen</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#007bff">
  <style>
    body { font-family: Arial, sans-serif; max-width: 1050px; margin: 30px auto; padding: 0 20px; color: #333; }
    h1 { font-size: 22px; }
    h2 { font-size: 15px; margin-top: 0; }
    .card { background: #f8f9fa; border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    body.vista-movil .solo-escritorio { display: none !important; }
    body.tema-oscuro { background: #1a1d21; color: #e0e0e0; }
    body.tema-oscuro .card { background: #24282e; border-color: #3a3f47; }
    body.tema-oscuro h1, body.tema-oscuro h2 { color: #f0f0f0; }
    body.tema-oscuro table { color: #e0e0e0; }
    body.tema-oscuro th { background: #14395c; }
    body.tema-oscuro td { border-color: #3a3f47; }
    body.tema-oscuro .ruta-nodo { color: #a0a0a0; }
    body.tema-oscuro .overlay-caja { background: #24282e; color: #e0e0e0; }
    body.tema-oscuro select, body.tema-oscuro input { background: #1a1d21; color: #e0e0e0; border-color: #4a4f57; }
    body.tema-oscuro a { color: #6cb2eb; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    button { padding: 6px 12px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; }
    button.secundario { background: #6c757d; }
    button.secundario:hover { background: #5a6268; }
    .estado-msg { font-size: 13px; }

    .contadores { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    @media (max-width: 700px) { .contadores { grid-template-columns: repeat(2, 1fr); } }
    .contador.clicable { cursor: pointer; transition: transform 0.1s; }
    .contador.clicable:hover { transform: translateY(-2px); }
    .contador.activo { outline: 3px solid #333; }
    .c-total { background: #343a40; color: #fff; }
    .contador {
      flex: 1; min-width: 98px; text-align: center; padding: 9px 5px; border-radius: 8px; font-weight: bold;
      border: 1px solid rgba(0,0,0,0.1);
    }
    .contador .numero { font-size: 19px; display: block; }
    .contador .etiqueta { font-size: 10px; }
    .c-sin_asignar { background: rgb(191,191,191); color: #222; }
    .c-asignada_sin_empezar { background: #fff; color: #333; border: 1px solid #999; }
    .c-en_proceso { background: rgb(255,255,0); color: #222; }
    .c-pendiente_revision { background: rgb(209,239,251); color: #222; }
    .c-pendiente_dudas { background: rgb(0,176,240); color: #fff; }
    .c-pendiente_cambios_modelo { background: rgb(255,192,0); color: #222; }
    .c-aprobado { background: rgb(146,208,80); color: #fff; }
    .c-rechazado { background: rgb(255,0,0); color: #fff; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; font-size: 12px; }
    th, td { padding: 6px; text-align: left; border-bottom: 1px solid #ddd; }
    th { background: #1c6e8c; color: white; font-size: 11px; }
    td.num { text-align: center; }

    ul.lista-nodos { list-style: none; padding: 0; margin: 10px 0 0; }
    ul.lista-nodos li { padding: 8px; border-bottom: 1px solid #eee; font-size: 13px; display: flex; align-items: center; gap: 8px; }
    .flecha { font-size: 18px; flex-shrink: 0; width: 19px; text-align: center; }
    .f-sin_asignar { color: rgb(191,191,191); }
    .f-asignada_sin_empezar { color: #fff; -webkit-text-stroke: 1.5px #000; filter: drop-shadow(0 0 1px #000) drop-shadow(0 0 1px #000); }
    .f-en_proceso { color: rgb(255,255,0); filter: drop-shadow(0 0 1px #b3b300) drop-shadow(0 0 1px #b3b300); }
    .f-pendiente_revision { color: rgb(209,239,251); filter: drop-shadow(0 0 1px #7bb6c9) drop-shadow(0 0 1px #7bb6c9); }
    .f-pendiente_dudas { color: rgb(0,176,240); }
    .f-pendiente_cambios_modelo { color: rgb(255,192,0); }
    .f-aprobado { color: rgb(146,208,80); font-size: 22px; width: 22px; }
    .f-rechazado { color: rgb(255,0,0); font-size: 22px; width: 22px; }
    .ruta-nodo { color: #666; font-size: 11px; }

    #menu-asignar-resumen {
      display: none; position: fixed; z-index: 4000; background: #fff; border: 1px solid #ccc;
      border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,0.25); min-width: 160px; padding: 4px 0; font-size: 13px;
    }
    #menu-asignar-resumen .mc-item { padding: 8px 14px; cursor: pointer; }
    #menu-asignar-resumen .mc-item:hover { background: #eef3ff; }
    #menu-asignar-resumen .mc-item.mc-padre::after { content: '▸'; float: right; color: #999; margin-left: 10px; }

    #submenu-estado-resumen {
      display: none; position: fixed; z-index: 4050; background: #fff; border: 1px solid #ccc;
      border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,0.25); min-width: 260px; padding: 4px 0; font-size: 13px;
    }
    #submenu-estado-resumen .mc-item { padding: 8px 14px; cursor: pointer; }
    #submenu-estado-resumen .mc-item:hover { background: #eef3ff; }

    .overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.55); align-items: center; justify-content: center; z-index: 5000;
    }
    .overlay-caja { background: white; border-radius: 8px; padding: 22px; max-width: 400px; width: 90%; }
    .overlay-caja h3 { margin-top: 0; font-size: 16px; }
    .overlay-caja label { display: block; font-weight: bold; font-size: 12px; margin: 10px 0 4px; }
    .overlay-caja select { width: 100%; padding: 7px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
    .overlay-botones { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
      @media (max-width: 480px) {
      body { margin: 10px auto; padding: 0 8px; box-sizing: border-box; }
      h1 { font-size: 18px; }
    }
</style>
</head>
<body>

  <div class="header-bar">

    <div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script>
    const SUPABASE_URL = 'https://wuarkraddnndmgvfnkmm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_qF-x44yXSydPBojMk_GOUg_TM34uXFI';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // -------------------- Registro de comunicaciones (log_comunicaciones.html) --------------------
    // Envuelve fetch para dejar constancia de cada llamada de red que hace
    // esta página (casi siempre a Supabase): a dónde, cuánto tarda y qué
    // datos le pasa. Aparte del registro de actividad (audit_log), que es
    // de acciones del usuario, no de tráfico de red.
    function redactarCuerpoComunicacion(cuerpoTexto) {
      if (!cuerpoTexto) return null;
      try {
        const limpiar = (o) => {
          if (Array.isArray(o)) return o.map(limpiar);
          if (o && typeof o === 'object') {
            const copia = {};
            Object.keys(o).forEach(k => { copia[k] = /password|contrase/i.test(k) ? '***' : limpiar(o[k]); });
            return copia;
          }
          return o;
        };
        return JSON.stringify(limpiar(JSON.parse(cuerpoTexto))).slice(0, 4000);
      } catch (e) {
        return String(cuerpoTexto).slice(0, 4000);
      }
    }
    (function () {
      const _fetchOriginal = window.fetch.bind(window);
      window.fetch = async function (input, init) {
        const inicio = performance.now();
        const url = typeof input === 'string' ? input : (input && input.url) || '';
        const metodo = (init && init.method) || (typeof input === 'object' && input && input.method) || 'GET';
        if (url.indexOf('/comunicaciones_log') !== -1) return _fetchOriginal(input, init);
        let respuesta, errorMsg = null;
        try {
          respuesta = await _fetchOriginal(input, init);
          return respuesta;
        } catch (e) {
          errorMsg = e.message;
          throw e;
        } finally {
          const duracionMs = Math.round(performance.now() - inicio);
          const cuerpo = init && init.body && typeof init.body === 'string' ? redactarCuerpoComunicacion(init.body) : null;
          supabaseClient.from('comunicaciones_log').insert({
            metodo, url, cuerpo, duracion_ms: duracionMs,
            status_code: respuesta ? respuesta.status : null, error: errorMsg
          }).then(() => {}, () => {});
        }
      };
    })();

    // -------------------- Modo mantenimiento --------------------
    // Si está activo y quien entra no es ADMIN, lo manda a mantenimiento.html
    // en vez de dejarle seguir. Se llama justo después de conocer el rol.
    async function comprobarMantenimiento(rol) {
      if (rol === 'ADMIN') return false;
      try {
        const { data } = await supabaseClient.from('app_mantenimiento').select('activo').eq('id', 1).single();
        if (data && data.activo) { window.location.href = 'mantenimiento.html'; return true; }
      } catch (e) { /* si falla la comprobación, no se bloquea la app por eso */ }
      return false;
    }


    // Detección de móvil/tablet: iPadOS manda user-agent de escritorio
    // ("Macintosh") desde iOS 13, así que se completa con pantalla táctil
    // real (navigator.maxTouchPoints, 0 en un Mac/PC sin pantalla táctil).
    const esTactil = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
    const esMovil = esTactil || window.innerWidth < 768;
    document.body.classList.toggle('vista-movil', esMovil);

    const TIPOS_SIN_ASIGNACION = new Set(['BUQUE']);

    const ETIQUETAS_TIPO = {
      BUQUE: 'Buque',
      BLOQUE: 'Bloque',
      SB: 'Subbloque',
      SBE: 'Unión de subbloques',
      SBL: 'Unión en grada',
      CS: 'Conjunto simple',
      UA: 'Unidad abierta',
      GR: 'Grupo',
      UL: 'Unidad longitudinal',
      NL: 'Panel',
      UP: 'Unidad plana fabricada',
      NP: 'Panel plano',
      PS: 'Previa simple',
      PT: 'Previa en T',
      PE: 'Pieza especial',
      PM: 'Piezas menores',
      UC: 'Unidad fabricada de forro',
      NC: 'Panel curvo de forro',
      PI: 'Producto intermedio',
      ANIDADOS: 'Anidados',
      PDB: 'Plano de bloque',
      PANELES: 'Paneles',
      PL: 'Plancha',
      PERF: 'Perfil',
      PLANCHA_1000: 'Plancha 1000',
      PLANCHA_2000: 'Plancha 2000',
      PLANCHA_3000: 'Plancha 3000',
      PERFIL_4000: 'Perfil 4000',
      PERFIL_6000: 'Perfil 6000',
      PERFIL_7000: 'Perfil 7000'
    };

    const ESTADOS_ORDEN = ['sin_asignar', 'asignada_sin_empezar', 'en_proceso', 'pendiente_revision', 'pendiente_dudas', 'pendiente_cambios_modelo', 'aprobado', 'rechazado'];
    const ETIQUETAS_ESTADO = {
      sin_asignar: 'Sin asignar',
      asignada_sin_empezar: 'Pendiente de hacer',
      en_proceso: 'En proceso',
      pendiente_revision: 'Pendiente de revisión',
      pendiente_dudas: 'Pendiente de dudas',
      pendiente_cambios_modelo: 'Pendiente de cambios de modelo',
      aprobado: 'Aprobado',
      rechazado: 'Rechazado'
    };

    // -------------------- Navegación entre paneles de gestión --------------------
    // Misma lista y misma función en todas las páginas de gestión
    // (resumen.html, kpi.html, avances.html, revision.html, previsioncarga.html,
    // cargatrabajo.html, pendientedudas.html, cambiosmodelo.html, rechazados.html,
    // sinasignar.html) para poder saltar de una a otra sin pasar por el árbol.
    const PANELES_GESTION = [
      { href: 'resumen.html', label: '📊 Resumen' },
      { href: 'kpi.html', label: '📈 KPIs' },
      { href: 'avances.html', label: '📉 Avances' },
      { href: 'revision.html', label: '⏳ Cola de revisión' },
      { href: 'previsioncarga.html', label: '📅 Previsión de carga' },
      { href: 'cargatrabajo.html', label: '👷 Carga de trabajo' },
      { href: 'pendientedudas.html', label: '❓ Pendiente de dudas' },
      { href: 'cambiosmodelo.html', label: '🔧 Cambios de modelo' },
      { href: 'rechazados.html', label: '✘ Rechazados' },
      { href: 'sinasignar.html', label: '🚫 Sin asignar' }
    ];
    function renderBarraPaneles(paginaActual) {
      const enlaces = PANELES_GESTION.filter(p => p.href !== paginaActual)
        .map(p => `<a href="${p.href}">${p.label}</a>`).join(' &nbsp;·&nbsp; ');
      return `
        <p style="font-size:12px; color:#888; margin:0 0 4px;">Paneles de gestión:</p>
        <p style="font-size:12px; margin:0; line-height:1.8;">${enlaces}</p>
      `;
    }

    let miPerfil = null;
    let filtroDetalleEstado = null;

    // Filtro de usuario de la tabla "Tareas por tipo" (Todos / individual).
    let filtroTipoUsuarioId = null;

    // Usuarios (trabajadores) que tienen alguna tarea asignada, para rellenar
    // el selector "Usuario: Todos / <nombre>" de Tareas por tipo.
    function usuariosConTareasAsignadas(nodos) {
      const ids = [...new Set(nodos.filter(n => n.trabajador_id && idsUsuariosGestor.has(n.trabajador_id)).map(n => n.trabajador_id))];
      return ids
        .map(id => ({ id, nombre: nodos.find(n => n.trabajador_id === id)?.trabajador_nombre || '—' }))
        .sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
    }

    function calcularTareasPorTipo(nodos, usuarioId) {
      const base = usuarioId ? nodos.filter(n => n.trabajador_id === usuarioId) : nodos;
      const conteo = {};
      base.forEach(n => {
        if (!conteo[n.tipo]) {
          conteo[n.tipo] = { total: 0 };
          ESTADOS_ORDEN.forEach(e => conteo[n.tipo][e] = 0);
        }
        conteo[n.tipo][calcularEstadoPropio(n)]++;
        conteo[n.tipo].total++;
      });
      return conteo;
    }

    function renderTareasPorTipoCard() {
      const nodos = nodosGestorActual;
      const usuarios = usuariosConTareasAsignadas(nodos);
      const conteo = calcularTareasPorTipo(nodos, filtroTipoUsuarioId);
      const tipos = Object.keys(conteo).sort((a, b) => (ETIQUETAS_TIPO[a] || a).localeCompare(ETIQUETAS_TIPO[b] || b, 'es'));
      if (tipos.length === 0) return '';
      return `
        <div class="card solo-escritorio">
          <h2>🔧 Tareas por tipo</h2>
          <p style="font-size:11px; color:#888; margin:-4px 0 8px;">Cuántas tareas hay en cada estado, por tipo de nodo.</p>
          <label style="display:inline-block; font-size:12px; font-weight:bold; margin-bottom:8px;">Usuario:
            <select onchange="filtroTipoUsuarioId = this.value || null; pintarVistaGestor();" style="padding:4px; border-radius:4px; border:1px solid #ccc; margin-left:6px;">
              <option value="" ${!filtroTipoUsuarioId ? 'selected' : ''}>Todos</option>
              ${usuarios.map(u => `<option value="${u.id}" ${u.id === filtroTipoUsuarioId ? 'selected' : ''}>${u.nombre}</option>`).join('')}
            </select>
          </label>
          <table>
            <thead>
              <tr><th>Tipo</th>${ESTADOS_ORDEN.map(e => `<th>${ETIQUETAS_ESTADO[e]}</th>`).join('')}<th>Total</th></tr>
            </thead>
            <tbody>
              ${tipos.map(t => `
                <tr>
                  <td>${ETIQUETAS_TIPO[t] || t}</td>
                  ${ESTADOS_ORDEN.map(e => `<td class="num">${conteo[t][e]}</td>`).join('')}
                  <td class="num" style="font-weight:bold;">${conteo[t].total}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }
    let mapaNodoPorId = {};
    let dependenciasCache = [];
    let historialMotivosCache = [];

    function rutaCompleta(nodo) {
      const partes = [];
      let actual = nodo;
      while (actual) {
        partes.unshift(actual.codigo);
        actual = actual.parent_id ? mapaNodoPorId[actual.parent_id] : null;
      }
      return partes.join('>');
    }

    function calcularEstadoPropio(nodo) {
      if (nodo.revision_estado === 'APROBADO') return 'aprobado';
      if (nodo.revision_estado === 'RECHAZADO') return 'rechazado';
      if (nodo.revision_estado === 'PENDIENTE' || nodo.revision_estado === 'EN_REVISION') return 'pendiente_revision';
      if (nodo.trabajo_estado === 'EN_TRABAJO') return 'en_proceso';
      if (nodo.trabajo_estado === 'PENDIENTE_DUDAS') return 'pendiente_dudas';
      if (nodo.trabajo_estado === 'PENDIENTE_CAMBIOS_MODELO') return 'pendiente_cambios_modelo';
      if (nodo.trabajador_id) return 'asignada_sin_empezar';
      return 'sin_asignar';
    }

    async function registrarLog(accion, descripcion) {
      try {
        await supabaseClient.from('audit_log').insert({ accion, descripcion, user_agent: navigator.userAgent });
      } catch (e) {
        console.warn('No se pudo registrar el log:', e);
      }
    }

    async function cerrarSesion() {
      await registrarLog('LOGOUT', `Cerró sesión (${miPerfil?.username || ''})`);
      await supabaseClient.auth.signOut();
      window.location.href = 'login.html';
    }

    function cerrarPagina() {
      // Vamos siempre directos al árbol. (Antes se intentaba window.close()

      window.location.href = 'arbol.html';

    function renderContadores(conteo, clicable, total) {

        <div class="contador c-total ${clicable ? 'clicable' : ''} ${clicable && !filtroDetalleEstado ? 'activo' : ''}"
             ${clicable ? `onclick="limpiarFiltroDetalle()"` : ''}>

                 ${clicable ? `onclick="filtrarDetallePorEstado('${e}')"` : ''}>

    function renderListaNodos(nodos, vacio, permitirAsignar) {

        return `
          <li ${permitirAsignar ? `oncontextmenu="mostrarMenuAsignarResumen(event, '${n.id}'); return false;" style="cursor:context-menu;"` : ''}>
            <span class="flecha f-${estado}">${estado === 'aprobado' ? '✔' : (estado === 'rechazado' ? '✘' : '▶')}</span>

              <div><strong>${n.codigo}</strong> ${n.nombre} ${n.trabajador_nombre ? `— 👷 ${n.trabajador_nombre}` : ''}</div>

    function traducirError(mensaje) {
      if (!mensaje) return 'Ha ocurrido un error inesperado.';
      const m = mensaje.toLowerCase();
      if (m.includes('duplicate key')) return 'Ya existe un registro con ese mismo dato — no se puede repetir.';
      if (m.includes('violates foreign key constraint')) return 'No se puede completar: hace referencia a algo que ya no existe.';
      if (m.includes('new row violates row-level security') || m.includes('permission denied')) return 'No tienes permiso para hacer esto.';
      if (m.includes('failed to fetch') || m.includes('networkerror')) return 'No se pudo conectar — comprueba tu conexión a internet.';
      if (m.includes('jwt') || m.includes('token') || m.includes('session')) return 'Tu sesión ha caducado — vuelve a iniciar sesión.';
      return mensaje;
    }

      const sub = document.getElementById('submenu-estado-resumen');
      sub.innerHTML = opciones.map((o, i) => `<div class="mc-item" data-idx="${i}">${o.label}</div>`).join('');
      sub.querySelectorAll('.mc-item').forEach(el => {
        el.addEventListener('click', (e) => {
          e.stopPropagation();

          opciones[parseInt(el.dataset.idx, 10)].fn();

    // Nº de tareas abiertas (sin aprobar) que tiene ahora mismo cada usuario —
    // para sugerir, al asignar, a quién le viene mejor una tarea nueva.
    function calcularCargaAbiertaPorUsuario() {
      const carga = {};
      nodosGestorActual.forEach(n => {
        if (!n.trabajador_id || calcularEstadoPropio(n) === 'aprobado') return;
        carga[n.trabajador_id] = (carga[n.trabajador_id] || 0) + 1;
      });
      return carga;
    }

    function opcionesTrabajadorConCarga(usuarios, actualId) {
      const carga = calcularCargaAbiertaPorUsuario();
      const minCarga = usuarios.length ? Math.min(...usuarios.map(p => carga[p.id] || 0)) : null;
      return usuarios.map(p => {
        const n = carga[p.id] || 0;
        return `<option value="${p.id}" ${p.id === actualId ? 'selected' : ''}>${p.nombre_completo} — ${n} abierta(s)${n === minCarga ? ' 📉 menos carga' : ''}</option>`;
      }).join('');
    }

    // Qué RPC llamar para dejar la tarea en el estado elegido en el propio
    // modal de asignación, sin tener que abrir aparte el submenú "Estado
    // tarea" justo después de asignar usuario/supervisor.
    const RPC_POR_ESTADO_TAREA = {
      en_proceso: 'marcar_en_trabajo',
      pendiente_revision: 'marcar_terminado',
      pendiente_dudas: 'marcar_pendiente_dudas',

        const { error: errorEstado } = await supabaseClient.rpc(RPC_POR_ESTADO_TAREA[estadoTarea], { p_node_id: nodoAsignarResumenActual });
        if (errorEstado) { estadoEl.textContent = 'Asignado, pero no se pudo cambiar el estado: ' + traducirError(errorEstado.message); estadoEl.className = 'estado-msg error'; await recargarDatos(); return; }

    // Supabase/PostgREST corta cada consulta a 1000 filas por defecto salvo
    // que se pida por páginas -- con más de 1000 nodos activos en total,
    // esta consulta sin paginar podía dejarse fuera, al azar, buena parte
    // del árbol (mismo fallo ya corregido en arbol.html y gantt.html).
    async function paginarSelect(factoriaQuery, tamPagina = 1000) {
      let desde = 0;
      let todos = [];
      while (true) {
        const { data, error } = await factoriaQuery().range(desde, desde + tamPagina - 1);
        if (error) return { data: null, error };
        todos = todos.concat(data || []);
        if (!data || data.length < tamPagina) break;
        desde += tamPagina;
      }
      return { data: todos, error: null };
    }

    async function recargarDatos() {
      const [{ data: nodos, error: errorNodos }, { data: dependencias }, { data: historialMotivos }] = await Promise.all([
        paginarSelect(() => supabaseClient.from('v_nodes_with_workflow').select('*').eq('activo', true).order('id', { ascending: true })),
        supabaseClient.from('node_dependencias').select('*'),
        supabaseClient.from('historial_fechas_previstas').select('node_id, motivo_categoria, cambiado_en').not('motivo_categoria', 'is', null)
      ]);

      if (errorNodos) {
        document.getElementById('contenido').innerHTML = `<p style="color:red;">Error: ${errorNodos.message}</p>`;
        return;
      }

      mapaNodoPorId = {};
      nodos.forEach(n => { mapaNodoPorId[n.id] = n; });
      dependenciasCache = dependencias || [];
      historialMotivosCache = historialMotivos || [];

      const nodosRelevantes = nodos.filter(n => !TIPOS_SIN_ASIGNACION.has(n.tipo));

      if (pareceGestor()) {
        await renderVistaGestor(nodosRelevantes);
      } else {
        renderVistaUsuario(nodosRelevantes);
      }
    }

    let debounceRecargaResumen = null;
    function recargarConDebounce() {
      clearTimeout(debounceRecargaResumen);
      debounceRecargaResumen = setTimeout(() => recargarDatos(), 400);
    }

    function suscribirseARealtime() {
      supabaseClient
        .channel('resumen_node_workflow')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'node_workflow' }, () => recargarConDebounce())
        .subscribe();

      supabaseClient
        .channel('resumen_nodes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'nodes' }, () => recargarConDebounce())
        .subscribe();
    }

    let misNodosActual = [];
    let nodosGestorActual = [];
    let idsUsuariosGestor = new Set();

    function renderVistaUsuario(nodos) {
      misNodosActual = nodos.filter(n => n.trabajador_id === miPerfil.id);
      pintarVistaUsuario();
    }

    function calcularJornadaHoy(nodos) {
      const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
      let minutosHoy = 0;
      const tareasHoy = new Set();

      nodos.forEach(n => {
        if (n.trabajo_iniciado_en) {
          const inicio = new Date(n.trabajo_iniciado_en);
          const fin = n.trabajo_terminado_en ? new Date(n.trabajo_terminado_en) : new Date();
          const inicioEfectivo = inicio > hoy ? inicio : hoy;
          if (fin > inicioEfectivo) {
            minutosHoy += Math.floor((fin - inicioEfectivo) / 60000);
            tareasHoy.add(n.id);
          }
        }
        if (n.trabajo_terminado_en && new Date(n.trabajo_terminado_en) >= hoy) tareasHoy.add(n.id);
        if (n.revisado_en && new Date(n.revisado_en) >= hoy) tareasHoy.add(n.id);
      });

      const horas = Math.floor(minutosHoy / 60);
      const mins = minutosHoy % 60;
      return { texto: `${horas}h ${String(mins).padStart(2, '0')}min`, tareas: tareasHoy.size };
    }

    // "De hoy" = ya en marcha (En proceso, dudas, cambios de modelo), o
    // planificada para caer hoy según su fecha prevista, o ya debería
    // estar terminada (fecha fin prevista ya pasada) y sigue sin aprobar.
    function calcularPendientesHoy(nodos) {
      const hoyIso = new Date().toISOString().slice(0, 10);
      return nodos.filter(n => {
        const estado = calcularEstadoPropio(n);
        if (estado === 'aprobado' || estado === 'sin_asignar') return false;
        if (estado === 'en_proceso' || estado === 'pendiente_dudas' || estado === 'pendiente_cambios_modelo') return true;
        if (n.fecha_inicio_prevista && n.fecha_fin_prevista) return n.fecha_inicio_prevista.slice(0, 10) <= hoyIso && hoyIso <= n.fecha_fin_prevista.slice(0, 10);
        if (n.fecha_fin_prevista) return n.fecha_fin_prevista.slice(0, 10) <= hoyIso;
        return false;
      });
    }

    function pintarVistaUsuario() {
      const conteo = {};
      misNodosActual.forEach(n => {
        const e = calcularEstadoPropio(n);
        conteo[e] = (conteo[e] || 0) + 1;
      });

      const jornada = calcularJornadaHoy(misNodosActual);
      const pendientesHoy = calcularPendientesHoy(misNodosActual);

      const nodosDetalle = filtroDetalleEstado
        ? misNodosActual.filter(n => calcularEstadoPropio(n) === filtroDetalleEstado)
        : misNodosActual;

      const tituloDetalle = filtroDetalleEstado
        ? `Detalle — ${ETIQUETAS_ESTADO[filtroDetalleEstado]} <button class="secundario" style="margin-left:8px; padding:2px 10px; font-size:11px;" onclick="limpiarFiltroDetalle()">✕ Ver todas</button>`
        : 'Detalle';

      document.getElementById('contenido').innerHTML = `
        <div class="card">
          <h2>☀️ Tu jornada de hoy</h2>
          <p style="font-size:13px;">Tiempo trabajado hoy: <strong>${jornada.texto}</strong> · Tareas con movimiento hoy: <strong>${jornada.tareas}</strong></p>
        </div>
        <div class="card">
          <h2>📆 Mis pendientes de hoy (${pendientesHoy.length})</h2>
          <p style="font-size:11px; color:#888; margin:-4px 0 8px;">Lo que ya tienes en marcha, lo planificado para hoy, o lo que ya debería estar terminado.</p>
          <ul class="lista-nodos" style="max-height:260px; overflow-y:auto;">
            ${renderListaNodos(pendientesHoy, 'Nada urgente para hoy.')}
          </ul>
        </div>
        <div class="card">
          <h2>Tus tareas asignadas (${misNodosActual.length})</h2>
          <p style="font-size:11px; color:#888; margin:-4px 0 8px;">Pulsa un estado para ver solo esas tareas abajo.</p>
          ${renderContadores(conteo, true, misNodosActual.length)}
        </div>
        <div class="card">
          <h2>${tituloDetalle}</h2>
          <ul class="lista-nodos" style="max-height:340px; overflow-y:auto;">
            ${renderListaNodos(nodosDetalle, filtroDetalleEstado ? 'No hay tareas en este estado.' : 'No tienes tareas asignadas todavía.')}
          </ul>
        </div>
      `;
    }

    function filtrarDetallePorEstado(estado) {
      filtroDetalleEstado = (filtroDetalleEstado === estado) ? null : estado;
      if (pareceGestor()) pintarVistaGestor(); else pintarVistaUsuario();
    }

    function limpiarFiltroDetalle() {
      filtroDetalleEstado = null;
      if (pareceGestor()) pintarVistaGestor(); else pintarVistaUsuario();
    }

    function buqueDeNodo(nodo) {
      let actual = nodo;
      while (actual) {
        if (actual.tipo === 'BUQUE') return actual;
        actual = actual.parent_id ? mapaNodoPorId[actual.parent_id] : null;
      }
      return null;
    }

    // Ruta crítica (CPM) + holgura, igual que en gantt.html, pero calculada
    // aquí sobre un subconjunto de nodos (los de un buque concreto) para el
    // panel de riesgos, que junta el resultado de todos los buques.
    function calcularRutaCriticaParaNodos(idsBuque) {
      const rango = {};
      idsBuque.forEach(id => {
        const n = mapaNodoPorId[id];
        if (n && n.fecha_inicio_prevista && n.fecha_fin_prevista) {
          rango[id] = { inicio: new Date(n.fecha_inicio_prevista), fin: new Date(n.fecha_fin_prevista) };
        }
      });
      const ids = Object.keys(rango);
      if (ids.length === 0) return { criticos: new Set(), holguras: new Map() };

      const sucesoresDe = {}, predecesoresDe = {};
      ids.forEach(id => { sucesoresDe[id] = []; predecesoresDe[id] = []; });
      dependenciasCache.forEach(d => {
        if (rango[d.predecesor_id] && rango[d.sucesor_id]) {
          sucesoresDe[d.predecesor_id].push(d.sucesor_id);
          predecesoresDe[d.sucesor_id].push(d.predecesor_id);
        }
      });

      const duracionMs = id => rango[id].fin - rango[id].inicio;
      const EF = {};
      function calcularEF(id, pila) {
        if (EF[id] !== undefined) return EF[id];
        if (pila.has(id)) return EF[id] = rango[id].fin;
        pila.add(id);
        let inicioReal = rango[id].inicio;
        predecesoresDe[id].forEach(pid => {
          const ef = calcularEF(pid, pila);
          if (ef > inicioReal) inicioReal = ef;
        });
        return EF[id] = new Date(inicioReal.getTime() + duracionMs(id));
      }
      ids.forEach(id => calcularEF(id, new Set()));

      const finProyecto = new Date(Math.max(...ids.map(id => EF[id].getTime())));
      const LS = {};
      function calcularLS(id, pila) {
        if (LS[id] !== undefined) return LS[id];
        if (pila.has(id)) return LS[id] = finProyecto;
        pila.add(id);
        const sucs = sucesoresDe[id];
        const finTardio = sucs.length === 0 ? finProyecto : new Date(Math.min(...sucs.map(sid => calcularLS(sid, pila).getTime())));
        return LS[id] = new Date(finTardio.getTime() - duracionMs(id));
      }
      ids.forEach(id => calcularLS(id, new Set()));

      const ES = {};
      ids.forEach(id => { ES[id] = new Date(EF[id].getTime() - duracionMs(id)); });

      const criticos = new Set();
      const holguras = new Map();
      const UNA_HORA_MS = 3600000;
      const UN_DIA_MS = 86400000;
      ids.forEach(id => {
        const holguraMs = LS[id].getTime() - ES[id].getTime();
        holguras.set(id, Math.round(holguraMs / UN_DIA_MS));
        if (Math.abs(holguraMs) < UNA_HORA_MS) criticos.add(id);
      });
      return { criticos, holguras };
    }

    const UMBRAL_HOLGURA_RIESGO_DIAS = 2;

    // Junta, de todos los buques, las tareas críticas retrasadas (alto),
    // críticas o retrasadas sin más (medio), y las que tienen poca holgura
    // (bajo) — para que el gestor vea de un vistazo dónde hay más peligro
    // de que se retrase la entrega.
    function calcularPanelRiesgos(nodos) {
      const buques = Object.values(mapaNodoPorId).filter(n => n.tipo === 'BUQUE');
      const hoyIso = new Date().toISOString().slice(0, 10);
      const riesgos = [];

      buques.forEach(buque => {
        const idsBuque = nodos.filter(n => { const b = buqueDeNodo(n); return b && b.id === buque.id; }).map(n => n.id);
        const { criticos, holguras } = calcularRutaCriticaParaNodos(idsBuque);
        idsBuque.forEach(id => {
          const n = mapaNodoPorId[id];
          if (calcularEstadoPropio(n) === 'aprobado') return;
          const esCritica = criticos.has(id);
          const holgura = holguras.has(id) ? holguras.get(id) : null;
          const retrasada = !!(n.fecha_fin_prevista && n.fecha_fin_prevista.slice(0, 10) < hoyIso);

          let severidad = null;
          if (esCritica && retrasada) severidad = 'ALTO';
          else if (esCritica || retrasada) severidad = 'MEDIO';
          else if (holgura !== null && holgura <= UMBRAL_HOLGURA_RIESGO_DIAS) severidad = 'BAJO';
          if (severidad) riesgos.push({ nodo: n, buque, esCritica, retrasada, holgura, severidad });
        });
      });

      const orden = { ALTO: 0, MEDIO: 1, BAJO: 2 };
      riesgos.sort((a, b) => orden[a.severidad] - orden[b.severidad] || (a.holgura ?? 99) - (b.holgura ?? 99));
      return riesgos;
    }

    function renderPanelRiesgos() {
      const riesgos = calcularPanelRiesgos(nodosGestorActual);
      if (riesgos.length === 0) {
        return `
          <div class="card">
            <h2>⚠️ Panel de riesgos</h2>
            <p style="font-size:12px; color:#888;">Nada en riesgo ahora mismo — sin tareas críticas retrasadas ni con poca holgura.</p>
          </div>`;
      }
      const colorSeveridad = { ALTO: '#dc3545', MEDIO: '#fd7e14', BAJO: '#b38600' };
      const etiquetaSeveridad = { ALTO: 'Riesgo alto', MEDIO: 'Riesgo medio', BAJO: 'Riesgo bajo' };
      const filas = riesgos.slice(0, 40).map(r => `
        <li>
          <span class="flecha" style="color:${colorSeveridad[r.severidad]};">●</span>
          <div>
            <div><strong>${r.nodo.codigo}</strong> ${r.nodo.nombre}${r.nodo.trabajador_nombre ? ` — 👷 ${r.nodo.trabajador_nombre}` : ''}</div>
            <div class="ruta-nodo">${rutaCompleta(r.nodo)} · <strong style="color:${colorSeveridad[r.severidad]};">${etiquetaSeveridad[r.severidad]}</strong>${r.esCritica ? ' · 🔺 ruta crítica' : ''}${r.retrasada ? ' · ⏰ retrasada' : ''}${(r.holgura !== null && !r.esCritica) ? ` · ⏳${r.holgura}d de margen` : ''}</div>
          </div>
        </li>
      `).join('');
      return `
        <div class="card">
          <h2>⚠️ Panel de riesgos (${riesgos.length})</h2>
          <p style="font-size:11px; color:#888; margin:-4px 0 8px;">De todos los buques — crítica + retrasada (alto), crítica o retrasada (medio), poca holgura (bajo). Requiere tener fechas previstas y dependencias cargadas.</p>
          <ul class="lista-nodos" style="max-height:320px; overflow-y:auto;">${filas}</ul>
        </div>`;
    }

    const ETIQUETAS_MOTIVO_RETRASO = {
      FALTA_MATERIAL: 'Falta de material',
      CAMBIO_DISENO: 'Cambio de diseño',
      AUSENCIA_PERSONAL: 'Ausencia de personal',
      DEPENDENCIA_EXTERNA: 'Dependencia externa',
      OTRO: 'Otro'
    };
    let chartMotivosRetraso = null;

    function renderMotivosRetrasoCard() {
      if (historialMotivosCache.length === 0) return '';
      return `
        <div class="card">
          <h2>📊 Motivos de retraso (${historialMotivosCache.length})</h2>
          <p style="font-size:11px; color:#888; margin:-4px 0 8px;">De todas las veces que se ha retrasado una fecha fin prevista y se ha indicado el motivo — de todos los buques, histórico completo.</p>
          <div style="height:220px;"><canvas id="chart-motivos-retraso"></canvas></div>
        </div>
      `;
    }

    function pintarMotivosRetraso() {
      const canvas = document.getElementById('chart-motivos-retraso');
      if (!canvas || typeof Chart === 'undefined') return;
      if (chartMotivosRetraso) { chartMotivosRetraso.destroy(); chartMotivosRetraso = null; }

      const conteo = {};
      historialMotivosCache.forEach(h => { conteo[h.motivo_categoria] = (conteo[h.motivo_categoria] || 0) + 1; });
      const claves = Object.keys(conteo).sort((a, b) => conteo[b] - conteo[a]);

      chartMotivosRetraso = new Chart(canvas.getContext('2d'), {
        type: 'bar',
        data: {
          labels: claves.map(c => ETIQUETAS_MOTIVO_RETRASO[c] || c),
          datasets: [{ label: 'Veces', data: claves.map(c => conteo[c]), backgroundColor: '#fd7e14' }]
        },
        options: {
          indexAxis: 'y',
          responsive: true, maintainAspectRatio: false,
          scales: { x: { beginAtZero: true, ticks: { precision: 0 } } },
          plugins: { legend: { display: false } }
        }
      });
    }

    async function renderVistaGestor(nodos) {
      nodosGestorActual = nodos;

      // Cualquiera con una tarea asignada puede salir en el selector de
      // "Tareas por tipo" -- no solo los TRABAJADOR. Desde que cualquier
      // usuario (incluido ADMIN/REVISOR) puede tomar una tarea sin asignar,
      // filtrar por rol dejaba fuera a quien se hubiera autoasignado algo.
      idsUsuariosGestor = new Set(nodos.filter(n => n.trabajador_id).map(n => n.trabajador_id));

      pintarVistaGestor();
    }

    function pintarVistaGestor() {
      const nodos = nodosGestorActual;

      const conteoGeneral = {};
      nodos.forEach(n => {
        const e = calcularEstadoPropio(n);
        conteoGeneral[e] = (conteoGeneral[e] || 0) + 1;
      });

      const nodosDetalle = filtroDetalleEstado ? nodos.filter(n => calcularEstadoPropio(n) === filtroDetalleEstado) : [];
      const tituloDetalle = filtroDetalleEstado
        ? `Detalle — ${ETIQUETAS_ESTADO[filtroDetalleEstado]} <button class="secundario" style="margin-left:8px; padding:2px 10px; font-size:11px;" onclick="limpiarFiltroDetalle()">✕ Cerrar</button>`
        : '';

      document.getElementById('contenido').innerHTML = `
        <div class="card">
          <h2>Estado general (${nodos.length} nodos)</h2>
          <p style="font-size:11px; color:#888; margin:-4px 0 8px;">Pulsa un estado para ver el detalle de esas tareas.</p>
          ${renderContadores(conteoGeneral, true, nodos.length)}
        </div>

        ${renderPanelRiesgos()}

        ${renderMotivosRetrasoCard()}

        ${filtroDetalleEstado ? `
          <div class="card">
            <h2>${tituloDetalle}</h2>
            <ul class="lista-nodos" style="max-height:340px; overflow-y:auto;">
              ${renderListaNodos(nodosDetalle, 'No hay tareas en este estado.', true)}
            </ul>
          </div>
        ` : ''}

        ${renderTareasPorTipoCard()}
      `;

      pintarMotivosRetraso();
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        document.querySelectorAll('.overlay').forEach(ov => { if (ov.style.display === 'flex') ov.style.display = 'none'; });
      }
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    iniciar();
  </script>
</body>
</html>
