<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESTRUCTURA - Cambiar contraseña</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 360px; margin: 80px auto; padding: 0 20px; color: #333; }
    h1 { font-size: 18px; }
    p { font-size: 13px; color: #666; }
    label { display: block; font-weight: bold; font-size: 12px; margin-top: 14px; margin-bottom: 4px; }
    input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
    button { width: 100%; margin-top: 20px; padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:disabled { background: #999; cursor: not-allowed; }
    .estado { font-size: 13px; margin-top: 12px; text-align: center; }
    .error { color: #dc3545; }
    .ok { color: #218838; }
  </style>
</head>
<body>
  <h1>🔑 Cambia tu contraseña</h1>
  <p>Es tu primer acceso, o el administrador te la ha reseteado. Elige una contraseña nueva antes de continuar.</p>

  <script>
    const SUPABASE_URL = 'https://wuarkraddnndmgvfnkmm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_qF-x44yXSydPBojMk_GOUg_TM34uXFI';
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <form id="form-cambiar">
    <label for="password1">Nueva contraseña</label>
    <input type="password" id="password1" minlength="8" required>

    <label for="password2">Repite la contraseña</label>
    <input type="password" id="password2" minlength="8" required>

    <button type="submit" id="btn-cambiar">Guardar</button>
    <div id="estado" class="estado"></div>
  </form>

  <script>
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    (async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        window.location.href = 'login.html';
      }
    })();

    document.getElementById('form-cambiar').addEventListener('submit', async (e) => {
      e.preventDefault();

      const p1 = document.getElementById('password1').value;
      const p2 = document.getElementById('password2').value;
      const estadoEl = document.getElementById('estado');
      const btn = document.getElementById('btn-cambiar');

      if (p1 !== p2) {
        estadoEl.textContent = 'Las dos contraseñas no coinciden';
        estadoEl.className = 'estado error';
        return;
      }
      if (p1.length < 8) {
        estadoEl.textContent = 'Debe tener al menos 8 caracteres';
        estadoEl.className = 'estado error';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Guardando...';
      estadoEl.textContent = '';
      estadoEl.className = 'estado';

      const { error: errorPassword } = await supabaseClient.auth.updateUser({ password: p1 });

      if (errorPassword) {
        estadoEl.textContent = 'Error: ' + errorPassword.message;
        estadoEl.className = 'estado error';
        btn.disabled = false;
        btn.textContent = 'Guardar';
        return;
      }

      const { error: errorRpc } = await supabaseClient.rpc('marcar_password_cambiada');

      if (errorRpc) {
        estadoEl.textContent = 'Contraseña cambiada, pero hubo un error al actualizar el perfil: ' + errorRpc.message;
        estadoEl.className = 'estado error';
        btn.disabled = false;
        btn.textContent = 'Guardar';
        return;
      }

      estadoEl.textContent = 'Contraseña actualizada. Redirigiendo...';
      estadoEl.className = 'estado ok';
      setTimeout(() => { window.location.href = 'usuarios.html'; }, 1200);
    });
  </script>
</body>
</html>
