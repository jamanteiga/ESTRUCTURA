<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESTRUCTURA - Prueba admin-create-user</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 20px; color: #333; }
    h1 { font-size: 20px; }
    h2 { font-size: 16px; margin-top: 30px; border-top: 1px solid #ddd; padding-top: 20px; }
    .card { background: #f8f9fa; border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    label { display: block; font-weight: bold; font-size: 12px; margin-bottom: 4px; margin-top: 10px; }
    input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
    button { margin-top: 14px; padding: 8px 16px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #0069d9; }
    button:disabled { background: #999; cursor: not-allowed; }
    #resultado { white-space: pre-wrap; background: #1e1e1e; color: #d4d4d4; padding: 12px; border-radius: 6px; font-size: 12px; margin-top: 10px; display: none; }
    .estado { font-size: 13px; margin-top: 8px; }
    .ok { color: #218838; }
    .error { color: #dc3545; }
  </style>
</head>
<body>

  <h1>🧪 Prueba: admin-create-user</h1>

  <!-- ============================================================
       PON AQUÍ TUS DATOS REALES (Project Settings → API)
       ============================================================ -->
  <script>
    const SUPABASE_URL = 'https://wuarkraddnndmgvfnkmm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_qF-x44yXSydPBojMk_GOUg_TM34uXFI';
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <div class="card">
    <h2 style="margin-top:0; border-top:none; padding-top:0;">1. Sesión</h2>
    <div id="estado-sesion" class="estado">Comprobando sesión...</div>

    <div id="bloque-login">
      <label for="email-login">Tu email (debe ser el ADMIN ya creado)</label>
      <input type="email" id="email-login" placeholder="admin@tuempresa.com">
      <button onclick="enviarMagicLink()">Enviar Magic Link</button>
    </div>

    <div id="bloque-logout" style="display:none;">
      <button onclick="cerrarSesion()">Cerrar sesión</button>
    </div>
  </div>

  <div class="card">
    <h2 style="margin-top:0; border-top:none; padding-top:0;">2. Crear usuario</h2>
    <label for="email-nuevo">Email del nuevo usuario</label>
    <input type="email" id="email-nuevo" placeholder="trabajador@tuempresa.com">

    <label for="nombre-nuevo">Nombre completo</label>
    <input type="text" id="nombre-nuevo" placeholder="Nombre Apellidos">

    <label for="rol-nuevo">Rol</label>
    <select id="rol-nuevo">
      <option value="TRABAJADOR">TRABAJADOR</option>
      <option value="REVISOR">REVISOR</option>
      <option value="ADMIN">ADMIN</option>
    </select>

    <button id="btn-crear" onclick="crearUsuario()">Crear usuario</button>
    <pre id="resultado"></pre>
  </div>

  <script>
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function actualizarEstadoSesion() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      const estadoEl = document.getElementById('estado-sesion');
      const loginEl = document.getElementById('bloque-login');
      const logoutEl = document.getElementById('bloque-logout');

      if (session) {
        estadoEl.textContent = `Sesión activa: ${session.user.email}`;
        estadoEl.className = 'estado ok';
        loginEl.style.display = 'none';
        logoutEl.style.display = 'block';
      } else {
        estadoEl.textContent = 'Sin sesión. Pide el Magic Link y ábrelo desde este mismo navegador.';
        estadoEl.className = 'estado';
        loginEl.style.display = 'block';
        logoutEl.style.display = 'none';
      }
    }

    async function enviarMagicLink() {
      const email = document.getElementById('email-login').value.trim();
      if (!email) { alert('Introduce un email'); return; }

      const { error } = await supabaseClient.auth.signInWithOtp({
        email,
        options: {
          shouldCreateUser: false,
          emailRedirectTo: window.location.href
        }
      });

      if (error) {
        alert('Error al enviar el Magic Link: ' + error.message);
      } else {
        alert('Revisa tu correo y abre el enlace en este mismo navegador/pestaña.');
      }
    }

    async function cerrarSesion() {
      await supabaseClient.auth.signOut();
      actualizarEstadoSesion();
    }

    async function crearUsuario() {
      const email = document.getElementById('email-nuevo').value.trim();
      const nombre_completo = document.getElementById('nombre-nuevo').value.trim();
      const rol = document.getElementById('rol-nuevo').value;
      const resultadoEl = document.getElementById('resultado');
      const btn = document.getElementById('btn-crear');

      if (!email || !nombre_completo) {
        alert('Rellena email y nombre completo');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Creando...';
      resultadoEl.style.display = 'block';
      resultadoEl.textContent = 'Llamando a admin-create-user...';

      const { data, error } = await supabaseClient.functions.invoke('admin-create-user', {
        body: { email, nombre_completo, rol }
      });

      btn.disabled = false;
      btn.textContent = 'Crear usuario';

      if (error) {
        resultadoEl.textContent = 'ERROR:\n' + JSON.stringify(error, null, 2);
      } else {
        resultadoEl.textContent = 'OK:\n' + JSON.stringify(data, null, 2);
      }
    }

    // Al cargar (incluido el regreso desde el Magic Link, que Supabase
    // detecta automáticamente en la URL), refrescamos el estado.
    actualizarEstadoSesion();
    supabaseClient.auth.onAuthStateChange(() => actualizarEstadoSesion());
  </script>
</body>
</html>
