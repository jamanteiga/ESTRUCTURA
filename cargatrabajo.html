<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESTRUCTURA - Carga de trabajo</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#007bff">
  <style>
    body { font-family: Arial, sans-serif; max-width: 1050px; margin: 30px auto; padding: 0 20px; color: #333; }
    h1 { font-size: 22px; }
    h2 { font-size: 15px; margin-top: 0; }
    .card { background: #f8f9fa; border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    body.vista-movil .solo-escritorio { display: none !important; }
    body.tema-oscuro { background: #1a1d21; color: #e0e0e0; }
    body.tema-oscuro .card { background: #24282e; border-color: #3a3f47; }
    body.tema-oscuro h1, body.tema-oscuro h2 { color: #f0f0f0; }
    body.tema-oscuro table { color: #e0e0e0; }
    body.tema-oscuro th { background: #14395c; }
    body.tema-oscuro td { border-color: #3a3f47; }
    body.tema-oscuro .overlay-caja { background: #24282e; color: #e0e0e0; }
    body.tema-oscuro select, body.tema-oscuro input { background: #1a1d21; color: #e0e0e0; border-color: #4a4f57; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    button { padding: 6px 12px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; }
    button.secundario { background: #6c757d; }
    button.secundario:hover { background: #5a6268; }
    .estado-msg { font-size: 13px; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; font-size: 12px; }
    th, td { padding: 6px; text-align: left; border-bottom: 1px solid #ddd; }
    th { background: #1c6e8c; color: white; font-size: 11px; }
    td.num { text-align: center; }

    .overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.55); align-items: center; justify-content: center; z-index: 5000;
    }
    .overlay-caja { background: white; border-radius: 8px; padding: 22px; max-width: 400px; width: 90%; }
    .overlay-caja h3 { margin-top: 0; font-size: 16px; }
    .overlay-caja label { display: block; font-weight: bold; font-size: 12px; margin: 10px 0 4px; }
    .overlay-caja select { width: 100%; padding: 7px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
    .overlay-botones { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
      @media (max-width: 480px) {
      body { margin: 10px auto; padding: 0 8px; box-sizing: border-box; }
      h1 { font-size: 18px; }
    }
</style>
</head>
<body>

  <div class="header-bar">
    <h1>👷 Carga de trabajo</h1>
    <div>
      <span id="texto-usuario" class="estado-msg"></span>
      <button class="secundario" onclick="alternarTema()">🌙/☀️</button>
      <button class="secundario" onclick="location.href='index.html'">🏠 Inicio</button>
      <button class="secundario" onclick="location.href='arbol.html'">🌳 Árbol</button>
      <button class="secundario" onclick="location.href='kanban.html'">🗂️ Kanban</button>
      <button class="secundario" id="btn-informe" onclick="location.href='informe.html'" style="display:none;">🖨️ Informe</button>
      <button class="secundario" onclick="cerrarSesion()">Cerrar sesión</button>
      <button style="background:#dc3545; color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-weight:bold; font-size:13px;" onclick="cerrarPagina()">❌ Cerrar</button>
    </div>
  </div>

  <div id="contenido">
    <p>Cargando...</p>
  </div>

  <div class="overlay" id="modal-aviso-resumen" style="z-index:5000;">
    <div class="overlay-caja" style="max-width:400px; text-align:center;">
      <p id="modal-aviso-resumen-texto" style="font-size:14px; margin:10px 0 18px; white-space:pre-line;"></p>
      <button onclick="document.getElementById('modal-aviso-resumen').style.display='none';">Aceptar</button>
    </div>
  </div>

  <div class="overlay" id="modal-reasignar-masivo">
    <div class="overlay-caja" style="max-width:480px;">
      <h3>↔ Reasignar tareas de <span id="rm-origen-nombre"></span></h3>
      <label>Pasar a</label>
      <select id="rm-destino"><option value="">Elige un usuario...</option></select>
      <p style="font-size:12px; color:#666; margin:10px 0 2px;">Tareas abiertas (desmarca las que no quieras mover):</p>
      <div id="rm-lista-tareas" style="max-height:240px; overflow-y:auto; border:1px solid #eee; border-radius:6px; padding:6px;"></div>
      <div class="estado-msg" id="rm-estado"></div>
      <div class="overlay-botones">
        <button class="secundario" onclick="cerrarModalReasignarMasivo()">Cancelar</button>
        <button onclick="confirmarReasignarMasivo()">Reasignar seleccionadas</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://wuarkraddnndmgvfnkmm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_qF-x44yXSydPBojMk_GOUg_TM34uXFI';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Detección de móvil/tablet: iPadOS manda user-agent de escritorio
    // ("Macintosh") desde iOS 13, así que se completa con pantalla táctil
    // real (navigator.maxTouchPoints, 0 en un Mac/PC sin pantalla táctil).
    const esTactil = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
    const esMovil = esTactil || window.innerWidth < 768;
    document.body.classList.toggle('vista-movil', esMovil);

    const TIPOS_SIN_ASIGNACION = new Set(['BUQUE']);

    const ESTADOS_ORDEN = ['sin_asignar', 'asignada_sin_empezar', 'en_proceso', 'pendiente_revision', 'pendiente_dudas', 'pendiente_cambios_modelo', 'aprobado', 'rechazado'];
    const ETIQUETAS_ESTADO = {
      sin_asignar: 'Sin asignar',
      asignada_sin_empezar: 'Pendiente de hacer',
      en_proceso: 'En proceso',
      pendiente_revision: 'Pendiente de revisión',
      pendiente_dudas: 'Pendiente de dudas',
      pendiente_cambios_modelo: 'Pendiente de cambios de modelo',
      aprobado: 'Aprobado',
      rechazado: 'Rechazado'
    };

    let miPerfil = null;
    let mapaNodoPorId = {};
    let nodosGestorActual = [];
    let idsUsuariosGestor = new Set();
    let filtroCargaUsuarioId = null;
    let filtroCargaEstado = null;

    function esGestor() { return miPerfil.rol === 'ADMIN' || miPerfil.rol === 'REVISOR'; }
    function esInvitado() { return miPerfil.rol === 'INVITADO'; }
    function pareceGestor() { return esGestor() || esInvitado(); }

    function calcularEstadoPropio(nodo) {
      if (nodo.revision_estado === 'APROBADO') return 'aprobado';
      if (nodo.revision_estado === 'RECHAZADO') return 'rechazado';
      if (nodo.revision_estado === 'PENDIENTE' || nodo.revision_estado === 'EN_REVISION') return 'pendiente_revision';
      if (nodo.trabajo_estado === 'EN_TRABAJO') return 'en_proceso';
      if (nodo.trabajo_estado === 'PENDIENTE_DUDAS') return 'pendiente_dudas';
      if (nodo.trabajo_estado === 'PENDIENTE_CAMBIOS_MODELO') return 'pendiente_cambios_modelo';
      if (nodo.trabajador_id) return 'asignada_sin_empezar';
      return 'sin_asignar';
    }

    async function registrarLog(accion, descripcion) {
      try {
        await supabaseClient.from('audit_log').insert({ accion, descripcion, user_agent: navigator.userAgent });
      } catch (e) {
        console.warn('No se pudo registrar el log:', e);
      }
    }

    async function cerrarSesion() {
      await registrarLog('LOGOUT', `Cerró sesión (${miPerfil?.username || ''})`);
      await supabaseClient.auth.signOut();
      window.location.href = 'login.html';
    }

    function cerrarPagina() {
      window.close();
      setTimeout(() => { history.back(); }, 150);
    }

    function aplicarTema(tema) {
      document.body.classList.toggle('tema-oscuro', tema === 'oscuro');
      localStorage.setItem('estructura_tema', tema);
    }
    function alternarTema() {
      aplicarTema(document.body.classList.contains('tema-oscuro') ? 'claro' : 'oscuro');
    }
    aplicarTema(localStorage.getItem('estructura_tema') || 'claro');

    function traducirError(mensaje) {
      if (!mensaje) return 'Ha ocurrido un error inesperado.';
      const m = mensaje.toLowerCase();
      if (m.includes('duplicate key')) return 'Ya existe un registro con ese mismo dato — no se puede repetir.';
      if (m.includes('violates foreign key constraint')) return 'No se puede completar: hace referencia a algo que ya no existe.';
      if (m.includes('new row violates row-level security') || m.includes('permission denied')) return 'No tienes permiso para hacer esto.';
      if (m.includes('failed to fetch') || m.includes('networkerror')) return 'No se pudo conectar — comprueba tu conexión a internet.';
      if (m.includes('jwt') || m.includes('token') || m.includes('session')) return 'Tu sesión ha caducado — vuelve a iniciar sesión.';
      return mensaje;
    }

    function mostrarAvisoModal(mensaje) {
      document.getElementById('modal-aviso-resumen-texto').textContent = mensaje;
      document.getElementById('modal-aviso-resumen').style.display = 'flex';
    }

    function formatearMinutos(mins) {
      if (mins === null || mins === undefined) return '—';
      const totalMin = Math.round(mins);
      if (totalMin <= 0) return '—';
      const dias = Math.floor(totalMin / 1440);
      const horas = Math.floor((totalMin % 1440) / 60);
      const m = totalMin % 60;
      if (dias > 0) return `${dias}d ${horas}h`;
      if (horas > 0) return `${horas}h ${m}min`;
      return `${m}min`;
    }

    function usuariosConTareasAsignadas(nodos) {
      const ids = [...new Set(nodos.filter(n => n.trabajador_id && idsUsuariosGestor.has(n.trabajador_id)).map(n => n.trabajador_id))];
      return ids
        .map(id => ({ id, nombre: nodos.find(n => n.trabajador_id === id)?.trabajador_nombre || '—' }))
        .sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
    }

    // -------------------- Perfiles + carga abierta (para el modal de reasignar) --------------------

    let perfilesCache = [];

    async function cargarPerfilesResumen() {
      const { data } = await supabaseClient.from('profiles').select('*').eq('activo', true);
      perfilesCache = (data || []).sort((a, b) =>
        (a.nombre_completo || '').localeCompare(b.nombre_completo || '', 'es', { sensitivity: 'base' })
      );
    }

    function calcularCargaAbiertaPorUsuario() {
      const carga = {};
      nodosGestorActual.forEach(n => {
        if (!n.trabajador_id || calcularEstadoPropio(n) === 'aprobado') return;
        carga[n.trabajador_id] = (carga[n.trabajador_id] || 0) + 1;
      });
      return carga;
    }

    function opcionesTrabajadorConCarga(usuarios, actualId) {
      const carga = calcularCargaAbiertaPorUsuario();
      const minCarga = usuarios.length ? Math.min(...usuarios.map(p => carga[p.id] || 0)) : null;
      return usuarios.map(p => {
        const n = carga[p.id] || 0;
        return `<option value="${p.id}" ${p.id === actualId ? 'selected' : ''}>${p.nombre_completo} — ${n} abierta(s)${n === minCarga ? ' 📉 menos carga' : ''}</option>`;
      }).join('');
    }

    // -------------------- Reasignación masiva (por usuario) --------------------

    let usuarioReasignarOrigenId = null;

    function abrirModalReasignarMasivo(usuarioOrigenId) {
      usuarioReasignarOrigenId = usuarioOrigenId;
      const origen = perfilesCache.find(p => p.id === usuarioOrigenId);
      document.getElementById('rm-origen-nombre').textContent = origen ? origen.nombre_completo : '';

      const abiertas = nodosGestorActual.filter(n => n.trabajador_id === usuarioOrigenId && calcularEstadoPropio(n) !== 'aprobado');
      const lista = document.getElementById('rm-lista-tareas');
      lista.innerHTML = abiertas.length === 0
        ? '<p style="font-size:12px; color:#888; margin:0;">Sin tareas abiertas.</p>'
        : abiertas.map(n => `
            <label style="display:flex; align-items:center; gap:6px; font-size:12px; padding:3px 0; font-weight:normal;">
              <input type="checkbox" class="rm-chk-tarea" value="${n.id}" checked style="width:auto;">
              <span><strong>${n.codigo}</strong> ${n.nombre} <span style="color:#888;">(${ETIQUETAS_ESTADO[calcularEstadoPropio(n)]})</span></span>
            </label>
          `).join('');

      const destinos = perfilesCache.filter(p => p.rol === 'TRABAJADOR' && p.id !== usuarioOrigenId);
      document.getElementById('rm-destino').innerHTML = '<option value="">Elige un usuario...</option>' +
        opcionesTrabajadorConCarga(destinos, null);

      document.getElementById('rm-estado').textContent = '';
      document.getElementById('modal-reasignar-masivo').style.display = 'flex';
    }

    function cerrarModalReasignarMasivo() {
      document.getElementById('modal-reasignar-masivo').style.display = 'none';
    }

    async function confirmarReasignarMasivo() {
      const estadoEl = document.getElementById('rm-estado');
      const destinoId = document.getElementById('rm-destino').value;
      if (!destinoId) { estadoEl.textContent = 'Elige a quién se reasignan.'; estadoEl.className = 'estado-msg error'; return; }

      const idsSeleccionados = Array.from(document.querySelectorAll('.rm-chk-tarea:checked')).map(chk => chk.value);
      if (idsSeleccionados.length === 0) { estadoEl.textContent = 'No has seleccionado ninguna tarea.'; estadoEl.className = 'estado-msg error'; return; }

      estadoEl.textContent = `Reasignando ${idsSeleccionados.length} tarea(s)...`; estadoEl.className = 'estado-msg';

      let fallos = 0;
      for (const nodeId of idsSeleccionados) {
        const nodo = mapaNodoPorId[nodeId];
        const { error } = await supabaseClient.rpc('asignar_trabajo', {
          p_node_id: nodeId, p_trabajador_id: destinoId, p_revisor_id: nodo?.revisor_id || null
        });
        if (error) fallos++;
      }

      const origen = perfilesCache.find(p => p.id === usuarioReasignarOrigenId);
      const destino = perfilesCache.find(p => p.id === destinoId);
      await registrarLog('REASIGNACION_MASIVA', `Reasignó ${idsSeleccionados.length - fallos} tarea(s) de ${origen?.nombre_completo || '?'} a ${destino?.nombre_completo || '?'}${fallos > 0 ? ` (${fallos} fallaron)` : ''}`);

      if (fallos > 0) {
        estadoEl.textContent = `${idsSeleccionados.length - fallos} reasignada(s), ${fallos} con error.`;
        estadoEl.className = 'estado-msg error';
        await cargarYPintar();
        return;
      }

      cerrarModalReasignarMasivo();
      await cargarYPintar();
    }

    // -------------------- Carga de trabajo por usuario --------------------

    function renderCargaTrabajo() {
      const nodos = nodosGestorActual;
      const usuariosParaFiltroCarga = usuariosConTareasAsignadas(nodos);
      const nodosParaCarga = nodos.filter(n =>
        (!filtroCargaUsuarioId || n.trabajador_id === filtroCargaUsuarioId) &&
        (!filtroCargaEstado || calcularEstadoPropio(n) === filtroCargaEstado)
      );

      const conteoPorUsuario = {};
      nodosParaCarga.forEach(n => {
        if (n.trabajador_id && idsUsuariosGestor.has(n.trabajador_id)) {
          if (!conteoPorUsuario[n.trabajador_id]) {
            conteoPorUsuario[n.trabajador_id] = { id: n.trabajador_id, nombre: n.trabajador_nombre, tiempoEnProcesoMs: 0 };
            ESTADOS_ORDEN.forEach(e => conteoPorUsuario[n.trabajador_id][e] = 0);
          }
          conteoPorUsuario[n.trabajador_id][calcularEstadoPropio(n)]++;
          if (n.trabajo_estado === 'EN_TRABAJO' && n.trabajo_iniciado_en) {
            conteoPorUsuario[n.trabajador_id].tiempoEnProcesoMs += (new Date() - new Date(n.trabajo_iniciado_en));
          }
        }
      });

      const columnasUsuario = ESTADOS_ORDEN.filter(e => e !== 'sin_asignar');

      const filasUsuario = Object.values(conteoPorUsuario)
        .sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'))
        .map(u => {
          const abiertas = columnasUsuario.reduce((acc, e) => acc + (e === 'aprobado' ? 0 : u[e]), 0);
          return `
          <tr>
            <td>${u.nombre}</td>
            <td class="num" style="font-weight:bold;">${abiertas}</td>
            <td class="num">${formatearMinutos(u.tiempoEnProcesoMs / 60000)}</td>
            ${columnasUsuario.map(e => `<td class="num">${u[e]}</td>`).join('')}
            <td class="num">${abiertas > 0 ? `<button class="secundario" style="padding:3px 8px; font-size:11px;" onclick="abrirModalReasignarMasivo('${u.id}')">↔ Reasignar</button>` : ''}</td>
          </tr>
        `;
        }).join('');

      return `
        <div class="card">
          <h2>👷 Carga de trabajo por usuario</h2>
          <p style="font-size:11px; color:#888; margin:-4px 0 8px;">"Abiertas" = tareas sin aprobar todavía. "En proceso" = tiempo acumulado de las tareas que tiene empezadas ahora mismo (para repartir carga).</p>
          <div style="display:flex; gap:14px; flex-wrap:wrap; align-items:center; margin-bottom:8px;">
            <label style="font-size:12px; font-weight:bold;">Usuario:
              <select onchange="filtroCargaUsuarioId = this.value || null; pintar();" style="padding:4px; border-radius:4px; border:1px solid #ccc; margin-left:6px;">
                <option value="" ${!filtroCargaUsuarioId ? 'selected' : ''}>Todos</option>
                ${usuariosParaFiltroCarga.map(u => `<option value="${u.id}" ${u.id === filtroCargaUsuarioId ? 'selected' : ''}>${u.nombre}</option>`).join('')}
              </select>
            </label>
            <label style="font-size:12px; font-weight:bold;">Estado:
              <select onchange="filtroCargaEstado = this.value || null; pintar();" style="padding:4px; border-radius:4px; border:1px solid #ccc; margin-left:6px;">
                <option value="" ${!filtroCargaEstado ? 'selected' : ''}>Todos</option>
                ${columnasUsuario.map(e => `<option value="${e}" ${e === filtroCargaEstado ? 'selected' : ''}>${ETIQUETAS_ESTADO[e]}</option>`).join('')}
              </select>
            </label>
            ${(filtroCargaUsuarioId || filtroCargaEstado) ? `<button class="secundario" style="padding:3px 10px; font-size:11px;" onclick="filtroCargaUsuarioId=null; filtroCargaEstado=null; pintar();">✕ Quitar filtros</button>` : ''}
          </div>
          <table>
            <thead>
              <tr>
                <th>Usuario</th>
                <th>Abiertas</th>
                <th>⏱️ En proceso</th>
                ${columnasUsuario.map(e => `<th>${ETIQUETAS_ESTADO[e]}</th>`).join('')}
                <th></th>
              </tr>
            </thead>
            <tbody>${filasUsuario || `<tr><td colspan="${columnasUsuario.length + 4}">${(filtroCargaUsuarioId || filtroCargaEstado) ? 'Nadie cumple ese filtro.' : 'Nadie tiene tareas asignadas todavía.'}</td></tr>`}</tbody>
          </table>
        </div>
      `;
    }

    function pintar() {
      document.getElementById('contenido').innerHTML = renderCargaTrabajo();
    }

    async function cargarYPintar() {
      const { data: nodos, error } = await supabaseClient.from('v_nodes_with_workflow').select('*').eq('activo', true);
      if (error) { document.getElementById('contenido').innerHTML = `<p style="color:red;">Error: ${error.message}</p>`; return; }
      mapaNodoPorId = {};
      nodos.forEach(n => { mapaNodoPorId[n.id] = n; });
      nodosGestorActual = nodos.filter(n => !TIPOS_SIN_ASIGNACION.has(n.tipo));

      const idsConTarea = [...new Set(nodosGestorActual.filter(n => n.trabajador_id).map(n => n.trabajador_id))];
      idsUsuariosGestor = new Set();
      if (idsConTarea.length > 0) {
        const { data: perfiles } = await supabaseClient.from('profiles').select('id, rol').in('id', idsConTarea);
        idsUsuariosGestor = new Set((perfiles || []).filter(p => p.rol === 'TRABAJADOR').map(p => p.id));
      }

      pintar();
    }

    let debounceRecarga = null;
    function recargarConDebounce() { clearTimeout(debounceRecarga); debounceRecarga = setTimeout(() => cargarYPintar(), 400); }
    function suscribirseARealtime() {
      supabaseClient.channel('carga_node_workflow').on('postgres_changes', { event: '*', schema: 'public', table: 'node_workflow' }, () => recargarConDebounce()).subscribe();
      supabaseClient.channel('carga_nodes').on('postgres_changes', { event: '*', schema: 'public', table: 'nodes' }, () => recargarConDebounce()).subscribe();
    }

    async function iniciar() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.href = 'login.html?next=cargatrabajo.html'; return; }

      const { data: perfil, error } = await supabaseClient
        .from('profiles').select('*').eq('id', session.user.id).single();

      if (error || !perfil || !perfil.activo) {
        document.body.innerHTML = '<p style="color:red; font-weight:bold; margin-top:60px; text-align:center;">No tienes acceso.</p>';
        return;
      }

      miPerfil = perfil;
      document.getElementById('texto-usuario').textContent =
        `${perfil.nombre_completo} (${perfil.username}) — ${{TRABAJADOR:'Usuario',REVISOR:'Supervisor',ADMIN:'Admin',INVITADO:'Invitado',WINDCHILL:'Windchill'}[perfil.rol] || perfil.rol}`;
      if (perfil.rol === 'ADMIN' || perfil.rol === 'REVISOR') document.getElementById('btn-informe').style.display = 'inline-block';

      if (!pareceGestor()) {
        document.getElementById('contenido').innerHTML = '<div class="card"><p>Esta página es para gestores. Ve a <a href="resumen.html">Resumen</a> para ver tus tareas.</p></div>';
        return;
      }

      await cargarPerfilesResumen();
      await cargarYPintar();
      suscribirseARealtime();
