<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESTRUCTURA - Hitos</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#007bff">
  <style>
    body { font-family: Arial, sans-serif; max-width: 1000px; margin: 20px auto; padding: 0 20px; color: #333; }
    h1 { font-size: 20px; margin: 0; }
    h2 { font-size: 15px; margin: 0 0 10px; }
    h3 { font-size: 13px; margin: 14px 0 6px; }
    .subtitulo { color: #666; font-size: 13px; margin-top: 2px; }
    .header-bar { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
    .card { background: #f8f9fa; border: 1px solid #ddd; border-radius: 8px; padding: 14px; margin-bottom: 14px; }
    body.tema-oscuro { background: #1a1d21; color: #e0e0e0; }
    body.tema-oscuro .card { background: #24282e; border-color: #3a3f47; }
    body.tema-oscuro h1, body.tema-oscuro h2 { color: #f0f0f0; }
    body.tema-oscuro .subtitulo { color: #a0a0a0; }
    body.tema-oscuro select, body.tema-oscuro input { background: #1a1d21; color: #e0e0e0; border-color: #4a4f57; }
    body.tema-oscuro table { color: #e0e0e0; }
    body.tema-oscuro td, body.tema-oscuro th { border-color: #3a3f47; }
    body.tema-oscuro .bloque-caja { background: #1f2329; border-color: #3a3f47; }
    body.tema-oscuro .fila-hito-fijo { border-bottom-color: #33373d; }

    button { padding: 6px 12px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; }
    button.secundario { background: #6c757d; }
    button.secundario:hover { background: #5a6268; }
    button.peligro { background: #dc3545; }
    button.pequeno { padding: 3px 9px; font-size: 11px; }
    select, input[type=text], input[type=date] { padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; box-sizing: border-box; }
    label { font-size: 12px; font-weight: bold; display: block; margin: 8px 0 3px; }

    .fila-hito-fijo {
      display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid #eee; font-size: 13px; flex-wrap: wrap;
    }
    .fila-hito-fijo .nombre-hito { flex: 1; min-width: 160px; font-weight: bold; }
    .fila-hito-fijo .fecha-guardada { color: #218838; font-weight: bold; }
    .fila-hito-fijo .sin-fecha { color: #999; font-style: italic; font-size: 12px; }

    .bloque-caja { border: 1px solid #ddd; border-radius: 6px; padding: 10px 12px; margin-bottom: 10px; background: white; }
    .bloque-caja h3 { margin-top: 0; }

    table { width: 100%; border-collapse: collapse; margin-top: 6px; background: white; font-size: 12px; }
    body.tema-oscuro table { background: transparent; }
    th, td { padding: 6px; text-align: left; border-bottom: 1px solid #ddd; }
    th { background: #1c6e8c; color: white; font-size: 11px; }

    .lista-ramas { max-height: 200px; overflow-y: auto; border: 1px solid #ddd; border-radius: 4px; display: none; }
    .opcion-rama { padding: 8px 10px; cursor: pointer; font-size: 13px; border-bottom: 1px solid #eee; }
    .opcion-rama:hover { background: #f5f8ff; }
    body.tema-oscuro .lista-ramas { border-color: #3a3f47; }
    body.tema-oscuro .opcion-rama { border-bottom-color: #33373d; }
    body.tema-oscuro .opcion-rama:hover { background: #2f343b; }

    .estado-msg { font-size: 13px; color: #666; margin-top: 6px; }
    .estado-msg.error { color: #dc3545; font-weight: bold; }

    @media (max-width: 480px) {
      body { margin: 10px auto; padding: 0 8px; box-sizing: border-box; }
      h1 { font-size: 18px; }
      .fila-hito-fijo { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <div>
      <h1>🎯 Hitos</h1>
      <div class="subtitulo" id="subtitulo-buque"></div>
    </div>
    <div>
      <button class="secundario" onclick="alternarTema()">🌙/☀️</button>
      <button class="peligro" onclick="cerrarPagina()">❌ Cerrar</button>
    </div>
  </div>

  <div class="card">
    <label for="sel-buque">Buque:</label>
    <select id="sel-buque"></select>
  </div>

  <p id="mensaje-vacio" style="display:none; color:#888;"></p>

  <div id="contenido-hitos" style="display:none;">

    <div class="card">
      <h2>🚢 Hitos generales del buque</h2>
      <div id="lista-hitos-buque"></div>
    </div>

    <div class="card">
      <h2>🧱 Bloques</h2>
      <p style="font-size:12px; color:#888; margin-top:-6px;" id="bloques-vacio">Este buque todavía no tiene ningún Bloque creado.</p>
      <div id="lista-bloques"></div>
    </div>

    <div class="card">
      <h2>➕ Añadir otro hito</h2>
      <p style="font-size:12px; color:#666; margin-top:-6px;">Para cualquier hito que no esté arriba — cambios, revisiones, o lo que haga falta durante el proyecto.</p>
      <label>Nombre</label>
      <input type="text" id="hito-nombre" placeholder="Ej: Entrega de planos a clase" style="width:100%;">
      <label>Fecha</label>
      <input type="date" id="hito-fecha" style="width:100%;">
      <label>Descripción (opcional)</label>
      <input type="text" id="hito-descripcion" placeholder="Opcional" style="width:100%;">
      <label>Enlazar a un Bloque/Subbloque (opcional)</label>
      <input type="text" id="hito-buscar-nodo" placeholder="Buscar por código o nombre..." style="width:100%;">
      <div class="lista-ramas" id="hito-lista-candidatos"></div>
      <div id="hito-nodo-elegido" style="font-size:12px; color:#0069d9; margin:4px 0; display:none;"></div>
      <div class="estado-msg" id="hitos-estado"></div>
      <div style="margin-top:10px;">
        <button onclick="guardarHitoLibre()">+ Añadir hito</button>
      </div>
    </div>

    <div class="card">
      <h2>📋 Todos los hitos de este buque (<span id="contador-hitos">0</span>)</h2>
      <div id="tabla-todos-hitos"></div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://wuarkraddnndmgvfnkmm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_qF-x44yXSydPBojMk_GOUg_TM34uXFI';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // -------------------- Registro de comunicaciones (log_comunicaciones.html) --------------------
    // Envuelve fetch para dejar constancia de cada llamada de red que hace
    // esta página (casi siempre a Supabase): a dónde, cuánto tarda y qué
    // datos le pasa. Aparte del registro de actividad (audit_log), que es
    // de acciones del usuario, no de tráfico de red.
    function redactarCuerpoComunicacion(cuerpoTexto) {
      if (!cuerpoTexto) return null;
      try {
        const limpiar = (o) => {
          if (Array.isArray(o)) return o.map(limpiar);
          if (o && typeof o === 'object') {
            const copia = {};
            Object.keys(o).forEach(k => { copia[k] = /password|contrase/i.test(k) ? '***' : limpiar(o[k]); });
            return copia;
          }
          return o;
        };
        return JSON.stringify(limpiar(JSON.parse(cuerpoTexto))).slice(0, 4000);
      } catch (e) {
        return String(cuerpoTexto).slice(0, 4000);
      }
    }
    (function () {
      const _fetchOriginal = window.fetch.bind(window);
      window.fetch = async function (input, init) {
        const inicio = performance.now();
        const url = typeof input === 'string' ? input : (input && input.url) || '';
        const metodo = (init && init.method) || (typeof input === 'object' && input && input.method) || 'GET';
        if (url.indexOf('/comunicaciones_log') !== -1) return _fetchOriginal(input, init);
        let respuesta, errorMsg = null;
        try {
          respuesta = await _fetchOriginal(input, init);
          return respuesta;
        } catch (e) {
          errorMsg = e.message;
          throw e;
        } finally {
          const duracionMs = Math.round(performance.now() - inicio);
          const cuerpo = init && init.body && typeof init.body === 'string' ? redactarCuerpoComunicacion(init.body) : null;
          supabaseClient.from('comunicaciones_log').insert({
            metodo, url, cuerpo, duracion_ms: duracionMs,
            status_code: respuesta ? respuesta.status : null, error: errorMsg
          }).then(() => {}, () => {});
        }
      };
    })();

    // -------------------- Modo mantenimiento --------------------
    // Si está activo y quien entra no es ADMIN, lo manda a mantenimiento.html
    // en vez de dejarle seguir. Se llama justo después de conocer el rol.
    async function comprobarMantenimiento(rol) {
      if (rol === 'ADMIN') return false;
      try {
        const { data } = await supabaseClient.from('app_mantenimiento').select('activo').eq('id', 1).single();
        if (data && data.activo) { window.location.href = 'mantenimiento.html'; return true; }
      } catch (e) { /* si falla la comprobación, no se bloquea la app por eso */ }
      return false;
    }


    let miPerfil = null;
    let buques = [];
    let buqueActualId = null;
    let mapaNodoPorId = {};
    let bloquesDelBuque = [];
    let hitosCache = [];
    let nodoHitoElegido = null;

    // Hitos "fijos" del buque: se identifican por su nombre exacto y por no
    // llevar ningún nodo enlazado (node_id null) — no hace falta ninguna
    // columna nueva en la tabla "hitos" para esto, basta con el nombre.
    const HITOS_FIJOS_BUQUE = [
      'Inicio de la ingeniería',
      'Fin de la ingeniería',
      'Puesta de quilla',
      'Botadura',
      'Pruebas de mar',
      'Entrega del buque'
    ];

    // Hitos "fijos" de cada Bloque: igual que arriba, pero enlazados al
    // nodo del Bloque en cuestión (node_id = id del Bloque).
    const HITOS_FIJOS_BLOQUE = [
      'Fecha de inicio',
      'Fecha de fin',
      'Puerta de calidad'
    ];

    function aplicarTema(tema) {
      document.body.classList.toggle('tema-oscuro', tema === 'oscuro');
      localStorage.setItem('estructura_tema', tema);
    }
    function alternarTema() {
      aplicarTema(document.body.classList.contains('tema-oscuro') ? 'claro' : 'oscuro');
    }
    aplicarTema(localStorage.getItem('estructura_tema') || 'claro');

    function cerrarPagina() {
      window.location.href = 'arbol.html';
    }

    async function registrarLog(accion, descripcion) {
      try {
        await supabaseClient.from('audit_log').insert({ accion, descripcion, user_agent: navigator.userAgent });
      } catch (e) {
        console.warn('No se pudo registrar el log:', e);
      }
    }

    function formatearFechaCorta(fecha) {
      return `${String(fecha.getDate()).padStart(2, '0')}/${String(fecha.getMonth() + 1).padStart(2, '0')}/${fecha.getFullYear()}`;
    }

    async function iniciar() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.href = 'login.html?next=hitos.html'; return; }

      const { data: perfil, error } = await supabaseClient
        .from('profiles').select('*').eq('id', session.user.id).single();

      if (error || !perfil || !perfil.activo || !(perfil.rol === 'ADMIN' || perfil.rol === 'REVISOR')) {
        document.body.innerHTML = '<p style="color:red; font-weight:bold; margin-top:60px; text-align:center;">Solo ADMIN o Supervisor pueden ver los hitos.</p>';
        return;
      }
      miPerfil = perfil;
      if (await comprobarMantenimiento(perfil.rol)) return;

      const { data: nodosBuque } = await supabaseClient
        .from('nodes').select('id, codigo, nombre').eq('tipo', 'BUQUE').eq('activo', true).order('codigo');
      buques = nodosBuque || [];

      if (buques.length === 0) {
        document.getElementById('mensaje-vacio').style.display = 'block';
        document.getElementById('mensaje-vacio').textContent = 'No hay ningún Buque creado todavía.';
        return;
      }

      const params = new URLSearchParams(window.location.search);
      const buqueParam = params.get('buque');
      buqueActualId = (buqueParam && buques.some(b => b.id === buqueParam)) ? buqueParam : buques[0].id;

      const sel = document.getElementById('sel-buque');
      sel.innerHTML = buques.map(b => `<option value="${b.id}" ${b.id === buqueActualId ? 'selected' : ''}>${b.codigo} — ${b.nombre}</option>`).join('');
      sel.addEventListener('change', () => {
        buqueActualId = sel.value;
        const url = new URL(window.location.href);
        url.searchParams.set('buque', buqueActualId);
        window.history.replaceState({}, '', url);
        cargarDatosBuque();
      });

      document.getElementById('hito-buscar-nodo').oninput = (e) => pintarCandidatosHito(e.target.value);

      await cargarDatosBuque();
    }

    async function cargarDatosBuque() {
      document.getElementById('contenido-hitos').style.display = 'none';
      const buque = buques.find(b => b.id === buqueActualId);
      document.getElementById('subtitulo-buque').textContent = buque ? `${buque.codigo} — ${buque.nombre}` : '';

      const [{ data: nodosHijos }, { data: hitosCrudos }] = await Promise.all([
        supabaseClient.from('nodes').select('id, parent_id, tipo, codigo, nombre').eq('activo', true)
          .or(`id.eq.${buqueActualId},parent_id.eq.${buqueActualId}`),
        supabaseClient.from('hitos').select('*').eq('buque_id', buqueActualId).order('fecha')
      ]);

      mapaNodoPorId = {};
      (nodosHijos || []).forEach(n => { mapaNodoPorId[n.id] = n; });
      bloquesDelBuque = (nodosHijos || []).filter(n => n.tipo === 'BLOQUE').sort((a, b) => a.codigo.localeCompare(b.codigo, 'es'));
      hitosCache = hitosCrudos || [];

      document.getElementById('contenido-hitos').style.display = 'block';
      pintarHitosBuque();
      pintarBloques();
      pintarTablaTodos();
    }

    function buscarHito(nombre, nodeId) {
      return hitosCache.find(h => h.nombre === nombre && (h.node_id || null) === (nodeId || null));
    }

    function filaHitoFijo(nombre, nodeId, idHtml) {
      const hito = buscarHito(nombre, nodeId);
      if (hito) {
        return `
          <div class="fila-hito-fijo">
            <span class="nombre-hito">${nombre}</span>
            <span class="fecha-guardada">🚩 ${formatearFechaCorta(new Date(hito.fecha + 'T00:00:00'))}</span>
            <button class="secundario pequeno" onclick="eliminarHitoFijo('${hito.id}')">✕ Quitar</button>
          </div>`;
      }
      return `
        <div class="fila-hito-fijo">
          <span class="nombre-hito">${nombre}</span>
          <span class="sin-fecha">Sin fecha todavía</span>
          <input type="date" id="${idHtml}">
          <button class="pequeno" onclick="guardarHitoFijo('${nombre.replace(/'/g, "\\'")}', '${idHtml}', ${nodeId ? `'${nodeId}'` : 'null'})">Guardar</button>
        </div>`;
    }

    function pintarHitosBuque() {
      document.getElementById('lista-hitos-buque').innerHTML =
        HITOS_FIJOS_BUQUE.map((nombre, i) => filaHitoFijo(nombre, null, `fecha-buque-${i}`)).join('');
    }

    function pintarBloques() {
      document.getElementById('bloques-vacio').style.display = bloquesDelBuque.length === 0 ? 'block' : 'none';
      document.getElementById('lista-bloques').innerHTML = bloquesDelBuque.map((bloque, bi) => `
        <div class="bloque-caja">
          <h3>${bloque.codigo} — ${bloque.nombre}</h3>
          ${HITOS_FIJOS_BLOQUE.map((nombre, i) => filaHitoFijo(nombre, bloque.id, `fecha-bloque-${bi}-${i}`)).join('')}
        </div>
      `).join('');
    }

    async function guardarHitoFijo(nombre, idHtml, nodeId) {
      const fecha = document.getElementById(idHtml).value;
      if (!fecha) { alert('Elige una fecha primero.'); return; }
      const { error } = await supabaseClient.rpc('anadir_hito', {
        p_buque_id: buqueActualId, p_nombre: nombre, p_fecha: fecha, p_descripcion: null, p_node_id: nodeId
      });
      if (error) { alert('Error: ' + error.message); return; }
      registrarLog('HITO', `Fijó "${nombre}" (${fecha})${nodeId ? ` en ${mapaNodoPorId[nodeId]?.codigo || ''}` : ''}`);
      await cargarDatosBuque();
    }

    async function eliminarHitoFijo(id) {
      if (!confirm('¿Quitar esta fecha? Podrás volver a ponerla cuando quieras.')) return;
      const { error } = await supabaseClient.rpc('eliminar_hito', { p_id: id });
      if (error) { alert('Error: ' + error.message); return; }
      registrarLog('HITO', 'Quitó un hito fijo');
      await cargarDatosBuque();
    }

    function pintarCandidatosHito(texto) {
      const cont = document.getElementById('hito-lista-candidatos');
      const t = texto.trim().toLowerCase();
      if (!t) { cont.style.display = 'none'; return; }
      const candidatos = Object.values(mapaNodoPorId)
        .filter(n => n.id !== buqueActualId)
        .filter(n => n.codigo.toLowerCase().includes(t) || n.nombre.toLowerCase().includes(t))
        .slice(0, 20);
      cont.style.display = 'block';
      cont.innerHTML = candidatos.length === 0
        ? '<div class="opcion-rama">Sin resultados (busca por código o nombre de un Bloque/Subbloque de este buque).</div>'
        : candidatos.map(n => `<div class="opcion-rama" onclick="elegirNodoHito('${n.id}')"><strong>${n.codigo}</strong> ${n.nombre}</div>`).join('');
    }

    function elegirNodoHito(nodeId) {
      nodoHitoElegido = nodeId;
      const nodo = mapaNodoPorId[nodeId];
      const el = document.getElementById('hito-nodo-elegido');
      el.textContent = `Enlazado a: ${nodo.codigo} — ${nodo.nombre} (busca otro o borra el texto para quitarlo)`;
      el.style.display = 'block';
      document.getElementById('hito-lista-candidatos').style.display = 'none';
      document.getElementById('hito-buscar-nodo').value = '';
    }

    async function guardarHitoLibre() {
      const estadoEl = document.getElementById('hitos-estado');
      const nombre = document.getElementById('hito-nombre').value.trim();
      const fecha = document.getElementById('hito-fecha').value;
      const descripcion = document.getElementById('hito-descripcion').value.trim() || null;

      if (!nombre || !fecha) { estadoEl.textContent = 'Rellena nombre y fecha.'; estadoEl.className = 'estado-msg error'; return; }

      const { error } = await supabaseClient.rpc('anadir_hito', {
        p_buque_id: buqueActualId, p_nombre: nombre, p_fecha: fecha, p_descripcion: descripcion, p_node_id: nodoHitoElegido
      });
      if (error) {
        estadoEl.textContent = 'Error: ' + error.message; estadoEl.className = 'estado-msg error';
        registrarLog('INTENTO_FALLIDO', `Intento de añadir hito "${nombre}" denegado: ${error.message}`);
        return;
      }
      registrarLog('HITO', `Añadió el hito "${nombre}" (${fecha})`);
      estadoEl.textContent = ''; estadoEl.className = 'estado-msg';
      document.getElementById('hito-nombre').value = '';
      document.getElementById('hito-fecha').value = '';
      document.getElementById('hito-descripcion').value = '';
      document.getElementById('hito-nodo-elegido').style.display = 'none';
      nodoHitoElegido = null;

      await cargarDatosBuque();
    }

    async function eliminarHitoTabla(id) {
      if (!confirm('¿Quitar este hito?')) return;
      const { error } = await supabaseClient.rpc('eliminar_hito', { p_id: id });
      if (error) { alert('Error: ' + error.message); return; }
      registrarLog('HITO', 'Quitó un hito');
      await cargarDatosBuque();
    }

    function pintarTablaTodos() {
      document.getElementById('contador-hitos').textContent = hitosCache.length;
      const cont = document.getElementById('tabla-todos-hitos');
      if (hitosCache.length === 0) {
        cont.innerHTML = '<p style="font-size:12px; color:#888;">Todavía no hay ningún hito para este buque.</p>';
        return;
      }
      const filas = hitosCache.slice().sort((a, b) => a.fecha.localeCompare(b.fecha)).map(h => `
        <tr>
          <td>${formatearFechaCorta(new Date(h.fecha + 'T00:00:00'))}</td>
          <td>${h.nombre}</td>
          <td>${h.node_id && mapaNodoPorId[h.node_id] ? mapaNodoPorId[h.node_id].codigo : '—'}</td>
          <td>${h.descripcion || '—'}</td>
          <td><button class="secundario pequeno" onclick="eliminarHitoTabla('${h.id}')">✕</button></td>
        </tr>
      `).join('');
      cont.innerHTML = `
        <table>
          <thead><tr><th>Fecha</th><th>Nombre</th><th>Bloque/Subbloque</th><th>Descripción</th><th></th></tr></thead>
          <tbody>${filas}</tbody>
        </table>`;
    }

    iniciar();
  </script>
</body>
</html>
