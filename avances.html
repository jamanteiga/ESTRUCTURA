<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESTRUCTURA - Avances</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#007bff">
  <style>
    body { font-family: Arial, sans-serif; max-width: 1050px; margin: 30px auto; padding: 0 20px; color: #333; }
    h1 { font-size: 22px; }
    h2 { font-size: 15px; margin-top: 0; }
    .card { background: #f8f9fa; border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    body.vista-movil .solo-escritorio { display: none !important; }
    body.tema-oscuro { background: #1a1d21; color: #e0e0e0; }
    body.tema-oscuro .card { background: #24282e; border-color: #3a3f47; }
    body.tema-oscuro h1, body.tema-oscuro h2 { color: #f0f0f0; }
    body.tema-oscuro select, body.tema-oscuro input { background: #1a1d21; color: #e0e0e0; border-color: #4a4f57; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    button { padding: 6px 12px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; }
    button.secundario { background: #6c757d; }
    button.secundario:hover { background: #5a6268; }
    .estado-msg { font-size: 13px; }
      @media (max-width: 480px) {
      body { margin: 10px auto; padding: 0 8px; box-sizing: border-box; }
      h1 { font-size: 18px; }
    }
</style>
</head>
<body>

  <div class="header-bar">
    <h1>📉 Avances</h1>
    <div>
      <span id="texto-usuario" class="estado-msg"></span>
      <button class="secundario" onclick="alternarTema()">🌙/☀️</button>
      <button class="secundario" onclick="location.href='index.html'">🏠 Inicio</button>
      <button class="secundario" onclick="location.href='arbol.html'">🌳 Árbol</button>
      <button class="secundario" onclick="location.href='kanban.html'">🗂️ Kanban</button>
      <button class="secundario" id="btn-informe" onclick="location.href='informe.html'" style="display:none;">🖨️ Informe</button>
      <button class="secundario" onclick="cerrarSesion()">Cerrar sesión</button>
      <button style="background:#dc3545; color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-weight:bold; font-size:13px;" onclick="cerrarPagina()">❌ Cerrar</button>
    </div>
  </div>

  <div id="contenido">
    <p>Cargando...</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script>
    const SUPABASE_URL = 'https://wuarkraddnndmgvfnkmm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_qF-x44yXSydPBojMk_GOUg_TM34uXFI';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // -------------------- Registro de comunicaciones (log_comunicaciones.html) --------------------
    // Envuelve fetch para dejar constancia de cada llamada de red que hace
    // esta página (casi siempre a Supabase): a dónde, cuánto tarda y qué
    // datos le pasa. Aparte del registro de actividad (audit_log), que es
    // de acciones del usuario, no de tráfico de red.
    function redactarCuerpoComunicacion(cuerpoTexto) {
      if (!cuerpoTexto) return null;
      try {
        const limpiar = (o) => {
          if (Array.isArray(o)) return o.map(limpiar);
          if (o && typeof o === 'object') {
            const copia = {};
            Object.keys(o).forEach(k => { copia[k] = /password|contrase/i.test(k) ? '***' : limpiar(o[k]); });
            return copia;
          }
          return o;
        };
        return JSON.stringify(limpiar(JSON.parse(cuerpoTexto))).slice(0, 4000);
      } catch (e) {
        return String(cuerpoTexto).slice(0, 4000);
      }
    }
    (function () {
      const _fetchOriginal = window.fetch.bind(window);
      window.fetch = async function (input, init) {
        const inicio = performance.now();
        const url = typeof input === 'string' ? input : (input && input.url) || '';
        const metodo = (init && init.method) || (typeof input === 'object' && input && input.method) || 'GET';
        if (url.indexOf('/comunicaciones_log') !== -1) return _fetchOriginal(input, init);
        let respuesta, errorMsg = null;
        try {
          respuesta = await _fetchOriginal(input, init);
          return respuesta;
        } catch (e) {
          errorMsg = e.message;
          throw e;
        } finally {
          const duracionMs = Math.round(performance.now() - inicio);
          const cuerpo = init && init.body && typeof init.body === 'string' ? redactarCuerpoComunicacion(init.body) : null;
          supabaseClient.from('comunicaciones_log').insert({
            metodo, url, cuerpo, duracion_ms: duracionMs,
            status_code: respuesta ? respuesta.status : null, error: errorMsg
          }).then(() => {}, () => {});
        }
      };
    })();

    // -------------------- Modo mantenimiento --------------------
    // Si está activo y quien entra no es ADMIN, lo manda a mantenimiento.html
    // en vez de dejarle seguir. Se llama justo después de conocer el rol.
    async function comprobarMantenimiento(rol) {
      if (rol === 'ADMIN') return false;
      try {
        const { data } = await supabaseClient.from('app_mantenimiento').select('activo').eq('id', 1).single();
        if (data && data.activo) { window.location.href = 'mantenimiento.html'; return true; }
      } catch (e) { /* si falla la comprobación, no se bloquea la app por eso */ }
      return false;
    }


    // Detección de móvil/tablet: iPadOS manda user-agent de escritorio
    // ("Macintosh") desde iOS 13, así que se completa con pantalla táctil
    // real (navigator.maxTouchPoints, 0 en un Mac/PC sin pantalla táctil).
    const esTactil = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
    const esMovil = esTactil || window.innerWidth < 768;
    document.body.classList.toggle('vista-movil', esMovil);

    const TIPOS_SIN_ASIGNACION = new Set(['BUQUE']);

    let miPerfil = null;
    let mapaNodoPorId = {};
    let nodosGestorActual = [];

    function esGestor() { return miPerfil.rol === 'ADMIN' || miPerfil.rol === 'REVISOR'; }
    function esInvitado() { return miPerfil.rol === 'INVITADO'; }
    function pareceGestor() { return esGestor() || esInvitado(); }

    function buqueDeNodo(nodo) {
      let actual = nodo;
      while (actual) {
        if (actual.tipo === 'BUQUE') return actual;
        actual = actual.parent_id ? mapaNodoPorId[actual.parent_id] : null;
      }
      return null;
    }

    function bloqueDeNodo(nodo) {
      let actual = nodo;
      while (actual) {
        if (actual.tipo === 'BLOQUE') return actual;
        actual = actual.parent_id ? mapaNodoPorId[actual.parent_id] : null;
      }
      return null;
    }

    function listaBloques() {
      return Object.values(mapaNodoPorId)
        .filter(n => n.tipo === 'BLOQUE')
        .sort((a, b) => (a.codigo || '').localeCompare(b.codigo || '', 'es', { numeric: true }));
    }

    async function registrarLog(accion, descripcion) {
      try {
        await supabaseClient.from('audit_log').insert({ accion, descripcion, user_agent: navigator.userAgent });
      } catch (e) {
        console.warn('No se pudo registrar el log:', e);
      }
    }

    async function cerrarSesion() {
      await registrarLog('LOGOUT', `Cerró sesión (${miPerfil?.username || ''})`);
      await supabaseClient.auth.signOut();
      window.location.href = 'login.html';
    }

    function cerrarPagina() {
      // Si se llegó aquí navegando desde árbol.html (lo normal, por el menú
      // lateral), volvemos atrás en el historial para recuperar esa misma
      // pestaña tal cual estaba -- con su estado y scroll -- en vez de
      // cargar un árbol.html nuevo desde cero (lo que dejaba efectivamente
      // una "segunda instancia" en la misma pestaña). Si no se llegó desde
      // árbol.html (p.ej. enlace directo, favorito), se navega igual que antes.
      if (document.referrer && document.referrer.indexOf('arbol.html') !== -1 && window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = 'arbol.html';
      }
    }

    function aplicarTema(tema) {
      document.body.classList.toggle('tema-oscuro', tema === 'oscuro');
      localStorage.setItem('estructura_tema', tema);
    }
    function alternarTema() {
      aplicarTema(document.body.classList.contains('tema-oscuro') ? 'claro' : 'oscuro');
    }
    aplicarTema(localStorage.getItem('estructura_tema') || 'claro');

    // -------------------- Curva de avance (plan vs. real) --------------------

    function construirCurvaAvanceParaPropios(propios) {
      const total = propios.length;
      if (total === 0) return null;

      const eventosPlan = propios.filter(n => n.fecha_fin_prevista).map(n => n.fecha_fin_prevista.slice(0, 10));
      const eventosReal = propios.filter(n => n.revision_estado === 'APROBADO' && n.revisado_en).map(n => n.revisado_en.slice(0, 10));
      if (eventosPlan.length === 0 && eventosReal.length === 0) return null;

      const hoyIso = new Date().toISOString().slice(0, 10);
      const fechas = [...new Set([...eventosPlan, ...eventosReal, hoyIso])].sort();

      const contarPlan = {}, contarReal = {};
      eventosPlan.forEach(f => contarPlan[f] = (contarPlan[f] || 0) + 1);
      eventosReal.forEach(f => contarReal[f] = (contarReal[f] || 0) + 1);

      let acumPlan = 0, acumReal = 0;
      const puntosPlan = [], puntosReal = [];
      fechas.forEach(f => {
        acumPlan += (contarPlan[f] || 0);
        acumReal += (contarReal[f] || 0);
        puntosPlan.push(Math.round((acumPlan / total) * 100));
        puntosReal.push(f <= hoyIso ? Math.round((acumReal / total) * 100) : null);
      });

      // "Va bien" = hoy el real acumulado alcanza o supera lo que el plan
      // decía que debería llevarse a estas alturas. hoyIso siempre está en
      // "fechas" (se añade explícitamente arriba), así que este índice
      // siempre existe.
      const indiceHoy = fechas.indexOf(hoyIso);
      const avanceRealHoy = puntosReal[indiceHoy];
      const avancePlanHoy = puntosPlan[indiceHoy];
      const vaBien = avanceRealHoy !== null && avanceRealHoy !== undefined && avanceRealHoy >= avancePlanHoy;

      return { labels: fechas.map(f => formatearFechaEjeCurva(f)), plan: puntosPlan, real: puntosReal, vaBien };
    }

    function construirCurvaAvance(buqueId) {
      const propios = nodosGestorActual.filter(n => { const b = buqueDeNodo(n); return b && b.id === buqueId; });
      return construirCurvaAvanceParaPropios(propios);
    }

    function construirCurvaAvanceBloque(bloqueId) {
      const propios = nodosGestorActual.filter(n => { const b = bloqueDeNodo(n); return b && b.id === bloqueId; });
      return construirCurvaAvanceParaPropios(propios);
    }

    function formatearFechaEjeCurva(iso) {
      const [a, m, d] = iso.split('-');
      return `${d}/${m}`;
    }

    let chartCurvaAvance = null;
    let buqueCurvaSeleccionado = null;

    function renderCurvaAvanceCard() {
      const buques = Object.values(mapaNodoPorId).filter(n => n.tipo === 'BUQUE');
      if (buques.length === 0) return '<div class="card"><p style="font-size:12px; color:#888;">Todavía no hay ningún buque.</p></div>';
      if (!buqueCurvaSeleccionado || !buques.some(b => b.id === buqueCurvaSeleccionado)) {
        buqueCurvaSeleccionado = buques[0].id;
      }
      return `
        <div class="card">
          <h2>📈 Curva de avance por buque — teórico vs. real</h2>
          <p style="font-size:11px; color:#888; margin:-4px 0 8px;">
            La línea teórica (verde) solo cuenta las tareas que ya tienen fecha fin prevista fijada (menú del árbol → Fechas previstas). La línea real se muestra en azul si hoy va igual o por delante de lo previsto, y en rojo si va por detrás.
          </p>
          <label style="display:inline-block; font-size:12px; font-weight:bold; margin-bottom:6px;">Buque:
            <select id="sel-curva-buque" onchange="buqueCurvaSeleccionado = this.value; pintarCurvaAvance();" style="padding:4px; border-radius:4px; border:1px solid #ccc; margin-left:6px;">
              ${buques.map(b => `<option value="${b.id}" ${b.id === buqueCurvaSeleccionado ? 'selected' : ''}>${b.codigo}${b.nombre ? ' — ' + b.nombre : ''}</option>`).join('')}
            </select>
          </label>
          <div id="curva-avance-vacio" style="display:none; font-size:12px; color:#888;">Todavía no hay fechas previstas ni tareas aprobadas en este buque para dibujar la curva.</div>
          <div style="height:280px;"><canvas id="chart-curva-avance"></canvas></div>
        </div>
      `;
    }

    function pintarCurvaAvance() {
      const canvas = document.getElementById('chart-curva-avance');
      if (!canvas || typeof Chart === 'undefined') return;
      const datos = construirCurvaAvance(buqueCurvaSeleccionado);
      const vacioEl = document.getElementById('curva-avance-vacio');

      if (chartCurvaAvance) { chartCurvaAvance.destroy(); chartCurvaAvance = null; }

      if (!datos) {
        canvas.style.display = 'none';
        if (vacioEl) vacioEl.style.display = 'block';
        return;
      }
      canvas.style.display = 'block';
      if (vacioEl) vacioEl.style.display = 'none';

      chartCurvaAvance = new Chart(canvas.getContext('2d'), {
        type: 'line',
        data: {
          labels: datos.labels,
          datasets: [
            { label: 'Teórico (% previsto acumulado)', data: datos.plan, borderColor: '#28a745', borderDash: [5, 4], pointRadius: 0, tension: 0.1 },
            { label: 'Real (% aprobado acumulado)', data: datos.real, borderColor: datos.vaBien ? '#007bff' : '#dc3545', pointRadius: 0, tension: 0.1, spanGaps: false }
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          scales: { y: { min: 0, max: 100, ticks: { callback: v => v + '%' } } },
          plugins: { legend: { position: 'bottom', labels: { boxWidth: 14, font: { size: 11 } } } }
        }
      });
    }

    // -------------------- Curva de avance por bloque --------------------

    let chartCurvaAvanceBloque = null;
    let bloqueCurvaSeleccionado = null;

    function renderCurvaAvanceBloqueCard() {
      const bloques = listaBloques();
      if (bloques.length === 0) return '';
      if (!bloqueCurvaSeleccionado || !bloques.some(b => b.id === bloqueCurvaSeleccionado)) {
        bloqueCurvaSeleccionado = bloques[0].id;
      }
      return `
        <div class="card">
          <h2>📈 Curva de avance por bloque — teórico vs. real</h2>
          <p style="font-size:11px; color:#888; margin:-4px 0 8px;">
            La línea teórica (verde) solo cuenta las tareas que ya tienen fecha fin prevista fijada (menú del árbol → Fechas previstas). La línea real se muestra en azul si hoy va igual o por delante de lo previsto, y en rojo si va por detrás.
          </p>
          <label style="display:inline-block; font-size:12px; font-weight:bold; margin-bottom:6px;">Bloque:
            <select id="sel-curva-bloque" onchange="bloqueCurvaSeleccionado = this.value; pintarCurvaAvanceBloque();" style="padding:4px; border-radius:4px; border:1px solid #ccc; margin-left:6px;">
              ${bloques.map(b => `<option value="${b.id}" ${b.id === bloqueCurvaSeleccionado ? 'selected' : ''}>${b.codigo}${b.nombre ? ' — ' + b.nombre : ''}</option>`).join('')}
            </select>
          </label>
          <div id="curva-avance-bloque-vacio" style="display:none; font-size:12px; color:#888;">Todavía no hay fechas previstas ni tareas aprobadas en este bloque para dibujar la curva.</div>
          <div style="height:280px;"><canvas id="chart-curva-avance-bloque"></canvas></div>
        </div>
      `;
    }

    function pintarCurvaAvanceBloque() {
      const canvas = document.getElementById('chart-curva-avance-bloque');
      if (!canvas || typeof Chart === 'undefined') return;
      const datos = construirCurvaAvanceBloque(bloqueCurvaSeleccionado);
      const vacioEl = document.getElementById('curva-avance-bloque-vacio');

      if (chartCurvaAvanceBloque) { chartCurvaAvanceBloque.destroy(); chartCurvaAvanceBloque = null; }

      if (!datos) {
        canvas.style.display = 'none';
        if (vacioEl) vacioEl.style.display = 'block';
        return;
      }
      canvas.style.display = 'block';
      if (vacioEl) vacioEl.style.display = 'none';

      chartCurvaAvanceBloque = new Chart(canvas.getContext('2d'), {
        type: 'line',
        data: {
          labels: datos.labels,
          datasets: [
            { label: 'Teórico (% previsto acumulado)', data: datos.plan, borderColor: '#28a745', borderDash: [5, 4], pointRadius: 0, tension: 0.1 },
            { label: 'Real (% aprobado acumulado)', data: datos.real, borderColor: datos.vaBien ? '#007bff' : '#dc3545', pointRadius: 0, tension: 0.1, spanGaps: false }
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          scales: { y: { min: 0, max: 100, ticks: { callback: v => v + '%' } } },
          plugins: { legend: { position: 'bottom', labels: { boxWidth: 14, font: { size: 11 } } } }
        }
      });
    }

    function pintar() {
      document.getElementById('contenido').innerHTML = `
        ${renderCurvaAvanceCard()}
        ${renderCurvaAvanceBloqueCard()}
      `;
      pintarCurvaAvance();
      pintarCurvaAvanceBloque();
    }

    async function cargarYPintar() {
      const { data: nodos, error } = await supabaseClient.from('v_nodes_with_workflow').select('*').eq('activo', true);
      if (error) { document.getElementById('contenido').innerHTML = `<p style="color:red;">Error: ${error.message}</p>`; return; }
      mapaNodoPorId = {};
      nodos.forEach(n => { mapaNodoPorId[n.id] = n; });
      nodosGestorActual = nodos.filter(n => !TIPOS_SIN_ASIGNACION.has(n.tipo));
      pintar();
    }

    let debounceRecarga = null;
    function recargarConDebounce() { clearTimeout(debounceRecarga); debounceRecarga = setTimeout(() => cargarYPintar(), 400); }
    function suscribirseARealtime() {
      supabaseClient.channel('avances_node_workflow').on('postgres_changes', { event: '*', schema: 'public', table: 'node_workflow' }, () => recargarConDebounce()).subscribe();
      supabaseClient.channel('avances_nodes').on('postgres_changes', { event: '*', schema: 'public', table: 'nodes' }, () => recargarConDebounce()).subscribe();
    }

    async function iniciar() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.href = 'login.html?next=avances.html'; return; }

      const { data: perfil, error } = await supabaseClient
        .from('profiles').select('*').eq('id', session.user.id).single();

      if (error || !perfil || !perfil.activo) {
        document.body.innerHTML = '<p style="color:red; font-weight:bold; margin-top:60px; text-align:center;">No tienes acceso.</p>';
        return;
      }

      miPerfil = perfil;
      if (await comprobarMantenimiento(perfil.rol)) return;
      document.getElementById('texto-usuario').textContent =
        `${perfil.nombre_completo} (${perfil.username}) — ${{TRABAJADOR:'Usuario',REVISOR:'Supervisor',ADMIN:'Admin',INVITADO:'Invitado',WINDCHILL:'Windchill'}[perfil.rol] || perfil.rol}`;
      if (perfil.rol === 'ADMIN' || perfil.rol === 'REVISOR') document.getElementById('btn-informe').style.display = 'inline-block';

      if (!pareceGestor()) {
        document.getElementById('contenido').innerHTML = '<div class="card"><p>Esta página es para gestores. Ve a <a href="resumen.html">Resumen</a> para ver tus tareas.</p></div>';
        return;
      }

      await cargarYPintar();
      suscribirseARealtime();
    }

    iniciar();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
