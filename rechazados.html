<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESTRUCTURA - Rechazados</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#007bff">
  <style>
    body { font-family: Arial, sans-serif; max-width: 1050px; margin: 30px auto; padding: 0 20px; color: #333; }
    h1 { font-size: 22px; }
    h2 { font-size: 15px; margin-top: 0; }
    .card { background: #f8f9fa; border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    body.vista-movil .solo-escritorio { display: none !important; }
    body.tema-oscuro { background: #1a1d21; color: #e0e0e0; }
    body.tema-oscuro .card { background: #24282e; border-color: #3a3f47; }
    body.tema-oscuro h1, body.tema-oscuro h2 { color: #f0f0f0; }
    body.tema-oscuro .ruta-nodo { color: #a0a0a0; }
    body.tema-oscuro .overlay-caja { background: #24282e; color: #e0e0e0; }
    body.tema-oscuro select, body.tema-oscuro input { background: #1a1d21; color: #e0e0e0; border-color: #4a4f57; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    button { padding: 6px 12px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; }
    button.secundario { background: #6c757d; }
    button.secundario:hover { background: #5a6268; }
    .estado-msg { font-size: 13px; }

    ul.lista-nodos { list-style: none; padding: 0; margin: 10px 0 0; }
    ul.lista-nodos li { padding: 8px; border-bottom: 1px solid #eee; font-size: 13px; display: flex; align-items: center; gap: 8px; }
    .flecha { font-size: 18px; flex-shrink: 0; width: 19px; text-align: center; }
    .f-rechazado { color: rgb(255,0,0); font-size: 22px; width: 22px; }
    .ruta-nodo { color: #666; font-size: 11px; }

    #menu-asignar-resumen {
      display: none; position: fixed; z-index: 4000; background: #fff; border: 1px solid #ccc;
      border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,0.25); min-width: 160px; padding: 4px 0; font-size: 13px;
    }
    #menu-asignar-resumen .mc-item { padding: 8px 14px; cursor: pointer; }
    #menu-asignar-resumen .mc-item:hover { background: #eef3ff; }
    #menu-asignar-resumen .mc-item.mc-padre::after { content: '▸'; float: right; color: #999; margin-left: 10px; }

    #submenu-estado-resumen {
      display: none; position: fixed; z-index: 4050; background: #fff; border: 1px solid #ccc;
      border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,0.25); min-width: 260px; padding: 4px 0; font-size: 13px;
    }
    #submenu-estado-resumen .mc-item { padding: 8px 14px; cursor: pointer; }
    #submenu-estado-resumen .mc-item:hover { background: #eef3ff; }

    .overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.55); align-items: center; justify-content: center; z-index: 5000;
    }
    .overlay-caja { background: white; border-radius: 8px; padding: 22px; max-width: 400px; width: 90%; }
    .overlay-caja h3 { margin-top: 0; font-size: 16px; }
    .overlay-caja label { display: block; font-weight: bold; font-size: 12px; margin: 10px 0 4px; }
    .overlay-caja select { width: 100%; padding: 7px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
    .overlay-botones { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
      @media (max-width: 480px) {
      body { margin: 10px auto; padding: 0 8px; box-sizing: border-box; }
      h1 { font-size: 18px; }
    }
</style>
</head>
<body>

  <div class="header-bar">
    <h1>✘ Rechazados</h1>
    <div>
      <span id="texto-usuario" class="estado-msg"></span>
      <button class="secundario" onclick="alternarTema()">🌙/☀️</button>
      <button class="secundario" onclick="location.href='index.html'">🏠 Inicio</button>
      <button class="secundario" onclick="location.href='arbol.html'">🌳 Árbol</button>
      <button class="secundario" onclick="location.href='kanban.html'">🗂️ Kanban</button>
      <button class="secundario" id="btn-informe" onclick="location.href='informe.html'" style="display:none;">🖨️ Informe</button>
      <button class="secundario" onclick="cerrarSesion()">Cerrar sesión</button>
      <button style="background:#dc3545; color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-weight:bold; font-size:13px;" onclick="cerrarPagina()">❌ Cerrar</button>
    </div>
  </div>

  <div id="contenido">
    <p>Cargando...</p>
  </div>

  <div id="menu-asignar-resumen"></div>
  <div id="submenu-estado-resumen"></div>

  <div class="overlay" id="modal-aviso-resumen" style="z-index:5000;">
    <div class="overlay-caja" style="max-width:400px; text-align:center;">
      <p id="modal-aviso-resumen-texto" style="font-size:14px; margin:10px 0 18px; white-space:pre-line;"></p>
      <button onclick="document.getElementById('modal-aviso-resumen').style.display='none';">Aceptar</button>
    </div>
  </div>

  <div class="overlay" id="modal-confirmacion-resumen" style="z-index:5000;">
    <div class="overlay-caja" style="max-width:400px; text-align:center;">
      <p id="modal-confirmacion-resumen-texto" style="font-size:14px; margin:10px 0 18px; white-space:pre-line;"></p>
      <div class="overlay-botones" style="justify-content:center;">
        <button class="secundario" id="confirmacion-resumen-no">Cancelar</button>
        <button id="confirmacion-resumen-si">Confirmar</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="modal-pedirtexto-resumen" style="z-index:5000;">
    <div class="overlay-caja" style="max-width:420px;">
      <p id="modal-pedirtexto-resumen-texto" style="font-size:14px; margin:10px 0 10px; white-space:pre-line;"></p>
      <textarea id="pedirtexto-resumen-input" rows="3" style="width:100%; box-sizing:border-box; padding:8px; border:1px solid #ccc; border-radius:4px; font-family:inherit; font-size:13px;"></textarea>
      <div class="overlay-botones">
        <button class="secundario" id="pedirtexto-resumen-cancel">Cancelar</button>
        <button id="pedirtexto-resumen-ok">Aceptar</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="modal-asignar-resumen">
    <div class="overlay-caja">
      <h3>Asignar usuario / supervisor</h3>
      <label>Usuario</label>
      <select id="ar-trabajador"><option value="">— Sin asignar —</option></select>
      <label>Supervisor</label>
      <select id="ar-revisor"><option value="">— Sin asignar —</option></select>
      <div class="estado-msg" id="ar-estado"></div>
      <div class="overlay-botones">
        <button class="secundario" onclick="cerrarModalAsignarResumen()">Cancelar</button>
        <button onclick="guardarAsignacionResumen()">Guardar</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://wuarkraddnndmgvfnkmm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_qF-x44yXSydPBojMk_GOUg_TM34uXFI';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Detección de móvil/tablet: iPadOS manda user-agent de escritorio
    // ("Macintosh") desde iOS 13, así que se completa con pantalla táctil
    // real (navigator.maxTouchPoints, 0 en un Mac/PC sin pantalla táctil).
    const esTactil = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
    const esMovil = esTactil || window.innerWidth < 768;
    document.body.classList.toggle('vista-movil', esMovil);

    const TIPOS_SIN_ASIGNACION = new Set(['BUQUE']);

    let miPerfil = null;
    let mapaNodoPorId = {};
    let nodosGestorActual = [];
    let filtroUsuarioId = null;

    function esGestor() { return miPerfil.rol === 'ADMIN' || miPerfil.rol === 'REVISOR'; }
    function esInvitado() { return miPerfil.rol === 'INVITADO'; }
    function pareceGestor() { return esGestor() || esInvitado(); }

    function calcularEstadoPropio(nodo) {
      if (nodo.revision_estado === 'APROBADO') return 'aprobado';
      if (nodo.revision_estado === 'RECHAZADO') return 'rechazado';
      if (nodo.revision_estado === 'PENDIENTE' || nodo.revision_estado === 'EN_REVISION') return 'pendiente_revision';
      if (nodo.trabajo_estado === 'EN_TRABAJO') return 'en_proceso';
      if (nodo.trabajo_estado === 'PENDIENTE_DUDAS') return 'pendiente_dudas';
      if (nodo.trabajo_estado === 'PENDIENTE_CAMBIOS_MODELO') return 'pendiente_cambios_modelo';
      if (nodo.trabajador_id) return 'asignada_sin_empezar';
      return 'sin_asignar';
    }

    function rutaCompleta(nodo) {
      const partes = [];
      let actual = nodo;
      while (actual) {
        partes.unshift(actual.codigo);
        actual = actual.parent_id ? mapaNodoPorId[actual.parent_id] : null;
      }
      return partes.join('>');
    }

    async function registrarLog(accion, descripcion) {
      try {
        await supabaseClient.from('audit_log').insert({ accion, descripcion, user_agent: navigator.userAgent });
      } catch (e) {
        console.warn('No se pudo registrar el log:', e);
      }
    }

    async function cerrarSesion() {
      await registrarLog('LOGOUT', `Cerró sesión (${miPerfil?.username || ''})`);
      await supabaseClient.auth.signOut();
      window.location.href = 'login.html';
    }

    function cerrarPagina() {
      // Vamos siempre directos al árbol. (Antes se intentaba window.close()
      // primero: en algunos navegadores/PWA esto no falla como cabría
      // esperar, sino que cierra la ventana actual y deja ver la que hubiera
      // debajo -- p.ej. otra pestaña o app -- en vez de volver al árbol.)
      window.location.href = 'arbol.html';
    }

    function aplicarTema(tema) {
      document.body.classList.toggle('tema-oscuro', tema === 'oscuro');
      localStorage.setItem('estructura_tema', tema);
    }
    function alternarTema() {
      aplicarTema(document.body.classList.contains('tema-oscuro') ? 'claro' : 'oscuro');
    }
    aplicarTema(localStorage.getItem('estructura_tema') || 'claro');

    function traducirError(mensaje) {
      if (!mensaje) return 'Ha ocurrido un error inesperado.';
      const m = mensaje.toLowerCase();
      if (m.includes('duplicate key')) return 'Ya existe un registro con ese mismo dato — no se puede repetir.';
      if (m.includes('violates foreign key constraint')) return 'No se puede completar: hace referencia a algo que ya no existe.';
      if (m.includes('new row violates row-level security') || m.includes('permission denied')) return 'No tienes permiso para hacer esto.';
      if (m.includes('failed to fetch') || m.includes('networkerror')) return 'No se pudo conectar — comprueba tu conexión a internet.';
      if (m.includes('jwt') || m.includes('token') || m.includes('session')) return 'Tu sesión ha caducado — vuelve a iniciar sesión.';
      return mensaje;
    }

    function mostrarAvisoModal(mensaje) {
      document.getElementById('modal-aviso-resumen-texto').textContent = mensaje;
      document.getElementById('modal-aviso-resumen').style.display = 'flex';
    }

    function mostrarConfirmacion(mensaje) {
      return new Promise((resolve) => {
        document.getElementById('modal-confirmacion-resumen-texto').textContent = mensaje;
        document.getElementById('modal-confirmacion-resumen').style.display = 'flex';
        const btnSi = document.getElementById('confirmacion-resumen-si');
        const btnNo = document.getElementById('confirmacion-resumen-no');
        const limpiar = () => { btnSi.onclick = null; btnNo.onclick = null; document.getElementById('modal-confirmacion-resumen').style.display = 'none'; };
        btnSi.onclick = () => { limpiar(); resolve(true); };
        btnNo.onclick = () => { limpiar(); resolve(false); };
      });
    }

    function pedirTexto(mensaje) {
      return new Promise((resolve) => {
        document.getElementById('modal-pedirtexto-resumen-texto').textContent = mensaje;
        const input = document.getElementById('pedirtexto-resumen-input');
        input.value = '';
        document.getElementById('modal-pedirtexto-resumen').style.display = 'flex';
        setTimeout(() => input.focus(), 50);
        const btnOk = document.getElementById('pedirtexto-resumen-ok');
        const btnCancel = document.getElementById('pedirtexto-resumen-cancel');
        const limpiar = () => { btnOk.onclick = null; btnCancel.onclick = null; document.getElementById('modal-pedirtexto-resumen').style.display = 'none'; };
        btnOk.onclick = () => { const v = input.value; limpiar(); resolve(v); };
        btnCancel.onclick = () => { limpiar(); resolve(null); };
      });
    }

    // -------------------- Asignar / cambiar estado (clic derecho) --------------------

    let perfilesCache = [];
    let nodoAsignarResumenActual = null;

    async function cargarPerfilesResumen() {
      const { data } = await supabaseClient.from('profiles').select('*').eq('activo', true);
      perfilesCache = (data || []).sort((a, b) =>
        (a.nombre_completo || '').localeCompare(b.nombre_completo || '', 'es', { sensitivity: 'base' })
      );
    }

    function mostrarMenuAsignarResumen(evento, nodeId) {
      nodoAsignarResumenActual = nodeId;
      const menu = document.getElementById('menu-asignar-resumen');
      menu.innerHTML = `
        <div class="mc-item" id="mc-asignar-item">👤 Asignar usuario / supervisor</div>
        <div class="mc-item mc-padre" id="mc-estado-item">Estado tarea</div>
      `;
      const avisoInvitado = () => mostrarAvisoModal('Eres un usuario Invitado: solo puedes consultar, no puedes realizar cambios.');
      document.getElementById('mc-asignar-item').addEventListener('click', (e) => {
        e.stopPropagation();
        cerrarMenuAsignarResumen();
        if (esInvitado()) { avisoInvitado(); return; }
        abrirModalAsignarResumen(nodeId);
      });
      document.getElementById('mc-estado-item').addEventListener('click', (e) => {
        e.stopPropagation();
        if (esInvitado()) { cerrarMenuAsignarResumen(); avisoInvitado(); return; }
        mostrarSubmenuEstadoResumen(document.getElementById('mc-estado-item'), nodeId);
      });
      menu.style.left = evento.clientX + 'px';
      menu.style.top = evento.clientY + 'px';
      menu.style.display = 'block';
    }
    function cerrarMenuAsignarResumen() {
      document.getElementById('menu-asignar-resumen').style.display = 'none';
      document.getElementById('submenu-estado-resumen').style.display = 'none';
    }
    document.addEventListener('click', cerrarMenuAsignarResumen);

    async function accionEstadoResumen(rpc, nodeId, params) {
      const { error } = await supabaseClient.rpc(rpc, { p_node_id: nodeId, ...(params || {}) });
      if (error) { mostrarAvisoModal('Error: ' + traducirError(error.message)); return; }
      await cargarYPintar();
    }

    function mostrarSubmenuEstadoResumen(elementoPadre, nodeId) {
      const opciones = [
        { label: '✔ Aprobado', fn: () => accionEstadoResumen('revisar_nodo', nodeId, { p_aprobado: true }) },
        { label: '✘ Rechazado', fn: async () => {
            const comentario = await pedirTexto('Motivo del rechazo (obligatorio):');
            if (!comentario || !comentario.trim()) return;
            accionEstadoResumen('revisar_nodo', nodeId, { p_aprobado: false, p_comentario: comentario });
          } },
        { label: 'Sin asignar', fn: async () => { if (await mostrarConfirmacion('¿Quitar el usuario asignado?')) accionEstadoResumen('desasignar_trabajador', nodeId); } },
        { label: 'Pendiente de hacer', fn: async () => { if (await mostrarConfirmacion('¿Reiniciar esta tarea?')) accionEstadoResumen('reiniciar_tarea', nodeId); } },
        { label: 'En proceso', fn: () => accionEstadoResumen('marcar_en_trabajo', nodeId) },
        { label: 'Pendiente de revisión', fn: () => accionEstadoResumen('marcar_terminado', nodeId) },
        { label: 'Pendiente de dudas', fn: () => accionEstadoResumen('marcar_pendiente_dudas', nodeId) },
        { label: 'Pendiente cambios en modelo', fn: () => accionEstadoResumen('marcar_pendiente_cambios_modelo', nodeId) }
      ];

      const sub = document.getElementById('submenu-estado-resumen');
      sub.innerHTML = opciones.map((o, i) => `<div class="mc-item" data-idx="${i}">${o.label}</div>`).join('');
      sub.querySelectorAll('.mc-item').forEach(el => {
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          cerrarMenuAsignarResumen();
          opciones[parseInt(el.dataset.idx, 10)].fn();
        });
      });

      const rect = elementoPadre.getBoundingClientRect();
      let x = rect.right + 2;
      if (x + 260 > window.innerWidth) x = rect.left - 262;
      let y = rect.top;
      if (y + 300 > window.innerHeight) y = window.innerHeight - 300;
      sub.style.left = x + 'px';
      sub.style.top = Math.max(y, 10) + 'px';
      sub.style.display = 'block';
    }

    function calcularCargaAbiertaPorUsuario() {
      const carga = {};
      nodosGestorActual.forEach(n => {
        if (!n.trabajador_id || calcularEstadoPropio(n) === 'aprobado') return;
        carga[n.trabajador_id] = (carga[n.trabajador_id] || 0) + 1;
      });
      return carga;
    }

    function opcionesTrabajadorConCarga(usuarios, actualId) {
      const carga = calcularCargaAbiertaPorUsuario();
      const minCarga = usuarios.length ? Math.min(...usuarios.map(p => carga[p.id] || 0)) : null;
      return usuarios.map(p => {
        const n = carga[p.id] || 0;
        return `<option value="${p.id}" ${p.id === actualId ? 'selected' : ''}>${p.nombre_completo} — ${n} abierta(s)${n === minCarga ? ' 📉 menos carga' : ''}</option>`;
      }).join('');
    }

    function abrirModalAsignarResumen(nodeId) {
      const nodo = mapaNodoPorId[nodeId];
      const selTrab = document.getElementById('ar-trabajador');
      const selRev = document.getElementById('ar-revisor');

      const usuarios = perfilesCache.filter(p => p.rol === 'TRABAJADOR');
      const revisores = perfilesCache.filter(p => p.rol === 'REVISOR');

      selTrab.innerHTML = '<option value="">— Sin asignar —</option>' + opcionesTrabajadorConCarga(usuarios, nodo.trabajador_id);
      selRev.innerHTML = '<option value="">— Sin asignar —</option>' +
        revisores.map(p => `<option value="${p.id}" ${p.id === nodo.revisor_id ? 'selected' : ''}>${p.nombre_completo}</option>`).join('');

      document.getElementById('ar-estado').textContent = '';
      document.getElementById('modal-asignar-resumen').style.display = 'flex';
    }
    function cerrarModalAsignarResumen() {
      document.getElementById('modal-asignar-resumen').style.display = 'none';
    }

    async function guardarAsignacionResumen() {
      const estadoEl = document.getElementById('ar-estado');
      const trabajadorId = document.getElementById('ar-trabajador').value || null;
      const revisorId = document.getElementById('ar-revisor').value || null;

      const { error } = await supabaseClient.rpc('asignar_trabajo', {
        p_node_id: nodoAsignarResumenActual, p_trabajador_id: trabajadorId, p_revisor_id: revisorId
      });

      if (error) { estadoEl.textContent = 'Error: ' + traducirError(error.message); estadoEl.className = 'estado-msg error'; return; }

      cerrarModalAsignarResumen();
      await cargarYPintar();
    }

    // -------------------- Rechazados --------------------

    function usuariosConTareasAsignadas(nodos) {
      const ids = [...new Set(nodos.filter(n => n.trabajador_id).map(n => n.trabajador_id))];
      return ids
        .map(id => ({ id, nombre: nodos.find(n => n.trabajador_id === id)?.trabajador_nombre || '—' }))
        .sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
    }

    function renderListaNodos(nodos, vacio) {
      if (nodos.length === 0) return `<li>${vacio}</li>`;
      return nodos.map(n => {
        const estado = calcularEstadoPropio(n);
        return `
          <li oncontextmenu="mostrarMenuAsignarResumen(event, '${n.id}'); return false;" style="cursor:context-menu;">
            <span class="flecha f-${estado}">▶</span>
            <div>
              <div><strong>${n.codigo}</strong> ${n.nombre} ${n.trabajador_nombre ? `— 👷 ${n.trabajador_nombre}` : ''}</div>
              <div class="ruta-nodo">${rutaCompleta(n)}${n.comentario_revision ? ' · ' + n.comentario_revision : ''}</div>
            </div>
          </li>
        `;
      }).join('');
    }

    function renderRechazados() {
      const usuarios = usuariosConTareasAsignadas(nodosGestorActual);
      const base = filtroUsuarioId ? nodosGestorActual.filter(n => n.trabajador_id === filtroUsuarioId) : nodosGestorActual;
      const rechazados = base.filter(n => n.revision_estado === 'RECHAZADO');

      return `
        <div class="card">
          <h2>✘ Rechazados pendientes de corrección (${rechazados.length})</h2>
          <p style="font-size:11px; color:#888; margin:-4px 0 8px;">Clic derecho sobre una tarea para asignarla o cambiar su estado.</p>
          <label style="display:inline-block; font-size:12px; font-weight:bold; margin-bottom:8px;">Usuario:
            <select onchange="filtroUsuarioId = this.value || null; pintar();" style="padding:4px; border-radius:4px; border:1px solid #ccc; margin-left:6px;">
              <option value="" ${!filtroUsuarioId ? 'selected' : ''}>Todos</option>
              ${usuarios.map(u => `<option value="${u.id}" ${u.id === filtroUsuarioId ? 'selected' : ''}>${u.nombre}</option>`).join('')}
            </select>
          </label>
          <ul class="lista-nodos" style="max-height:600px; overflow-y:auto;">
            ${renderListaNodos(rechazados, 'Ninguno ahora mismo.')}
          </ul>
        </div>
      `;
    }

    function pintar() {
      document.getElementById('contenido').innerHTML = renderRechazados();
    }

    async function cargarYPintar() {
      const { data: nodos, error } = await supabaseClient.from('v_nodes_with_workflow').select('*').eq('activo', true);
      if (error) { document.getElementById('contenido').innerHTML = `<p style="color:red;">Error: ${error.message}</p>`; return; }
      mapaNodoPorId = {};
      nodos.forEach(n => { mapaNodoPorId[n.id] = n; });
      nodosGestorActual = nodos.filter(n => !TIPOS_SIN_ASIGNACION.has(n.tipo));
      if (miPerfil.rol === 'TRABAJADOR') nodosGestorActual = nodosGestorActual.filter(n => n.trabajador_id === miPerfil.id);
      pintar();
    }

    let debounceRecarga = null;
    function recargarConDebounce() { clearTimeout(debounceRecarga); debounceRecarga = setTimeout(() => cargarYPintar(), 400); }
    function suscribirseARealtime() {
      supabaseClient.channel('rechazados_node_workflow').on('postgres_changes', { event: '*', schema: 'public', table: 'node_workflow' }, () => recargarConDebounce()).subscribe();
      supabaseClient.channel('rechazados_nodes').on('postgres_changes', { event: '*', schema: 'public', table: 'nodes' }, () => recargarConDebounce()).subscribe();
    }

    async function iniciar() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.href = 'login.html?next=rechazados.html'; return; }

      const { data: perfil, error } = await supabaseClient
        .from('profiles').select('*').eq('id', session.user.id).single();

      if (error || !perfil || !perfil.activo) {
        document.body.innerHTML = '<p style="color:red; font-weight:bold; margin-top:60px; text-align:center;">No tienes acceso.</p>';
        return;
      }

      miPerfil = perfil;
      document.getElementById('texto-usuario').textContent =
        `${perfil.nombre_completo} (${perfil.username}) — ${{TRABAJADOR:'Usuario',REVISOR:'Supervisor',ADMIN:'Admin',INVITADO:'Invitado',WINDCHILL:'Windchill'}[perfil.rol] || perfil.rol}`;
      if (perfil.rol === 'ADMIN' || perfil.rol === 'REVISOR') document.getElementById('btn-informe').style.display = 'inline-block';

      if (!pareceGestor() && miPerfil.rol !== 'TRABAJADOR') {
        document.getElementById('contenido').innerHTML = '<div class="card"><p>Esta página es para gestores. Ve a <a href="resumen.html">Resumen</a> para ver tus tareas.</p></div>';
        return;
      }

      await cargarPerfilesResumen();
      await cargarYPintar();
      suscribirseARealtime();
    }

    iniciar();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
