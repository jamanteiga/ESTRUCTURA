<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESTRUCTURA - Gantt</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 1400px; margin: 20px auto; padding: 0 20px; color: #333; }
    h1 { font-size: 20px; margin: 0; }
    .subtitulo { color: #666; font-size: 13px; margin-top: 2px; }
    .header-bar { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
    .card { background: #f8f9fa; border: 1px solid #ddd; border-radius: 8px; padding: 14px; margin-bottom: 14px; }
    button { padding: 6px 12px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; }
    button.secundario { background: #6c757d; }
    button.secundario:hover { background: #5a6268; }
    button.peligro { background: #dc3545; }
    select { padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
    .filtros { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    .leyenda { display: flex; gap: 16px; font-size: 12px; align-items: center; flex-wrap: wrap; }
    .leyenda .muestra { display: inline-block; width: 14px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
    .c-sin-empezar { background: #adb5bd; }
    .c-trabajo { background: #007bff; }
    .c-espera { background: #ffc107; }
    .c-agregado { background: #6f42c1; }

    .gantt-scroll { overflow-x: auto; overflow-y: auto; max-height: 70vh; border: 1px solid #ddd; border-radius: 6px; background: white; }
    .gantt-fila { display: flex; border-bottom: 1px solid #eee; align-items: center; }
    .gantt-fila:hover { background: rgba(0,123,255,0.05); }

    .col-info {
      position: sticky; left: 0; background: white; z-index: 2; display: flex; align-items: center;
      border-right: 1px solid #ddd; box-sizing: border-box; flex-shrink: 0;
    }
    .gantt-fila:hover .col-info { background: #f5f8ff; }
    .col-nombre { width: 260px; min-width: 260px; padding: 6px 8px; font-size: 12px; box-sizing: border-box; display: flex; align-items: center; gap: 4px; }
    .col-nombre .toggle { width: 14px; cursor: pointer; user-select: none; color: #666; font-size: 10px; flex-shrink: 0; }
    .col-nombre .toggle.vacio { visibility: hidden; }
    .col-nombre .tipo-tag { font-size: 8px; background: #e9ecef; padding: 1px 4px; border-radius: 8px; color: #777; margin-left: 3px; }
    .col-fecha { width: 130px; min-width: 130px; padding: 6px 6px; font-size: 11px; color: #555; box-sizing: border-box; }
    .col-duracion { width: 100px; min-width: 100px; padding: 6px 6px; font-size: 11px; color: #555; box-sizing: border-box; }
    .en-curso-txt { color: #007bff; font-style: italic; }

    .gantt-pista { position: relative; height: 30px; }
    .gantt-barra { position: absolute; top: 7px; height: 16px; border-radius: 3px; }

    .gantt-cabecera { display: flex; border-bottom: 2px solid #ccc; background: #f0f2f5; position: sticky; top: 0; z-index: 3; }
    .gantt-cabecera .col-info { background: #f0f2f5; font-weight: bold; font-size: 11px; }
    .gantt-dia { flex-shrink: 0; font-size: 10px; text-align: center; color: #666; border-right: 1px solid #eee; padding: 4px 0; }
    .gantt-dia.hoy { background: #fff3cd; font-weight: bold; }

    .estado-msg { font-size: 13px; color: #666; }

    @media print {
      @page { size: A3 landscape; margin: 10mm; }
      .no-imprimir { display: none !important; }
      body { margin: 0; padding: 0; max-width: 100%; width: 100%; }
      .gantt-scroll { overflow: visible; border: none; max-height: none; width: 100%; }
      .card.filtros, .card.leyenda { break-inside: avoid; }
    }
  </style>
</head>
<body>

  <div class="header-bar no-imprimir">
    <div>
      <h1 id="titulo-pagina">🗓️ Gantt</h1>
      <div class="subtitulo" id="subtitulo-fecha"></div>
    </div>
    <div>
      <button class="secundario" onclick="exportarExcel()">⬇ Exportar a Excel</button>
      <button class="secundario" onclick="window.print()">⬇ Exportar a PDF</button>
      <button class="peligro" onclick="cerrarPagina()">❌ Cerrar</button>
    </div>
  </div>

  <div id="titulo-pagina-print" style="display:none;"></div>

  <div class="card filtros no-imprimir">
    <label for="sel-buque" style="font-size:12px; font-weight:bold;">Buque:</label>
    <select id="sel-buque"></select>
    <button class="secundario" onclick="expandirTodoGantt()">⏬ Expandir todo</button>
    <button class="secundario" onclick="contraerTodoGantt()">⏫ Contraer todo</button>
  </div>

  <div class="card leyenda">
    <span><span class="muestra c-agregado"></span>Rama con varias tareas dentro (resumen)</span>
    <span><span class="muestra c-sin-empezar"></span>Asignada, sin empezar</span>
    <span><span class="muestra c-trabajo"></span>En proceso</span>
    <span><span class="muestra c-espera"></span>Esperando revisión</span>
  </div>

  <div class="estado-msg" id="mensaje-vacio" style="display:none; margin-bottom:10px;"></div>

  <div class="gantt-scroll" id="gantt-scroll-contenedor">
    <div id="gantt-contenido"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script>
    const SUPABASE_URL = 'https://wuarkraddnndmgvfnkmm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_qF-x44yXSydPBojMk_GOUg_TM34uXFI';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const PX_POR_DIA = 36;
    const ANCHO_MIN_BARRA = 6;

    let miPerfil = null;
    let mapaNodoPorId = {};
    let mapaHijosPorPadre = {};
    let buques = [];
    let buqueActualId = null;
    let nodosAbiertos = new Set();
    let cacheRangos = {};
    let filasParaExportar = [];

    async function registrarLog(accion, descripcion) {
      try {
        await supabaseClient.functions.invoke('bright-processor', { body: { accion, descripcion } });
      } catch (e) {
        console.warn('No se pudo registrar el log:', e);
      }
    }

    async function cerrarSesion() {
      await registrarLog('LOGOUT', `Cerró sesión (${miPerfil?.username || ''})`);
      await supabaseClient.auth.signOut();
      window.location.href = 'login.html';
    }

    function cerrarPagina() {
      window.close();
      setTimeout(() => { history.back(); }, 150);
    }

    function obtenerSemanaISO(fecha) {
      const d = new Date(Date.UTC(fecha.getFullYear(), fecha.getMonth(), fecha.getDate()));
      const diaSemana = d.getUTCDay() || 7;
      d.setUTCDate(d.getUTCDate() + 4 - diaSemana);
      const inicioAno = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
      return Math.ceil((((d - inicioAno) / 86400000) + 1) / 7);
    }

    const DIAS_SEMANA = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
    const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

    function formatearFechaLarga(fecha) {
      return `${DIAS_SEMANA[fecha.getDay()]} ${fecha.getDate()} de ${MESES[fecha.getMonth()]} de ${fecha.getFullYear()}`;
    }
    function formatearFechaCorta(fecha) {
      return `${String(fecha.getDate()).padStart(2,'0')}/${String(fecha.getMonth()+1).padStart(2,'0')}/${fecha.getFullYear()} ${String(fecha.getHours()).padStart(2,'0')}:${String(fecha.getMinutes()).padStart(2,'0')}`;
    }
    function formatearDuracionHM(inicio, fin) {
      if (!inicio) return null;
      const minutos = Math.floor((fin - inicio) / 60000);
      if (minutos < 0) return null;
      const horas = Math.floor(minutos / 60);
      const mins = minutos % 60;
      return `${horas}:${String(mins).padStart(2, '0')}`;
    }

    function actualizarCabecera(codigoBuque) {
      const hoy = new Date();
      const semana = obtenerSemanaISO(hoy);
      const texto = `${codigoBuque || ''} — Semana ${semana} — ${formatearFechaLarga(hoy)}`;
      document.getElementById('titulo-pagina').textContent = `🗓️ ${texto}`;
      document.getElementById('titulo-pagina-print').textContent = `Gantt — ${texto}`;
    }

    async function iniciar() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.href = 'login.html?next=gantt.html'; return; }

      const { data: perfil, error } = await supabaseClient
        .from('profiles').select('*').eq('id', session.user.id).single();

      if (error || !perfil || !perfil.activo || perfil.rol !== 'ADMIN') {
        document.body.innerHTML = '<p style="color:red; font-weight:bold; margin-top:60px; text-align:center;">Solo ADMIN puede ver el Gantt.</p>';
        return;
      }

      miPerfil = perfil;

      const { data: nodosBuque } = await supabaseClient
        .from('nodes').select('id, codigo, nombre').eq('tipo', 'BUQUE').eq('activo', true).order('codigo');
      buques = nodosBuque || [];

      if (buques.length === 0) {
        document.getElementById('mensaje-vacio').style.display = 'block';
        document.getElementById('mensaje-vacio').textContent = 'No hay ningún Buque creado todavía.';
        actualizarCabecera('');
        return;
      }

      const selBuque = document.getElementById('sel-buque');
      selBuque.innerHTML = buques.map(b => `<option value="${b.id}">${b.codigo}</option>`).join('');
      selBuque.addEventListener('change', () => { buqueActualId = selBuque.value; nodosAbiertos = new Set([buqueActualId]); cargarGantt(); });

      buqueActualId = buques[0].id;
      nodosAbiertos = new Set([buqueActualId]);
      await cargarGantt();
    }

    function expandirTodoGantt() {
      Object.keys(mapaNodoPorId).forEach(id => nodosAbiertos.add(id));
      pintarGantt();
    }
    function contraerTodoGantt() {
      nodosAbiertos = new Set([buqueActualId]);
      pintarGantt();
    }

    async function cargarGantt() {
      const contenedor = document.getElementById('gantt-contenido');
      const mensajeVacio = document.getElementById('mensaje-vacio');
      contenedor.innerHTML = 'Cargando...';
      mensajeVacio.style.display = 'none';

      const buqueSeleccionado = buques.find(b => b.id === buqueActualId);
      actualizarCabecera(buqueSeleccionado?.codigo || '');

      const { data: filasCrudas, error } = await supabaseClient
        .from('nodes')
        .select(`
          id, codigo, nombre, parent_id, tipo,
          node_workflow ( trabajador_id, asignado_en, trabajo_iniciado_en, trabajo_terminado_en, revisado_en )
        `)
        .eq('activo', true);

      if (error) { mensajeVacio.style.display = 'block'; mensajeVacio.textContent = 'Error: ' + error.message; return; }

      const todosNodos = filasCrudas.map(n => {
        const wf = Array.isArray(n.node_workflow) ? n.node_workflow[0] : n.node_workflow;
        return {
          id: n.id, codigo: n.codigo, nombre: n.nombre, parent_id: n.parent_id, tipo: n.tipo,
          asignado_en: wf?.asignado_en || null,
          trabajo_iniciado_en: wf?.trabajo_iniciado_en || null,
          trabajo_terminado_en: wf?.trabajo_terminado_en || null,
          revisado_en: wf?.revisado_en || null
        };
      });

      mapaNodoPorId = {};
      mapaHijosPorPadre = {};
      todosNodos.forEach(n => {
        mapaNodoPorId[n.id] = n;
        const clave = n.parent_id || '__raiz__';
        if (!mapaHijosPorPadre[clave]) mapaHijosPorPadre[clave] = [];
        mapaHijosPorPadre[clave].push(n);
      });

      if (!mapaNodoPorId[buqueActualId]) {
        mensajeVacio.style.display = 'block';
        mensajeVacio.textContent = 'No se encuentra el Buque seleccionado.';
        return;
      }

      nodosAbiertos = new Set(Object.keys(mapaNodoPorId));
      cacheRangos = {};
      pintarGantt();
    }

    function calcularRango(nodeId) {
      if (cacheRangos[nodeId]) return cacheRangos[nodeId];

      const nodo = mapaNodoPorId[nodeId];
      let inicio = nodo.asignado_en ? new Date(nodo.asignado_en) : null;
      let finPropio = nodo.asignado_en ? (nodo.revisado_en ? new Date(nodo.revisado_en) : null) : null;
      let tieneDato = !!nodo.asignado_en;
      let cerrado = nodo.asignado_en ? !!nodo.revisado_en : true;
      let finMax = finPropio;

      const hijos = mapaHijosPorPadre[nodeId] || [];
      hijos.forEach(h => {
        const r = calcularRango(h.id);
        if (r.tieneDato) {
          tieneDato = true;
          if (!inicio || r.inicio < inicio) inicio = r.inicio;
          if (r.fin && (!finMax || r.fin > finMax)) finMax = r.fin;
        }
        if (!r.cerrado) cerrado = false;
      });

      const resultado = { inicio, fin: cerrado ? finMax : null, cerrado, tieneDato };
      cacheRangos[nodeId] = resultado;
      return resultado;
    }

    function generarFilasVisibles(nodeId, nivel, lista) {
      lista.push({ id: nodeId, nivel });
      if (nodosAbiertos.has(nodeId)) {
        const hijos = mapaHijosPorPadre[nodeId] || [];
        hijos.forEach(h => generarFilasVisibles(h.id, nivel + 1, lista));
      }
    }

    function pintarGantt() {
      const contenedor = document.getElementById('gantt-contenido');
      const filas = [];
      generarFilasVisibles(buqueActualId, 0, filas);

      const rangoRaiz = calcularRango(buqueActualId);
      const ahora = new Date();

      if (!rangoRaiz.tieneDato) {
        contenedor.innerHTML = '';
        document.getElementById('mensaje-vacio').style.display = 'block';
        document.getElementById('mensaje-vacio').textContent = 'Este Buque no tiene ninguna tarea asignada todavía.';
        return;
      }
      document.getElementById('mensaje-vacio').style.display = 'none';

      let fechaMin = new Date(rangoRaiz.inicio); fechaMin.setHours(0, 0, 0, 0);
      let fechaMaxRef = rangoRaiz.fin || ahora;
      const fechaMaxDia = new Date(fechaMaxRef); fechaMaxDia.setHours(0, 0, 0, 0);
      const totalDias = Math.max(1, Math.round((fechaMaxDia - fechaMin) / 86400000) + 1);

      function diasDesde(fecha) { return (fecha - fechaMin) / 86400000; }

      const hoyDia = new Date(); hoyDia.setHours(0, 0, 0, 0);
      let cabeceraHtml = `
        <div class="gantt-cabecera">
          <div class="col-info">
            <div class="col-nombre">Nodo</div>
            <div class="col-fecha">Inicio</div>
            <div class="col-duracion">Duración</div>
            <div class="col-fecha">Fin</div>
          </div>`;
      for (let i = 0; i < totalDias; i++) {
        const dia = new Date(fechaMin); dia.setDate(dia.getDate() + i);
        const esHoy = dia.getTime() === hoyDia.getTime();
        cabeceraHtml += `<div class="gantt-dia ${esHoy ? 'hoy' : ''}" style="width:${PX_POR_DIA}px;">${String(dia.getDate()).padStart(2,'0')}/${String(dia.getMonth()+1).padStart(2,'0')}</div>`;
      }
      cabeceraHtml += `</div>`;

      filasParaExportar = [];

      let filasHtml = '';
      filas.forEach(({ id, nivel }) => {
        const nodo = mapaNodoPorId[id];
        const hijos = mapaHijosPorPadre[id] || [];
        const tieneHijos = hijos.length > 0;
        const abierto = nodosAbiertos.has(id);
        const rango = calcularRango(id);

        let textoInicio = '—', textoDuracion = '—', textoFin = '—';
        if (rango.tieneDato) {
          textoInicio = formatearFechaCorta(rango.inicio);
          const finParaDuracion = rango.fin || ahora;
          textoDuracion = formatearDuracionHM(rango.inicio, finParaDuracion) + (rango.cerrado ? '' : ' <span class="en-curso-txt">(en curso)</span>');
          textoFin = rango.fin ? formatearFechaCorta(rango.fin) : '<span class="en-curso-txt">(en curso)</span>';
          filasParaExportar.push({
            'Nombre': `${'  '.repeat(nivel)}${nodo.codigo} - ${nodo.nombre}`,
            'Start': rango.inicio.toISOString().slice(0, 10),
            'Finish': (rango.fin || ahora).toISOString().slice(0, 10),
            'Duration': `${Math.max(1, Math.ceil((finParaDuracion - rango.inicio) / 86400000))} days`
          });
        }

        let barrasHtml = '';
        if (rango.tieneDato) {
          if (tieneHijos) {
            const iniBar = diasDesde(rango.inicio);
            const finBar = diasDesde(rango.fin || ahora);
            barrasHtml = `<div class="gantt-barra c-agregado" style="left:${iniBar * PX_POR_DIA}px; width:${Math.max(ANCHO_MIN_BARRA, (finBar - iniBar) * PX_POR_DIA)}px;" title="Resumen de la rama"></div>`;
          } else if (nodo.asignado_en) {
            const iniAsig = diasDesde(new Date(nodo.asignado_en));
            const finAsig = nodo.trabajo_iniciado_en ? diasDesde(new Date(nodo.trabajo_iniciado_en)) : diasDesde(ahora);
            barrasHtml += `<div class="gantt-barra c-sin-empezar" style="left:${iniAsig*PX_POR_DIA}px; width:${Math.max(ANCHO_MIN_BARRA,(finAsig-iniAsig)*PX_POR_DIA)}px;" title="Asignada, sin empezar"></div>`;

            let finTrabajo = finAsig;
            if (nodo.trabajo_iniciado_en) {
              const iniTrab = finAsig;
              finTrabajo = nodo.trabajo_terminado_en ? diasDesde(new Date(nodo.trabajo_terminado_en)) : diasDesde(ahora);
              barrasHtml += `<div class="gantt-barra c-trabajo" style="left:${iniTrab*PX_POR_DIA}px; width:${Math.max(ANCHO_MIN_BARRA,(finTrabajo-iniTrab)*PX_POR_DIA)}px;" title="En proceso"></div>`;
            }
            if (nodo.trabajo_terminado_en) {
              const iniEsp = finTrabajo;
              const finEsp = nodo.revisado_en ? diasDesde(new Date(nodo.revisado_en)) : diasDesde(ahora);
              barrasHtml += `<div class="gantt-barra c-espera" style="left:${iniEsp*PX_POR_DIA}px; width:${Math.max(ANCHO_MIN_BARRA,(finEsp-iniEsp)*PX_POR_DIA)}px;" title="Esperando revisión"></div>`;
            }
          }
        }

        filasHtml += `
          <div class="gantt-fila">
            <div class="col-info">
              <div class="col-nombre" style="padding-left:${8 + nivel * 16}px;">
                <span class="toggle ${tieneHijos ? '' : 'vacio'}" onclick="toggleNodoGantt('${id}')">${abierto ? '▼' : '▶'}</span>
                <strong>${nodo.codigo}</strong> ${nodo.nombre}
                <span class="tipo-tag">${nodo.tipo}</span>
              </div>
              <div class="col-fecha">${textoInicio}</div>
              <div class="col-duracion">${textoDuracion}</div>
              <div class="col-fecha">${textoFin}</div>
            </div>
            <div class="gantt-pista" style="width:${totalDias * PX_POR_DIA}px;">${barrasHtml}</div>
          </div>
        `;
      });

      contenedor.innerHTML = cabeceraHtml + filasHtml;
    }

    function toggleNodoGantt(id) {
      if (nodosAbiertos.has(id)) nodosAbiertos.delete(id); else nodosAbiertos.add(id);
      pintarGantt();
    }

    function exportarExcel() {
      if (filasParaExportar.length === 0) { alert('No hay tareas que exportar.'); return; }
      const hoja = XLSX.utils.json_to_sheet(filasParaExportar);
      const libro = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(libro, hoja, 'WBS');
      const buqueCodigo = buques.find(b => b.id === buqueActualId)?.codigo || 'buque';
      XLSX.writeFile(libro, `gantt-wbs-${buqueCodigo}-${new Date().toISOString().slice(0,10)}.xlsx`);
      registrarLog('EXPORT_GANTT', `Exportó el Gantt WBS de "${buqueCodigo}" a Excel/Project (${filasParaExportar.length} filas)`);
    }

    iniciar();
  </script>
</body>
</html>
