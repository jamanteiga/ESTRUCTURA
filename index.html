<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESTRUCTURA</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="IMAGES/icon-192.png">
  <meta name="theme-color" content="#007bff">
  <style>
    body { font-family: Arial, sans-serif; max-width: 640px; margin: 60px auto; padding: 0 20px; color: #333; }
    h1 { font-size: 26px; text-align: center; margin-bottom: 4px; }
    @media (max-width: 480px) {
      body { margin: 20px auto; padding: 0 8px; box-sizing: border-box; }
      h1 { font-size: 20px; }
    }
    .subtitulo { text-align: center; color: #666; font-size: 14px; margin-bottom: 30px; }
    .tarjetas { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .tarjeta {
      background: transparent; border: none; border-radius: 10px; padding: 10px;
      text-align: center; text-decoration: none; color: #333; font-weight: bold;
      transition: transform 0.1s;
    }
    .tarjeta:hover { transform: translateY(-2px) scale(1.02); }
    .tarjeta .icono { font-size: 28px; display: block; margin-bottom: 8px; }
    .tarjeta .icono-img { width: 56px; height: 56px; object-fit: contain; display: block; margin: 0 auto 8px; }
    .tarjeta .imagen-completa { width: 100%; max-height: 130px; object-fit: contain; display: block; border: none; outline: none; }
    .titulo-con-foto { display: flex; align-items: center; justify-content: center; gap: 12px; }
    .titulo-con-foto img { width: 52px; height: 52px; object-fit: contain; border-radius: 6px; }
    .pie { text-align: center; margin-top: 30px; }
    button { padding: 8px 16px; background: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; }
    button:hover { background: #5a6268; }
    .estado-msg { text-align: center; color: #888; font-size: 13px; }
  </style>
</head>
<body>

  <div id="contenido" style="display:none;">
    <h1 class="titulo-con-foto"><img src="IMAGES/bloque_buque.jpg" alt=""> Gestión de bloques</h1>
    <div class="subtitulo" id="texto-usuario"></div>

    <div class="tarjetas">
      <a class="tarjeta" href="arbol.html">
        <img class="imagen-completa" src="IMAGES/ARBOL-ESTRUCTURA-NAVAL.jpg" alt="Árbol de estructura">
      </a>
      <a class="tarjeta" href="resumen.html">
        <img class="imagen-completa" src="IMAGES/RESUMEN.jpg" alt="Resumen">
      </a>
      <a class="tarjeta" href="kanban.html">
        <img class="imagen-completa" src="IMAGES/ARBOL-ESTRUCTURA-NAVAL-KANBAN1.jpg" alt="Kanban">
      </a>
      <a class="tarjeta" id="tarjeta-usuarios" href="usuarios.html" style="display:none;">
        <img class="imagen-completa" src="IMAGES/GESTION-USUARIOS.jpg" alt="Gestión de usuarios">
      </a>
      <a class="tarjeta" href="cambiar-password.html">
        <img class="imagen-completa" src="IMAGES/CAMBIAR-CONTRASENA.jpg" alt="Cambiar mi contraseña">
      </a>
    </div>

    <div class="pie">
      <button onclick="cerrarSesion()">Cerrar sesión</button>
    </div>
  </div>

  <p class="estado-msg" id="estado-carga">Comprobando sesión...</p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://wuarkraddnndmgvfnkmm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_qF-x44yXSydPBojMk_GOUg_TM34uXFI';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // -------------------- Registro de comunicaciones (log_comunicaciones.html) --------------------
    // Envuelve fetch para dejar constancia de cada llamada de red que hace
    // esta página (casi siempre a Supabase): a dónde, cuánto tarda y qué
    // datos le pasa. Aparte del registro de actividad (audit_log), que es
    // de acciones del usuario, no de tráfico de red.
    function redactarCuerpoComunicacion(cuerpoTexto) {
      if (!cuerpoTexto) return null;
      try {
        const limpiar = (o) => {
          if (Array.isArray(o)) return o.map(limpiar);
          if (o && typeof o === 'object') {
            const copia = {};
            Object.keys(o).forEach(k => { copia[k] = /password|contrase/i.test(k) ? '***' : limpiar(o[k]); });
            return copia;
          }
          return o;
        };
        return JSON.stringify(limpiar(JSON.parse(cuerpoTexto))).slice(0, 4000);
      } catch (e) {
        return String(cuerpoTexto).slice(0, 4000);
      }
    }
    (function () {
      const _fetchOriginal = window.fetch.bind(window);
      window.fetch = async function (input, init) {
        const inicio = performance.now();
        const url = typeof input === 'string' ? input : (input && input.url) || '';
        const metodo = (init && init.method) || (typeof input === 'object' && input && input.method) || 'GET';
        if (url.indexOf('/comunicaciones_log') !== -1) return _fetchOriginal(input, init);
        let respuesta, errorMsg = null;
        try {
          respuesta = await _fetchOriginal(input, init);
          return respuesta;
        } catch (e) {
          errorMsg = e.message;
          throw e;
        } finally {
          const duracionMs = Math.round(performance.now() - inicio);
          const cuerpo = init && init.body && typeof init.body === 'string' ? redactarCuerpoComunicacion(init.body) : null;
          supabaseClient.from('comunicaciones_log').insert({
            metodo, url, cuerpo, duracion_ms: duracionMs,
            status_code: respuesta ? respuesta.status : null, error: errorMsg
          }).then(() => {}, () => {});
        }
      };
    })();

    // -------------------- Modo mantenimiento --------------------
    // Si está activo y quien entra no es ADMIN, lo manda a mantenimiento.html
    // en vez de dejarle seguir. Se llama justo después de conocer el rol.
    async function comprobarMantenimiento(rol) {
      if (rol === 'ADMIN') return false;
      try {
        const { data } = await supabaseClient.from('app_mantenimiento').select('activo').eq('id', 1).single();
        if (data && data.activo) { window.location.href = 'mantenimiento.html'; return true; }
      } catch (e) { /* si falla la comprobación, no se bloquea la app por eso */ }
      return false;
    }

    let miPerfil = null;

    async function registrarLog(accion, descripcion) {
      try {
        await supabaseClient.from('audit_log').insert({ accion, descripcion, user_agent: navigator.userAgent });
      } catch (e) {
        console.warn('No se pudo registrar el log:', e);
      }
    }

    async function iniciar() {
      const { data: { session } } = await supabaseClient.auth.getSession();

      if (!session) {
        window.location.href = 'login.html?next=index.html';
        return;
      }

      const { data: perfil, error } = await supabaseClient
        .from('profiles')
        .select('*')
        .eq('id', session.user.id)
        .single();

      if (error || !perfil || !perfil.activo) {
        document.getElementById('estado-carga').textContent = 'No tienes acceso.';
        return;
      }

      if (perfil.debe_cambiar_password) {
        window.location.href = 'cambiar-password.html';
        return;
      }

      miPerfil = perfil;
      if (await comprobarMantenimiento(perfil.rol)) return;

      if (perfil.rol === 'TRABAJADOR') {
        // La app arranca siempre en el árbol para los usuarios normales.
        window.location.href = 'arbol.html';
        return;
      }

      document.getElementById('texto-usuario').textContent =
        `${perfil.nombre_completo} (${perfil.username}) — ${{TRABAJADOR:'Usuario',REVISOR:'Supervisor',ADMIN:'Admin',INVITADO:'Invitado',WINDCHILL:'Windchill'}[perfil.rol] || perfil.rol}`;

      if (perfil.rol === 'ADMIN') {
        document.getElementById('tarjeta-usuarios').style.display = 'block';
      }

      document.getElementById('estado-carga').style.display = 'none';
      document.getElementById('contenido').style.display = 'block';
    }

    async function cerrarSesion() {
      await registrarLog('LOGOUT', `Cerró sesión (${miPerfil?.username || ''})`);
      await supabaseClient.auth.signOut();
      window.location.href = 'login.html';
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    iniciar();
  </script>
</body>
</html>
